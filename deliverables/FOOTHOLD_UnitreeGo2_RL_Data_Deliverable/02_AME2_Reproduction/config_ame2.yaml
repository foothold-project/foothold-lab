# FOOTHOLD 02_AME2_Reproduction 학습 설정 (model_27000.pt 를 만든 실행의 원본 설정 덤프 · 고치지 않음)
# model_27000.pt = 저장본 tp424_in_p1_s5_from17000/model_16999.pt: 두 학습 tp424_p1_s4 · tp424_p2_s4 (16,500 -> 17,000) 끝 저장본의 가중치 평균
# 이 설정은 그 저장본 폴더의 params 이며 원본 tp424_p1_s4 의 params 와 바이트 단위로 같다 (tp424_p2_s4 는 seed 42 · run_name · log_dir 만 다름)
# 문서 1 = agent (rsl_rl OnPolicyRunner · PPO · AME2GazeModel actor · MoE critic) · 원본 params/agent.yaml (sha256 855b1b578eaded8aa3a4c8c167b364bdf51e501bea204646e85d4c3f91ca1530)
# 문서 2 = env (Isaac Lab ManagerBasedRLEnv · 장면 · 관측 · 행동 · 보상 · 종료 · 커리큘럼 · 명령) · 원본 params/env.yaml (sha256 48088f33708196c90c10d1e5b4971e6646796a718f3c1355e5afc68ea487c623)
# 읽기: yaml.unsafe_load_all(open(path)) · 문서 2 에는 Isaac Lab 이 남긴 !!python 태그가 있어 safe_load 로는 안 읽힌다
# 경로 (/network-volume/...) 는 학습 기계의 로컬 경로 기록이며 재현 때는 자기 경로로 바꾼다
---
class_name: OnPolicyRunner
seed: 1001
device: cuda:0
num_steps_per_env: 24
max_iterations: 17000
empirical_normalization: null
obs_groups:
  actor:
  - teacher_mapping
  - teacher_prop
  critic:
  - critic
clip_actions: null
save_interval: 500
experiment_name: go2_gaze_teacher
run_name: tp424_p1_s4_adam_fp32_4x3_from16500_to17000
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: tp424_in_p1_s4_from16500
load_checkpoint: model_16499.pt
torch_compile_mode: null
actor:
  class_name: AME2GazeModel
  num_heads: 32
  crop_x: 12
  crop_y: 10
  roi_coef: 0.01
  roi_margin: 0.45
  stochastic: true
  init_noise_std: 1.0
  noise_std_type: log
critic:
  class_name: MoEModel
  num_experts: 16
  stochastic: false
  init_noise_std: 1.0
  noise_std_type: log
algorithm:
  class_name: PPO
  optimizer: adam
  use_mixed_precision: false
  num_learning_epochs: 4
  num_mini_batches: 3
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.004
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  ent_coef_decay: 0.9999
  min_ent_coef: 0.001
  renorm_max_value_loss: 100.0
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: ame2_go2.tasks.mdp.symmetry:go2_symmetry_augmentation
    for_critic_only: true
