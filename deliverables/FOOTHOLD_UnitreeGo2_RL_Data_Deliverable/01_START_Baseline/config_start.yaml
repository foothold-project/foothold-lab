# FOOTHOLD 01_START_Baseline 학습 설정 (model_15500.pt 를 만든 실행 EX-42-B-E1F 의 원본 설정 덤프 · 고치지 않음)
# 문서 1 = agent (rsl_rl OnPolicyRunner · PPO · 정책 망 · 지각 모듈) · 원본 params/agent.yaml
# 문서 2 = env (Isaac Lab ManagerBasedRLEnv · 장면 · 관측 · 행동 · 보상 · 종료 · 커리큘럼 · 명령) · 원본 params/env.yaml
# 읽기: yaml.unsafe_load_all(open(path)) · 문서 2 에는 Isaac Lab 이 남긴 !!python 태그가 있어 safe_load 로는 안 읽힌다
# 경로 (/mnt/...) 는 학습 기계의 로컬 경로 기록이며 재현 때는 자기 경로로 바꾼다
---
