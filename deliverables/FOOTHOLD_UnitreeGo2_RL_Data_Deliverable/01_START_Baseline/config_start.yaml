  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
perception:
  fast_gt_only: false
  learning_rate: 0.0005
  weight_decay: 0.0
  num_learning_epochs: 5
  num_mini_batches: 4
  microbatch_envs: 64
  max_grad_norm: 1.0
  depth_dtype: float16
  replay_impl: a3
  replay_autocast: none
  kl_fp32: false
  latest_interval: 100
  status_interval: 10
  est_mode: learned
  oracle_vel_noise: 0.1
  critic_mode: clean52
  log_action_stats: true
  log_reward_split: true
  log_kl: true
  kl_probe_envs: 256
  contract: start
  stop_on_nonfinite: true
