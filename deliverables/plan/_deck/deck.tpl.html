<title>Find the Next Foothold</title>
<style>
@font-face{font-family:'Pretendard';src:url(data:font/woff2;base64,{{FONT}}) format('woff2');
  font-weight:45 920;font-style:normal;font-display:block}
:root{
  --night:#0d1117; --paper:#f6f5f1; --paper-2:#eeece6; --card:#ffffff;
  --ink:#161c26; --ink-2:#4a5566; --ink-3:#7c8798;
  --rule:#d9d6cd; --rule-d:#26303d;
  --teal:#0e7a6e; --teal-lit:#3ec7b4; --teal-soft:#e0f0ed; --teal-ink:#0b6459;
  --amber:#a86a08; --amber-lit:#dc9a30; --amber-soft:#fbf0dc;
  --red:#a3342a; --red-lit:#e0645a; --red-soft:#fbe9e7;
  --shell:#20262e; --shell-ink:#8d97a4;
  --sans:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
  --mono:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--shell);font-family:var(--sans);margin:0;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;word-break:keep-all}

.top{max-width:1360px;margin:0 auto;padding:34px 24px 10px;color:var(--shell-ink);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.top img{height:22px;display:block}
.top span{font-size:12.5px;letter-spacing:.02em}
.top .mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:11.5px}
.top .go{font:inherit;font-weight:700;color:var(--night);background:var(--teal-lit);border:0;border-radius:999px;padding:7px 15px;cursor:pointer}
.top .go:hover{filter:brightness(1.08)}
.top .keys{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:11px;opacity:.75}
.top kbd{background:#2c343e;border:1px solid #3b444f;border-radius:3px;
  padding:1px 5px;color:#c3cbd4;font-family:inherit;font-size:10.5px}

.deck{max-width:1360px;margin:0 auto;padding:8px 24px 80px;
  display:flex;flex-direction:column;gap:26px}
.row{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:stretch}
.gut{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:5px}
.gut i{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:12px;font-weight:600;color:var(--shell-ink)}
.gut u{flex:1;width:5px;border-radius:3px;text-decoration:none;display:block}
.gut u.night{background:#0d1117;box-shadow:inset 0 0 0 1px #333d49}
.gut u.paper{background:#f6f5f1}
.gut u.evid{background:#0e7a6e}
.gut u.video{background:repeating-linear-gradient(180deg,#3ec7b4 0 6px,transparent 6px 12px)}

.s{position:relative;aspect-ratio:16/9;container-type:size;overflow:hidden;border-radius:3px;
  box-shadow:0 1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.4)}
.s.night{background:var(--night);color:#e9ecef}
.s.paper{background:var(--paper);color:var(--ink)}
.pad{position:absolute;inset:0;padding:4.0cqw 5.0cqw;display:flex;flex-direction:column}

.hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.2cqw;flex:0 0 auto}
.paper .hd{border-bottom:1px solid var(--rule)}
.night .hd{border-bottom:1px solid var(--rule-d)}
.hd img.lk{height:3.0cqw;width:auto;display:block}
.eyebrow{font-weight:700;font-size:1.22cqw;letter-spacing:.18em;text-transform:uppercase}
.paper .eyebrow{color:var(--teal)}
.night .eyebrow{color:var(--teal-lit)}

h2{font-weight:800;letter-spacing:-.02em;line-height:1.14;margin:0;text-wrap:balance}
.t-xl{font-size:5.6cqw}
.t-lg{font-size:4.1cqw}
.t-md{font-size:3.2cqw}
.sub{font-size:1.52cqw;line-height:1.5;margin:1.0cqw 0 0;max-width:66ch}
.paper .sub{color:var(--ink-2)}
.night .sub{color:#a9b3bf}
.cond{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.12cqw;margin:.7cqw 0 0}
.paper .cond{color:var(--ink-3)}
.night .cond{color:#7f8b99}

.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:1.4cqw 0}
.body.top0{justify-content:flex-start;padding-top:1.6cqw}
.body > *{min-height:0}
.gap{margin-top:2.0cqw}

.ft{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:2cqw;
  padding-top:1.2cqw;font-size:1.08cqw;letter-spacing:.02em}
.paper .ft{border-top:1px solid var(--rule);color:var(--ink-3)}
.night .ft{border-top:1px solid var(--rule-d);color:#6f7b89}
.ft em{font-style:normal;font-weight:500}
.ft b{font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero}
.paper .ft em{color:var(--teal-ink)}
.night .ft em{color:var(--teal-lit)}
.ft .mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;letter-spacing:0}

.hero{position:absolute;inset:0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;inset:0}
.veil.l{background:linear-gradient(96deg,rgba(9,12,17,.95) 0%,rgba(9,12,17,.86) 30%,rgba(9,12,17,.34) 60%,rgba(9,12,17,.12) 100%)}
.veil.c{background:linear-gradient(180deg,rgba(9,12,17,.88) 0%,rgba(9,12,17,.5) 45%,rgba(9,12,17,.9) 100%)}
.lockup-hero{display:flex;align-items:center;gap:2.2cqw}
.lockup-hero img.sym{height:9.5cqw;width:auto}
.lockup-hero img.wm{height:5.6cqw;width:auto}
.claim{font-size:2.05cqw;line-height:1.5;color:#d6dce3;max-width:40ch;margin:2.0cqw 0 0;font-weight:500}
.org{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.22cqw;letter-spacing:.04em;color:#93a0ae}
.cue{position:absolute;right:5cqw;top:4cqw;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.02cqw;color:#6f7b89;
  border:1px dashed #3a4654;padding:.45cqw .8cqw;border-radius:2px}

.huge{font-weight:900;line-height:.88;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.huge .u{font-size:.36em;font-weight:700;letter-spacing:-.01em}

.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:.75cqw 1.0cqw}
.tile figure{margin:0}
.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#c9ccd0;border-radius:2px 2px 0 0}
.tile .bar{height:.42cqw;border-radius:0 0 2px 2px}
.tile .lab{display:flex;align-items:baseline;justify-content:space-between;gap:.45cqw;margin-top:.5cqw}
.tile .nm{font-weight:700;font-size:1.05cqw;letter-spacing:.02em;color:var(--ink)}
.tile .pc{font-weight:800;font-size:1.55cqw;font-variant-numeric:tabular-nums}
.ok .bar{background:var(--teal)} .ok .pc{color:var(--teal)}
.stall .bar{background:var(--amber)} .stall .pc{color:var(--amber)}
.fall .bar{background:var(--red)} .fall .pc{color:var(--red)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1.9cqw}
.pane{display:flex;flex-direction:column;gap:.8cqw}
.kicker{font-weight:800;font-size:1.85cqw;letter-spacing:-.01em}
.note{font-size:1.36cqw;line-height:1.5}
.paper .note{color:var(--ink-2)} .night .note{color:#a3aebb}
.mini{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.05cqw}
.paper .mini{color:var(--ink-3)} .night .mini{color:#78838f}

table{width:100%;border-collapse:collapse;font-size:1.26cqw}
th,td{text-align:left;padding:.58cqw .5cqw;vertical-align:baseline}
thead th{font-weight:700;font-size:1.05cqw;letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--ink)}
.night thead th{border-bottom-color:#46525f;color:#c3ccd6}
.paper thead th{color:var(--ink-2)}
tbody tr+tr td{border-top:1px solid var(--rule)}
.night tbody tr+tr td{border-top-color:var(--rule-d)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-variant-numeric:tabular-nums;white-space:nowrap}
td.r{text-align:right}
.who{font-weight:700}
.tag{display:inline-block;font-weight:700;font-size:.92cqw;letter-spacing:.06em;padding:.2cqw .55cqw;border-radius:2px;white-space:nowrap}
.tag.fall{background:var(--red-soft);color:var(--red)}
.tag.stall{background:var(--amber-soft);color:var(--amber)}
.tag.m{background:var(--teal-soft);color:var(--teal-ink)}
.tag.d{background:var(--paper-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule)}
.tag.p{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.night .tag.fall{background:#3a1e1c;color:var(--red-lit)}
.night .tag.stall{background:#3a2c12;color:var(--amber-lit)}

.flow{display:flex;align-items:stretch;gap:.7cqw}
.box{flex:1;padding:1.0cqw 1.1cqw;border-radius:2px;display:flex;flex-direction:column;gap:.35cqw;min-width:0}
.paper .box{background:var(--card);box-shadow:inset 0 0 0 1px var(--rule)}
.night .box{background:#161d27;box-shadow:inset 0 0 0 1px var(--rule-d)}
.box.on{background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.box b{font-weight:700;font-size:1.14cqw;letter-spacing:.06em}
.paper .box b{color:var(--ink)} .night .box b{color:#dbe2ea}
.box.on b{color:var(--teal-ink)}
.box span{font-size:1.02cqw;line-height:1.42}
.paper .box span{color:var(--ink-3)} .night .box span{color:#7d8896}
.box.on span{color:var(--teal-ink);opacity:.85}
.arrow{align-self:center;color:var(--ink-3);flex:0 0 auto;font-size:1.3cqw}
.night .arrow{color:#5d6773}

.track{padding:1.25cqw 1.4cqw;border-radius:2px;display:flex;flex-direction:column;gap:.75cqw;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule)}
.track.a{border-left:.34cqw solid var(--teal)}
.track.b{border-left:.34cqw solid var(--amber)}
.track h3{margin:0;font-weight:800;font-size:1.55cqw;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.45cqw}
.chip{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.0cqw;padding:.3cqw .65cqw;border-radius:2px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:.85cqw}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:2.4cqw 1fr;gap:.8cqw;align-items:baseline}
ol.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.05cqw;font-weight:700;color:var(--teal)}
.night ol.steps li::before{color:var(--teal-lit)}
ol.steps li span{font-size:1.36cqw;line-height:1.45}
ul.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.75cqw}
ul.bul li{font-size:1.36cqw;line-height:1.48;padding-left:1.5cqw;position:relative}
ul.bul li::before{content:'';position:absolute;left:0;top:.6em;width:.6cqw;height:.6cqw;background:var(--teal);border-radius:50%}
.night ul.bul li::before{background:var(--teal-lit)}
.callout{padding:1.0cqw 1.2cqw;background:var(--paper-2);border-radius:2px;font-size:1.3cqw;line-height:1.5;color:var(--ink-2)}
.night .callout{background:#161d27;color:#c9d2db}

.gates{display:grid;grid-template-columns:repeat(5,1fr);gap:.8cqw}
.gate{padding:1.0cqw;border-radius:2px;display:flex;flex-direction:column;gap:.4cqw;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);border-top:.34cqw solid var(--rule)}
.gate.now{border-top-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.gate .d{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.05cqw;color:var(--ink-3)}
.gate.now .d{color:var(--teal-ink)}
.gate .g{font-weight:800;font-size:1.45cqw;color:var(--ink)}
.gate.now .g{color:var(--teal-ink)}
.gate .o{font-size:1.1cqw;line-height:1.4;color:var(--ink-2)}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:1.0cqw}
.lane{padding:.95cqw 1.05cqw;background:var(--card);border-radius:2px;box-shadow:inset 0 0 0 1px var(--rule);border-left:.3cqw solid var(--rule)}
.lane .kicker{font-size:1.38cqw}
.lane .mini{margin:.4cqw 0 0;display:block}

.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:1.5cqw;align-items:center}
.side{display:flex;flex-direction:column;gap:.7cqw}
.core{text-align:center;padding:1.5cqw 1.7cqw;background:var(--night);border-radius:2px;display:flex;flex-direction:column;gap:.5cqw;align-items:center}
.core img{height:4.2cqw;width:auto;display:block;margin-bottom:.4cqw}
.core b{font-weight:900;font-size:1.7cqw;letter-spacing:.04em;color:#fff;line-height:1.15}
.core span{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.0cqw;color:var(--teal-lit)}


/* 주석 붙인 키 비주얼 · 09 */
.anno{position:absolute;inset:0}
.anno .lbl{position:absolute;transform:translate(-50%,-50%);text-align:center;
  background:rgba(10,14,20,.82);backdrop-filter:blur(2px);border-radius:2px;
  padding:.7cqw .95cqw;max-width:23cqw}
.anno .lbl b{display:block;font-weight:800;font-size:1.36cqw;letter-spacing:.01em;line-height:1.25}
.anno .lbl span{display:block;font-size:1.12cqw;line-height:1.4;margin-top:.28cqw;color:#b6c0cb}
.anno .lbl.a{box-shadow:inset 0 0 0 1.5px var(--teal-lit)} .anno .lbl.a b{color:var(--teal-lit)}
.anno .lbl.b{box-shadow:inset 0 0 0 1.5px var(--amber-lit)} .anno .lbl.b b{color:var(--amber-lit)}
.anno .lbl.c{box-shadow:inset 0 0 0 1.5px #cdd5de} .anno .lbl.c b{color:#fff}
.anno .dot{position:absolute;width:1.1cqw;height:1.1cqw;border-radius:50%;transform:translate(-50%,-50%)}
.anno .dot.a{background:var(--teal-lit);box-shadow:0 0 0 .5cqw rgba(62,199,180,.25)}
.anno .dot.b{background:var(--amber-lit);box-shadow:0 0 0 .5cqw rgba(220,154,48,.25)}
.anno svg.link{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* 루프 · 04 */
.loop{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:1.1cqw}
.lnode{padding:1.35cqw 1.5cqw;border-radius:2px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:.5cqw}
.lnode.on{background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.lnode i{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.0cqw;color:var(--ink-3);letter-spacing:.08em}
.lnode.on i{color:var(--teal-ink)}
.lnode b{font-weight:800;font-size:1.72cqw;color:var(--ink);line-height:1.2}
.lnode.on b{color:var(--teal-ink)}
.lnode span{font-size:1.22cqw;line-height:1.42;color:var(--ink-2)}
.lnode.on span{color:var(--teal-ink);opacity:.9}
.larr{font-size:1.9cqw;color:var(--ink-3)}

/* 기술 사슬 · 11 */
.chain{display:flex;align-items:stretch;gap:.65cqw}
.cnode{flex:1;min-width:0;padding:.75cqw .7cqw;border-radius:2px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:.55cqw}
.cnode.on{background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.cnode svg.ico{width:2.3cqw;height:2.3cqw;display:block;color:var(--teal)}
.cnode svg.thumb{width:100%;height:auto;display:block;border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--rule);margin-top:.35cqw}
.cnode em{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:.92cqw;color:var(--teal-ink);
  background:var(--teal-soft);padding:.14cqw .45cqw;border-radius:2px;margin-top:.3cqw}
.cnode b{font-weight:700;font-size:1.16cqw;color:var(--ink)}
.cnode span{font-size:1.0cqw;line-height:1.35;color:var(--ink-3)}
.cnode.on b,.cnode.on span{color:var(--teal-ink)}

/* 간트 · 14 */
.gantt{width:100%}
.gantt text{font-family:var(--sans)}

/* 마침 · QR */
.finis{display:flex;flex-direction:column;align-items:center;gap:1.6cqw;text-align:center}
.finis img.qr{width:11cqw;height:11cqw;display:block;background:#fff;padding:.7cqw;border-radius:2px}
.finis .url{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.5cqw;color:var(--teal-lit);letter-spacing:.02em}
.names{font-size:1.35cqw;color:#b6c0cb;letter-spacing:.02em}


/* 장면 이미지 · 03 11 */
.scene{position:absolute;inset:0;overflow:hidden}
.scene img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1)}
.scene .wash{position:absolute;inset:0}
.imgband{width:100%;border-radius:2px;overflow:hidden;display:block}
.imgband img{width:100%;display:block;object-fit:cover;filter:grayscale(1)}
.imgband.wide img{aspect-ratio:3.5/1}
.imgband.tall img{aspect-ratio:16/8.6}

/* 04 · 좌 이미지 · 우 세로 루프 */
.splitL{display:grid;grid-template-columns:1.05fr .95fr;gap:2.6cqw;align-items:center}
.vloop{display:flex;flex-direction:column;gap:.75cqw}
.vcap{display:flex;align-items:center;gap:.6cqw;margin-top:.7cqw;
  font-size:1.14cqw;font-weight:600;color:var(--teal-ink)}
.vcap svg{height:1.35cqw;width:1.35cqw;flex:0 0 auto;color:var(--teal)}
.vnode{padding:1.0cqw 1.2cqw;border-radius:2px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--rule);display:grid;grid-template-columns:4.4cqw 1fr;
  gap:.9cqw;align-items:baseline}
.vnode.on{background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.vnode i{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:1.0cqw;color:var(--ink-3);letter-spacing:.06em}
.vnode.on i{color:var(--teal-ink)}
.vnode b{font-weight:800;font-size:1.5cqw;color:var(--ink);display:block;line-height:1.25}
.vnode.on b{color:var(--teal-ink)}
.vnode span{font-size:1.14cqw;line-height:1.42;color:var(--ink-2);display:block;margin-top:.22cqw}
.vnode.on span{color:var(--teal-ink);opacity:.9}

/* 15 · 사람 카드를 격자로 세워 이름 줄을 맞춘다 */
.per{display:grid;grid-template-columns:8.4cqw 9.2cqw 1fr;gap:.85cqw;align-items:baseline;
  padding:.85cqw 1.0cqw;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);
  border-radius:2px;min-height:4.4cqw}
.per .tag{justify-self:start;font-size:.88cqw}
.per .who2{font-weight:800;font-size:1.32cqw;color:var(--ink);white-space:nowrap}
.per .who2 em{display:block;font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:.92cqw;
  color:var(--ink-3);font-weight:400;margin-top:.15cqw}
.per .q{font-size:1.14cqw;color:var(--ink-2);line-height:1.4}

/* 02 · 팀 소개 */
.people{display:grid;grid-template-columns:repeat(5,1fr);gap:1.1cqw}
.pcard{padding:1.2cqw 1.1cqw;background:var(--card);border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--rule);border-top:.3cqw solid var(--teal);

<script>

    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') {
      show(i - 1); e.preventDefault();
    } else if (k === 'Home') { show(0); e.preventDefault(); }
    else if (k === 'End') { show(N - 1); e.preventDefault(); }
    else if (k === 'f' || k === 'F') { full(); e.preventDefault(); }
    else if (k === 'g' || k === 'G') { overview(!grid); e.preventDefault(); }
    else if (k === 'b' || k === 'B') { body.classList.toggle('blank'); e.preventDefault(); }
    else if (k === 'Escape' && grid) { overview(false); e.preventDefault(); }
  });

  document.addEventListener('click', function(e){
    if (e.target.closest('video') || e.target.closest('a')) return;
    var row = e.target.closest('.row');
    if (body.classList.contains('grid')) {
      if (row) { show(rows.indexOf(row), true); overview(false); }
      return;
    }
    show(i + (e.clientX < window.innerWidth * 0.22 ? -1 : 1));
  });

  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);

  var framed = true;
  try { framed = (window.frameElement !== null) || (window.self !== window.top); }
  catch (e) { framed = true; }   /* 교차출처 프레임이면 접근 자체가 예외다 */
  var go = document.querySelector('.go');
  if (go) go.onclick = function(){ body.classList.add('present'); fit(); show(i, true);
                                   hint.classList.remove('gone');
                                   setTimeout(function(){ hint.classList.add('gone'); }, 5200); };
  if (!framed) body.classList.add('present');
  fit();
  var start = parseInt((location.hash.match(/p(\d+)/) || [0, 1])[1], 10) - 1;
  show(start > 0 ? start : 0, true);
  setTimeout(function(){ hint.classList.add('gone'); }, 5200);

  window.matchMedia('print').addEventListener('change', function(m){
    body.classList.toggle('present', !m.matches);
  });
  window.addEventListener('beforeprint', function(){ body.classList.remove('present', 'grid'); });
  window.addEventListener('afterprint', function(){ body.classList.add('present'); fit(); });
})();
</script>
