<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 336" width="980" height="336" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<style>
:root{--accent:#3ec7b4;--accent-soft:#11302c;--bad:#e56d5e;--bad-soft:#331c19;--card:#181d26;--deep:#0c1117;--dim:#3ec7b4;--dim-ink:#3ec7b4;--ink:#e9e7e1;--ink-2:#adb5c1;--ink-3:#7d8693;--ink-soft:#4a5566;--ok:#3ec7b4;--ok-soft:#11302c;--paper:#12161d;--paper-2:#191e27;--rule:#2b323d;--rule-2:#232a35;--warn:#dc9a30;--warn-soft:#332710;}

</style>

  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-3)"/>
    </marker>
  </defs>
  <rect width="980" height="336" fill="var(--card)"/>

  <text x="20" y="22" fill="var(--ink-3)" font-size="11.5">가로축은 작업 순서다. 각 단계 아래에는 관련 관문을 표시한다</text>

  <!-- Track A -->
  <rect x="20" y="38" width="150" height="72" rx="3" fill="var(--ink-2)"/>
  <text x="95" y="68" text-anchor="middle" fill="var(--card)" font-size="13.5" font-weight="700">TRACK A</text>
  <text x="95" y="87" text-anchor="middle" fill="var(--rule)" font-size="11">시뮬레이션과 강화학습</text>
  <g font-size="12.5">
    <rect x="186" y="38" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="274" y="62" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 1</text>
    <text x="274" y="82" text-anchor="middle" fill="var(--ink)">기준선 확립</text>
    <text x="274" y="100" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">A-정책 09/12</text>

    <rect x="378" y="38" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="466" y="62" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 2</text>
    <text x="466" y="82" text-anchor="middle" fill="var(--ink)">실패 지형 진단</text>
    <text x="466" y="100" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">A-정책 · MVP</text>

    <rect x="570" y="38" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="658" y="62" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 3</text>
    <text x="658" y="82" text-anchor="middle" fill="var(--ink)">학습 조건 개선</text>
    <text x="658" y="100" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">MVP 09/30</text>

    <rect x="762" y="38" width="176" height="72" rx="3" fill="var(--card)" stroke="var(--ok)" stroke-width="1.6"/>
    <text x="850" y="62" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 4</text>
    <text x="850" y="82" text-anchor="middle" fill="var(--ink)">재학습과 재평가</text>
    <text x="850" y="100" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">NAV 11/07</text>
  </g>
  <line x1="362" y1="74" x2="376" y2="74" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <line x1="554" y1="74" x2="568" y2="74" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <line x1="746" y1="74" x2="760" y2="74" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>

  <!-- Bridge -->
