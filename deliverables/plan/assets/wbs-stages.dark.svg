  <text x="95" y="158" text-anchor="middle" fill="var(--card)" font-size="13.5" font-weight="700">BRIDGE</text>
  <text x="95" y="177" text-anchor="middle" fill="var(--rule)" font-size="11">Digital Twin</text>
  <g font-size="12.5">
    <rect x="186" y="128" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="274" y="152" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 1</text>
    <text x="274" y="172" text-anchor="middle" fill="var(--ink)">환경 촬영</text>
    <text x="274" y="190" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">MVP 09/30</text>

    <rect x="378" y="128" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="466" y="152" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 2</text>
    <text x="466" y="172" text-anchor="middle" fill="var(--ink)">3DGS 복원</text>
    <text x="466" y="190" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">MVP 09/30</text>

    <rect x="570" y="128" width="176" height="72" rx="3" fill="var(--card)" stroke="var(--ok)" stroke-width="1.6"/>
    <text x="658" y="152" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 3</text>
    <text x="658" y="172" text-anchor="middle" fill="var(--ink)">Isaac USD 변환</text>
    <text x="658" y="190" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">MVP 09/30</text>
  </g>
  <line x1="362" y1="164" x2="376" y2="164" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <line x1="554" y1="164" x2="568" y2="164" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <text x="770" y="169" fill="var(--ink-3)" font-size="11">렌더는 별도 산출물이다.</text>
  <text x="770" y="186" fill="var(--ink-3)" font-size="11">MVP · FINAL 관문에서 제출</text>

  <!-- Track B -->
  <rect x="20" y="218" width="150" height="72" rx="3" fill="var(--ink-2)"/>
  <text x="95" y="248" text-anchor="middle" fill="var(--card)" font-size="13.5" font-weight="700">TRACK B</text>
  <text x="95" y="267" text-anchor="middle" fill="var(--rule)" font-size="11">실기 자율 보행</text>
  <g font-size="12.5">
    <rect x="186" y="218" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="274" y="242" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 1</text>
    <text x="274" y="262" text-anchor="middle" fill="var(--ink)">ROS 2 연동</text>
    <text x="274" y="280" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">A-정책 · MVP</text>

    <rect x="378" y="218" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="466" y="242" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 2</text>
    <text x="466" y="262" text-anchor="middle" fill="var(--ink)">SLAM 지도</text>
    <text x="466" y="280" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">NAV 11/07</text>

    <rect x="570" y="218" width="176" height="72" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
    <text x="658" y="242" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 3</text>
    <text x="658" y="262" text-anchor="middle" fill="var(--ink)">Nav2 주행</text>
    <text x="658" y="280" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">NAV 11/07</text>

    <rect x="762" y="218" width="176" height="72" rx="3" fill="var(--card)" stroke="var(--ok)" stroke-width="1.6"/>
    <text x="850" y="242" text-anchor="middle" fill="var(--dim-ink)" font-size="11" font-weight="700">단계 4</text>
    <text x="850" y="262" text-anchor="middle" fill="var(--ink)">인지 결합</text>
    <text x="850" y="280" text-anchor="middle" fill="var(--ink-3)" font-size="10.5">MVP · NAV</text>
  </g>
  <line x1="362" y1="254" x2="376" y2="254" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <line x1="554" y1="254" x2="568" y2="254" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>
  <line x1="746" y1="254" x2="760" y2="254" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#as)"/>

  <line x1="20" y1="306" x2="960" y2="306" stroke="var(--rule)" stroke-width="1"/>
  <text x="20" y="326" fill="var(--ink-2)" font-size="11.5">단계 이름과 개수는 이슈 #122 의 초안이다. 팀장 확정 뒤 단계 라벨을 생성한다</text>
</svg>
