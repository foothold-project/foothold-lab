<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8798"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>

  <!-- 실제 환경 -->
  <rect x="290" y="14" width="400" height="52" rx="4" fill="#161c26"/>
  <text x="490" y="38" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">실제 대상 환경</text>
  <text x="490" y="56" text-anchor="middle" fill="#d9d6cd" font-size="11.5">비정형 지형 · 계단 · 경사 · 장애물 · 실제 주행 공간</text>
  <line x1="490" y1="66" x2="490" y2="88" stroke="#7c8798" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 브리지 -->
  <rect x="250" y="90" width="480" height="60" rx="4" fill="#e0f0ed" stroke="#0e7a6e" stroke-width="2"/>
  <text x="490" y="113" text-anchor="middle" fill="#0b6459" font-size="15" font-weight="700">Bridge · Digital Twin (Real to Sim)</text>
  <text x="490" y="133" text-anchor="middle" fill="#4a5566" font-size="11.5">3DGS 로 실제 공간을 복원한다. 두 트랙이 평가에 사용할 공간이다</text>

  <path d="M400 150 L400 174 L250 174 L250 196" fill="none" stroke="#7c8798" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M580 150 L580 174 L730 174 L730 196" fill="none" stroke="#7c8798" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Track A -->
  <rect x="70" y="198" width="360" height="34" rx="3" fill="#4a5566"/>
  <text x="250" y="221" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">TRACK A · 시뮬레이션과 강화학습</text>
  <text x="250" y="250" text-anchor="middle" fill="#4a5566" font-size="11.5">어디까지 걸을 수 있는가</text>

  <g font-size="12.5" fill="#161c26">
    <rect x="90" y="262" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="250" y="282" text-anchor="middle">Isaac Sim · Isaac Lab · PPO 학습</text>
    <rect x="90" y="304" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="250" y="324" text-anchor="middle">절차적 확장 지형 · 난이도 단계</text>
    <rect x="90" y="346" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="250" y="366" text-anchor="middle">미경험 지형 평가 · held-out 원본</text>
    <rect x="90" y="388" width="320" height="38" rx="3" fill="#fff" stroke="#0e7a6e" stroke-width="1.6"/>
    <text x="250" y="404" text-anchor="middle" font-weight="700" fill="#0b6459">난이도 경계와 그 이동 폭</text>
    <text x="250" y="419" text-anchor="middle" font-size="11" fill="#4a5566">통과율 · 생존 · 전진 · 속도추종 · 좌우 이탈</text>
  </g>
  <line x1="250" y1="292" x2="250" y2="302" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="250" y1="334" x2="250" y2="344" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="250" y1="376" x2="250" y2="386" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Track B -->
  <rect x="550" y="198" width="360" height="34" rx="3" fill="#4a5566"/>
  <text x="730" y="221" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">TRACK B · 실기 자율 보행</text>
  <text x="730" y="250" text-anchor="middle" fill="#4a5566" font-size="11.5">목표까지 스스로 갈 수 있는가</text>

  <g font-size="12.5" fill="#161c26">
    <rect x="570" y="262" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="730" y="282" text-anchor="middle">Unitree Go2 · LiDAR · 카메라 · IMU</text>
    <rect x="570" y="304" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="730" y="324" text-anchor="middle">ROS 2 · SLAM 지도와 위치 · YOLO 인지</text>
    <rect x="570" y="346" width="320" height="30" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="730" y="366" text-anchor="middle">Nav2 경로 계획과 재계획</text>
    <rect x="570" y="388" width="320" height="38" rx="3" fill="#fff" stroke="#0e7a6e" stroke-width="1.6"/>
    <text x="730" y="404" text-anchor="middle" font-weight="700" fill="#0b6459">목표 지점 자율 보행</text>
    <text x="730" y="419" text-anchor="middle" font-size="11" fill="#4a5566">도달률 · 무충돌 · 재계획 성공률</text>
  </g>
  <line x1="730" y1="292" x2="730" y2="302" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="730" y1="334" x2="730" y2="344" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="730" y1="376" x2="730" y2="386" stroke="#7c8798" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="490" y="452" text-anchor="middle" font-size="12" fill="#4a5566">두 트랙을 하나의 제어 파이프라인으로 연결하지 않는다. 같은 실제 공간을 기준으로 각각 검증한다</text>
</svg>
