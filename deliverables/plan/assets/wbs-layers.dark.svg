<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392" width="980" height="392" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<style>
:root{--accent:#3ec7b4;--accent-soft:#11302c;--bad:#e56d5e;--bad-soft:#331c19;--card:#181d26;--deep:#0c1117;--dim:#3ec7b4;--dim-ink:#3ec7b4;--ink:#e9e7e1;--ink-2:#adb5c1;--ink-3:#7d8693;--ink-soft:#4a5566;--ok:#3ec7b4;--ok-soft:#11302c;--paper:#12161d;--paper-2:#191e27;--rule:#2b323d;--rule-2:#232a35;--warn:#dc9a30;--warn-soft:#332710;}

</style>

  <defs>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-3)"/>
    </marker>
  </defs>
  <rect width="980" height="392" fill="var(--card)"/>

  <!-- 열 머리 -->
  <g font-size="11.5" fill="var(--ink-3)">
    <text x="20" y="20">층</text>
    <text x="132" y="20">무엇을 담나</text>
    <text x="556" y="20">누가 채우나</text>
    <text x="762" y="20">정본이 어디 있나</text>
  </g>
  <line x1="20" y1="28" x2="960" y2="28" stroke="var(--rule)" stroke-width="1"/>

  <!-- 1층 -->
  <rect x="20" y="40" width="96" height="52" rx="3" fill="var(--ink)"/>
  <text x="68" y="72" text-anchor="middle" fill="var(--card)" font-size="15" font-weight="700">1층</text>
  <rect x="126" y="40" width="410" height="52" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
  <text x="142" y="63" fill="var(--ink)" font-size="13.5" font-weight="700">작업 영역 8갈래</text>
  <text x="142" y="82" fill="var(--ink-2)" font-size="11.5">A 정책학습 · 지형씬제작 · 평가 · 트윈렌더 · B 항법 · 인지 · C 기록 · 운영</text>
  <text x="556" y="70" fill="var(--ink)" font-size="12">사람이 정한다 · 고정</text>
  <text x="762" y="70" fill="var(--ink-2)" font-size="11.5">docs/ROLES.md</text>

  <!-- 2층 -->
  <rect x="20" y="102" width="96" height="52" rx="3" fill="var(--ink)"/>
  <text x="68" y="134" text-anchor="middle" fill="var(--card)" font-size="15" font-weight="700">2층</text>
  <rect x="126" y="102" width="410" height="52" rx="3" fill="var(--paper)" stroke="var(--rule)"/>
  <text x="142" y="125" fill="var(--ink)" font-size="13.5" font-weight="700">관문 다섯</text>
  <text x="142" y="144" fill="var(--ink-2)" font-size="11.5">기획발표 09/04 · A-정책 09/12 · MVP 09/30 · NAV 11/07 · FINAL 12/11</text>
  <text x="556" y="132" fill="var(--ink)" font-size="12">기한·착수 조건을 정한다</text>
  <text x="762" y="132" fill="var(--ink-2)" font-size="11.5">tools/build_wbs.py GATES</text>

  <!-- 3층 신설 -->
  <rect x="20" y="164" width="96" height="52" rx="3" fill="var(--ok)"/>
  <text x="68" y="190" text-anchor="middle" fill="var(--card)" font-size="15" font-weight="700">3층</text>
  <text x="68" y="206" text-anchor="middle" fill="var(--ok-soft)" font-size="10.5">신설</text>
  <rect x="126" y="164" width="410" height="52" rx="3" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.6"/>
  <text x="142" y="187" fill="var(--dim-ink)" font-size="13.5" font-weight="700">구현 단계</text>
  <text x="142" y="206" fill="var(--ink-2)" font-size="11.5">트랙별 작업 순서와 선행 관계 · 단계 수는 확정 전</text>
  <text x="556" y="187" fill="var(--dim-ink)" font-size="12" font-weight="700">사람이 정한다 · 순서</text>
  <text x="556" y="205" fill="var(--ink-3)" font-size="10.5">팀장 확정 전</text>
  <text x="762" y="194" fill="var(--ink-2)" font-size="11.5">이 문서 5절 · 이슈 #122</text>

  <!-- 4층 -->
  <rect x="20" y="226" width="96" height="52" rx="3" fill="var(--ink-2)"/>
  <text x="68" y="258" text-anchor="middle" fill="var(--card)" font-size="15" font-weight="700">4층</text>
  <rect x="126" y="226" width="410" height="52" rx="3" fill="var(--paper-2)" stroke="var(--rule)"/>
  <text x="142" y="249" fill="var(--ink)" font-size="13.5" font-weight="700">세부 작업</text>
  <text x="142" y="268" fill="var(--ink-2)" font-size="11.5">이슈 한 건이 한 행. 계속 늘어난다</text>
  <text x="556" y="256" fill="var(--dim-ink)" font-size="12" font-weight="700">GitHub 이슈 자동 집계</text>
  <text x="762" y="249" fill="var(--ink-2)" font-size="11.5">GitHub 이슈의 라벨 · 마일스톤</text>
  <text x="762" y="266" fill="var(--ink-2)" font-size="11.5">담당자 · 상태</text>

  <line x1="331" y1="278" x2="331" y2="306" stroke="var(--ink-3)" stroke-width="1.6" marker-end="url(#al)"/>

  <!-- 생성물 -->
  <rect x="126" y="308" width="410" height="60" rx="3" fill="var(--card)" stroke="var(--ok)" stroke-width="1.6"/>
  <text x="142" y="331" fill="var(--dim-ink)" font-size="13.5" font-weight="700">deliverables/plan/wbs.xlsx</text>
  <text x="142" y="350" fill="var(--ink-2)" font-size="11.5">열두 칸. 계획율 · 완료율 · 담당자 · 산출물이 여기서 나온다</text>
  <text x="142" y="364" fill="var(--ink-3)" font-size="10.5">tools/build_wbs.py 가 만든다. 사람이 값을 적지 않는다</text>
  <text x="556" y="338" fill="var(--ink)" font-size="12">진척은 여기서만 읽는다</text>
  <text x="762" y="331" fill="var(--ink-2)" font-size="11.5">.github/workflows/</text>
  <text x="762" y="348" fill="var(--ink-2)" font-size="11.5">weekly-report.yml</text>
</svg>
