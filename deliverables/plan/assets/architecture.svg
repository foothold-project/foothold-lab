      <path d="M0 0 L10 5 L0 10 z" fill="#7c8798"/>
    </marker>
  </defs>
  <rect width="980" height="760" fill="#ffffff"/>

  <rect x="270" y="12" width="440" height="50" rx="4" fill="#161c26"/>
