  <text x="235" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5566">TRACK A · RL LOCOMOTION</text>
  <text x="745" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5566">TRACK B · AUTONOMOUS NAVIGATION</text>

  <path d="M235 572 L235 594 L490 594" fill="none" stroke="#7c8798" stroke-width="1.6"/>
  <path d="M745 572 L745 594 L490 594" fill="none" stroke="#7c8798" stroke-width="1.6"/>
  <line x1="490" y1="594" x2="490" y2="612" stroke="#7c8798" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="190" y="614" width="600" height="66" rx="4" fill="#161c26"/>
  <text x="490" y="639" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">실험·검증 기록</text>
  <text x="490" y="659" text-anchor="middle" fill="#d9d6cd" font-size="11.5">조건 · 정책 체크포인트 · 지형 설정 · 원자료 · 판정 · 영상</text>
  <text x="490" y="674" text-anchor="middle" fill="#adb5c1" font-size="10.5">시뮬레이션은 같은 seed 재실행으로, 실기는 반복 주행 기록으로 확인한다</text>

  <text x="490" y="708" text-anchor="middle" font-size="12" fill="#4a5566">두 트랙은 직접적인 제어 파이프라인으로 연결하지 않는다. 동일한 실제 환경을 기준으로 각각의 성능을 검증한다.</text>
  <text x="490" y="730" text-anchor="middle" font-size="12" fill="#4a5566">Digital Twin 은 학습 정책을 실물에 이식하는 용도로는 사용하지 않는다.</text>
</svg>
