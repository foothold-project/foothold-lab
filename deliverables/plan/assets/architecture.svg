    <rect x="75" y="220" width="320" height="40" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="235" y="237" text-anchor="middle" font-weight="700">절차적 확장</text>
    <text x="235" y="253" text-anchor="middle" font-size="11" fill="#4a5566">그 분포로 학습·평가 지형 생성</text>

    <rect x="75" y="274" width="320" height="40" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="235" y="291" text-anchor="middle" font-weight="700">Isaac Sim · Isaac Lab</text>
    <text x="235" y="307" text-anchor="middle" font-size="11" fill="#4a5566">Terrain · Physics · Domain Randomization</text>

    <rect x="75" y="328" width="320" height="34" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
