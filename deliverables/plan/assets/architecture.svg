  <text x="490" y="53" text-anchor="middle" fill="#d9d6cd" font-size="11">비정형 지형 · 계단 · 경사 · 장애물 · 실제 주행 공간</text>

  <path d="M380 62 L380 86 L235 86 L235 106" fill="none" stroke="#7c8798" stroke-width="1.6" marker-end="url(#b)"/>
