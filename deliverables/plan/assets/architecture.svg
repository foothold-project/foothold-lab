    <text x="235" y="143" text-anchor="middle" font-size="11" fill="#4a5566">실제 공간 3D 재구성 · Real to Sim</text>

    <rect x="75" y="166" width="320" height="40" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
