    <text x="829" y="237" text-anchor="middle" font-weight="700">YOLO · 센서 융합</text>
    <text x="829" y="253" text-anchor="middle" font-size="11" fill="#4a5566">객체 종류와 위치</text>

    <rect x="585" y="274" width="320" height="40" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="745" y="291" text-anchor="middle" font-weight="700">Nav2</text>
    <text x="745" y="307" text-anchor="middle" font-size="11" fill="#4a5566">Costmap · 경로 계획 · 재계획 · 회피</text>

    <rect x="585" y="328" width="320" height="34" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="745" y="350" text-anchor="middle" font-weight="700">속도 명령 (cmd_vel)</text>

    <rect x="585" y="376" width="320" height="34" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="745" y="398" text-anchor="middle" font-weight="700">Unitree Go2 순정 보행 제어</text>

    <rect x="585" y="424" width="320" height="44" rx="3" fill="#f6f5f1" stroke="#d9d6cd"/>
    <text x="745" y="442" text-anchor="middle" font-weight="700">실제 구간 주행</text>
    <text x="745" y="459" text-anchor="middle" font-size="11" fill="#4a5566">트윈의 원본이 된 그 공간에서</text>

    <rect x="585" y="482" width="320" height="56" rx="3" fill="#fff" stroke="#0e7a6e" stroke-width="1.8"/>
