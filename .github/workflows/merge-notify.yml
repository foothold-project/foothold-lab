# 머지되면 «무엇이 반영됐는지» 팀에게 알린다.
#
#   왜 필요한가 (2026-08-25):
#     팀원 PR 이 머지돼도 팀은 그것을 모른다. discord-notify 가 «문서 갱신» 과
#     파일명 5개를 보내지만, 누가 올린 것인지 · 무엇이 바뀐 것인지 · 웹 어디서
#     보는지가 없다. 올린 사람 입장에서는 «내 작업이 반영됐나» 를 알 수 없고,
#     다른 팀원은 새 자료가 생긴 것을 모른 채 지나간다.
#
#   왜 push 트리거인가:
#     pull_request(closed) 는 워크플로 파일을 어느 쪽에서 읽는지가 상황에 따라
#     다르다. push 후 «이 커밋이 속한 PR» 을 API 로 되찾는 방식은 inbox-alert 에서
#     이미 실제로 도는 것을 확인했다. 확실한 쪽을 쓴다.
#
#   직접 push(=PR 없음)는 여기서 다루지 않는다. main-guard 의 몫이다.
name: 머지 반영 알림

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: 이 커밋의 PR 찾기
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ★ 2026-09-09. 전에는 이 한 줄이었다.
          #     gh api ... > pulls.json 2>/dev/null || echo '[]' > pulls.json
          #   API 실패가 «PR 없는 직접 push» 로 바뀌고 stderr 는 버려졌다.
          #   토큰이 만료된 동안 모든 머지 알림이 흔적 없이 사라지고 전부 초록불이었다.
          #   실측: gh api 는 없는 SHA 에 rc=1 을 주고 사람이 읽을 진단은 stderr 로
          #   보낸다. 그것을 버리면 «왜 비었는지» 가 로그에도 안 남는다.
          set +e
          gh api "repos/$REPO/commits/$SHA/pulls" \
            -H "Accept: application/vnd.github+json" > pulls.json 2> api_err.txt
          API_RC=$?
          set -e
          if [ "$API_RC" -ne 0 ]; then
            echo "::group::gh api stderr"; cat api_err.txt; echo "::endgroup::"
            echo "::error::이 커밋의 PR 을 묻지 못했다 (gh rc=$API_RC). 머지 알림을 보낼 수 없다"
            exit 1
          fi
          if [ ! -s pulls.json ]; then
            echo "::error::gh api 가 0 을 돌려줬는데 응답이 비었다"
            exit 1
          fi
          # 오류 응답은 객체다. jq 'length' 로 세면 «키 개수» 가 나와 목록처럼 읽힌다.
          if ! python3 -c 'import json,sys; sys.exit(0 if isinstance(json.load(open("pulls.json")), list) else 1)'; then
            echo "::group::응답 앞부분"; head -c 300 pulls.json; echo; echo "::endgroup::"
            echo "::error::PR 조회 응답이 배열이 아니다"
            exit 1
          fi

          N=$(jq 'length' pulls.json)
          if [ "$N" -eq 0 ]; then
            echo "PR 없는 직접 push (조회 자체는 정상). main-guard 담당이므로 생략"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "skip=0"
            echo "num=$(jq -r '.[0].number' pulls.json)"
            echo "title=$(jq -r '.[0].title' pulls.json)"
            echo "author=$(jq -r '.[0].user.login' pulls.json)"
            echo "url=$(jq -r '.[0].html_url' pulls.json)"
          } >> "$GITHUB_OUTPUT"

      - name: 무엇이 바뀌었나 정리
        id: sum
        if: steps.pr.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | "\(.status)\t\(.filename)"' > files.tsv
          python3 - <<'PY' > body.txt
          import io, os, re, sys
          sys.stdout.reconfigure(encoding='utf-8')
          SITE = 'https://foothold-project.vercel.app'
          rows = [l.split('\t') for l in io.open('files.tsv', encoding='utf-8').read().split('\n') if '\t' in l]

          groups = {'회의록': [], '연구 문서': [], '제출(inbox)': [], '규칙 · 문서': [], '그 밖': []}
          links = []
          for status, path in rows:
              if path.startswith('docs/meetings/'):
                  g = '회의록'
              elif path.startswith('docs/research/'):
                  g = '연구 문서'
              elif path.startswith('inbox/'):
                  g = '제출(inbox)'
              elif path.startswith('docs/') or path.endswith('.md'):
                  g = '규칙 · 문서'
              else:
                  g = '그 밖'
              mark = {'added': '신규', 'modified': '수정', 'removed': '삭제'}.get(status, status)
              groups[g].append('%s %s' % (mark, os.path.basename(path)))
              # 웹에 페이지가 생기는 것만 링크를 만든다
              if status != 'removed' and path.endswith('.md'):
                  m = re.match(r'docs/(research|meetings)/(.+)\.md$', path)
                  if m:
                      kind = 'research' if m.group(1) == 'research' else 'meeting'
                      links.append('%s/%s-%s' % (SITE, kind, m.group(2)))

          for g, items in groups.items():
              if not items:
                  continue
              print('%s (%d)' % (g, len(items)))
              for it in items[:6]:
                  print('  %s' % it)
              if len(items) > 6:
                  print('  ... 외 %d개' % (len(items) - 6))
              print('')

          if links:
              print('웹에서 보기')
              for u in links[:5]:
                  print('  %s' % u)
              if len(links) > 5:
                  print('  ... 외 %d개' % (len(links) - 5))
          PY
          echo "::group::요약"; cat body.txt; echo "::endgroup::"
          # 조용한 실패 방지: 요약이 비었는데 성공으로 넘기지 않는다
          if [ ! -s body.txt ]; then
            echo "::error::변경 요약이 비었습니다. 파일 목록을 확인하세요."
            exit 1
          fi

      - name: 디스코드 (팀 전체)
        if: steps.pr.outputs.skip == '0'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR: ${{ steps.pr.outputs.num }}
          TITLE: ${{ steps.pr.outputs.title }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          [ -n "${HOOK:-}" ] || { echo "웹훅 없음"; exit 1; }
          {
            printf '올린 사람: %s\n\n' "$AUTHOR"
            cat body.txt
            printf '\nPR #%s · %s\n' "$PR" "$URL"
          } > desc.txt
          CODE=$(jq -n --arg t "반영됨 · $TITLE" --rawfile d desc.txt \
                   '{embeds:[{title:$t, description:$d, color:3066993}]}' \
                 | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                        -H "Content-Type: application/json" -d @- "$HOOK")
          echo "디스코드 HTTP $CODE"
          case "$CODE" in 2*) echo "전송 확인" ;; *) echo "전송 실패"; exit 1 ;; esac

      - name: 팀장 텔레그램
        if: steps.pr.outputs.skip == '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR: ${{ steps.pr.outputs.num }}
          TITLE: ${{ steps.pr.outputs.title }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then exit 0; fi
          {
            printf '[FOOTHOLD] PR #%s 반영 완료\n\n' "$PR"
            printf '%s\n올린 사람: %s\n\n' "$TITLE" "$AUTHOR"
            cat body.txt
            printf '\n%s\n' "$URL"
          } > tg.txt
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${TG_CHAT}" \
                 --data-urlencode "disable_web_page_preview=true" \
                 --data-urlencode "text@tg.txt")
          echo "텔레그램 HTTP $CODE"
          case "$CODE" in 2*) echo "전송 확인" ;; *) echo "전송 실패"; exit 1 ;; esac
