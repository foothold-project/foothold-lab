# 보드 → data/gantt.json — 간트 페이지의 원본 데이터를 매일 떠 놓는다.
#
#   설계 원칙: **보드가 진실, 페이지는 거울.**
#   사람이 간트를 따로 관리하는 순간 두 개의 진실이 생기고 반드시 어긋난다.
#   그래서 아무도 이 JSON 을 손으로 고치지 않는다 — 보드를 고치면 다음 실행에 따라온다.
#
#   계획(start/end)은 사람이 바꿀 수 있고 그게 정상 행위다. 실적(done date)은 자동이다.
#   그 둘의 차이가 리뷰의 근거이므로 **둘 다** 그대로 담는다. 해석은 페이지가 한다.
#
# 필요: PROJECT_TOKEN (project 스코프)
name: 간트 데이터 수집

on:
  schedule:
    - cron: "10 21 * * *"       # 매일 06:10 KST (UTC 21:10)
  workflow_dispatch:
  issues:
    types: [closed, reopened, edited, assigned]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 보드 읽어 JSON 으로
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: foothold-project
          PROJECT_NUMBER: "1"
        run: |
          set -euo pipefail
          mkdir -p data
          gh api graphql --paginate -f query='
            query($org:String!, $num:Int!, $endCursor:String){
              organization(login:$org){
                projectV2(number:$num){
                  title
                  items(first:100, after:$endCursor){
                    pageInfo{ hasNextPage endCursor }
                    nodes{
                      content{
                        ... on Issue {
                          number title url state closedAt repository{ name }
                          assignees(first:5){ nodes{ login } }
                          labels(first:10){ nodes{ name } }
                          parent{ number title }
                        }
                      }
                      fieldValues(first:20){
                        nodes{
                          ... on ProjectV2ItemFieldDateValue {
                            date field{ ... on ProjectV2FieldCommon { name } } }
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name field{ ... on ProjectV2FieldCommon { name } } }
                          ... on ProjectV2ItemFieldIterationValue {
                            title startDate duration
                            field{ ... on ProjectV2FieldCommon { name } } }
                        }
                      }
                    }
                  }
                }
              }
            }' -f org="$ORG" -F num="$PROJECT_NUMBER" > raw.json

          python3 - <<'PY'
          import json, io, datetime, os

          # gh --paginate 는 JSON 객체를 여러 개 이어 붙여 내보낸다. 하나씩 끊어 읽는다.
          dec, buf, docs, i = json.JSONDecoder(), io.open('raw.json', encoding='utf-8').read(), [], 0
          while i < len(buf):
              while i < len(buf) and buf[i].isspace():
                  i += 1
              if i >= len(buf):
                  break
              obj, i = dec.raw_decode(buf, i)
              docs.append(obj)

          items, title = [], ''
          for d in docs:
              p = d.get('data', {}).get('organization', {}).get('projectV2') or {}
              title = title or p.get('title', '')
              for n in p.get('items', {}).get('nodes', []) or []:
                  c = n.get('content') or {}
                  if not c.get('number'):
                      continue                     # 초안(draft) 아이템은 일정이 없다
                  f = {}
                  for fv in (n.get('fieldValues', {}) or {}).get('nodes', []) or []:
                      name = ((fv.get('field') or {}).get('name') or '').strip().lower()
                      if not name:
                          continue
                      f[name] = fv.get('date') or fv.get('name') or fv.get('title')
                  items.append({
                      'number': c['number'],
                      'repo': (c.get('repository') or {}).get('name', ''),
                      'title': c.get('title', ''),
                      'url': c.get('url', ''),
                      'state': c.get('state', ''),
                      'closedAt': (c.get('closedAt') or '')[:10],
                      'assignees': [a['login'] for a in (c.get('assignees') or {}).get('nodes', [])],
                      'labels': [l['name'] for l in (c.get('labels') or {}).get('nodes', [])],
                      'parent': (c.get('parent') or {}).get('title', ''),
                      'start': f.get('start date'),
                      'end': f.get('end date'),
                      'done': f.get('done date'),
                      'status': f.get('status', ''),
                  })

          items.sort(key=lambda x: (x.get('start') or '9999', x['number']))
          out = {
              'project': title,
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%MZ'),
              'count': len(items),
              'items': items,
          }
          io.open('data/gantt.json', 'w', encoding='utf-8', newline='\n').write(
              json.dumps(out, ensure_ascii=False, indent=1))
          print('아이템 %d개 · 계획 있는 것 %d개 · 실적 있는 것 %d개'
                % (len(items), sum(1 for x in items if x['start']),
                   sum(1 for x in items if x['done'])))
          PY
          rm -f raw.json

      - name: 바뀐 게 있을 때만 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gantt.json
          if git diff --cached --quiet; then
            echo "보드에 변화 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 보드 스냅샷 갱신 (자동)"
          git push
