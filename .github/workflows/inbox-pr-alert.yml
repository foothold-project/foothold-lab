# inbox 제출 감지 (PR 시점) · 팀장이 머지하기 «전»에 알린다.
#
#   왜 필요한가 (2026-08-24 확인한 구멍):
#     기존 inbox-alert.yml 은 main 에 push 될 때만 돈다. 그런데 팀원은 main 에
#     직접 밀지 않고 브랜치 -> PR 로 올린다. 그래서 알림이 «팀장이 머지한 뒤»에야
#     울렸다. 알림의 목적은 팀장이 «아직 모르는 것»을 알리는 것인데, 이미 처리한
#     다음에 오면 소용이 없다.
#     실제 사례: 임석헌 PR #40 제출 13:59 -> 알림은 15:00 (팀장이 머지한 직후).
#
#   이 워크플로: PR 이 열리거나 커밋이 추가되면, inbox/ 아래 파일이 있을 때만
#   디스코드 + 팀장 텔레그램으로 알린다. 승격 검토 이슈는 만들지 않는다
#   (그건 머지 후 inbox-alert.yml 이 만든다. 큐가 두 번 생기면 안 된다).
#
# ★★ 2026-09-08 (#307) 이 워크플로는 «관문이 아니다». 어떤 이유로도 실패하지 않는다.
#
#   닷새 동안 #250 #177 #304 가 빨간불이었다. 내용에는 아무 문제가 없었다.
#   원인은 텔레그램 HTTP 400(본문 길이 초과) 하나였고, 그 exit 1 이 PR 을 막았다.
#
#   더 나쁜 것은 «고쳐도 안 닿는다»는 점이다. GitHub 는 재실행을 원래 런에 묶인
#   워크플로 판으로 돌린다. 05:46Z 에 main 에 길이 제한을 넣었는데 06:20Z 재실행이
#   여전히 옛 판을 실행해 똑같이 400 이 났다 (run 33955321883 att2 로그로 확인).
#   그래서 «고치고 재실행»으로는 열린 PR 을 못 푼다. 브랜치에 손으로 main 을 넣어야
#   새 이벤트가 나고 그제야 최신 판이 돈다. 사람이 잊으면 영원히 막힌다.
#
#   해법은 트리거를 또 바꾸는 것이 아니라 «알림이 PR 을 막지 못하게» 하는 것이다.
#   전달 실패는 세 자리에 남긴다: ::warning:: · 런 요약 · 다른 채널로 짧은 통보.
#   자세한 근거는 docs/CI-PR-CHECKS.md.
#
# 필요: DISCORD_WEBHOOK, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: inbox 제출 감지 (PR)

# ★ 2026-08-26: pull_request -> pull_request_target.
#   pull_request 는 «PR 브랜치의» 워크플로로 돈다. 옛 main 에서 갈라진 브랜치가
#   오면 낡은 판이 실행돼 알림이 통째로 빠진다(PR #47 에서 실제로 발생).
#
#   ⚠️ 이 이벤트는 시크릿을 쥐고 돈다. 그래서 체크아웃 방식을 반드시 바꿔야 한다.
#      옛 방식은 PR head 를 통째로 받아 그 안의 review_inbox.py 를 실행했다.
#      그대로 두고 이벤트만 바꾸면 «PR 작성자가 스크립트를 고쳐 시크릿을 털 수 있다».
#      -> base(main) 를 받아 스크립트는 우리 것을 쓰고,
#         PR 에서는 inbox/ 아래 «데이터 파일만» 꺼내 온다. 실행하지 않는다.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    paths: ['inbox/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: inbox-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      # base(main) 를 받는다. ref 를 주지 않는 것이 핵심이다.
      - uses: actions/checkout@v4

      - name: PR 의 inbox 파일만 데이터로 가져오기 (실행하지 않는다)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          # ★ -e 를 안 켠다. 네트워크가 한 번 튀어 fetch 가 실패하면 PR 이 빨간불이 된다.
          #   여기서 못 가져와도 다음 단계는 API 로 파일 목록을 읽으니 알림은 나간다.
          set -uo pipefail
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR}/head:refs/remotes/pr/${PR}" \
            || echo "::warning::PR head 를 못 받았습니다. inbox 원문 없이 진행합니다"
          # 경로를 inbox/ 로 못박는다. .github/ 나 스크립트는 어떤 경우에도 안 덮인다.
          git checkout "refs/remotes/pr/${PR}" -- inbox/ || echo "inbox 변경 없음"
          # find 를 head 에 물리면 head 가 먼저 닫을 때 find 가 SIGPIPE 로 죽고,
          # set -o pipefail 이라 스텝 전체가 실패한다. 파일이 20개 넘을 때만 나서
          # 성공과 실패가 섞였다 (2026-09-04 · 09-05 에 네 번). 진단 출력 하나 때문에
          # 검수가 통째로 안 돈 것이다.
          echo "가져온 inbox 파일"; find inbox -type f > all.txt || true; head -20 all.txt; rm -f all.txt

      - name: 제출 파일 찾기
        id: files
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # ★ -e 를 안 켠다. GitHub API 가 한 번 흔들렸다고 PR 이 막히면 안 된다.
          set -uo pipefail
          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '
            [.[] | select(.status != "removed") | .filename
             | select(startswith("inbox/"))
             | select(endswith("README.md") or endswith(".gitkeep") | not)]
            | join("\n")') || {
            echo "::warning::PR 파일 목록을 못 읽었습니다. 알림을 건너뜁니다"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          }
          if [ -z "$FILES" ]; then
            echo "inbox 실제 제출물 없음 → 생략"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::group::제출 파일"; echo "$FILES"; echo "::endgroup::"
          {
            echo "skip=0"
            echo "files<<ZEOF"; echo "$FILES"; echo "ZEOF"
          } >> "$GITHUB_OUTPUT"

      # 제출자는 «PR 을 연 사람»이다. 머지 커밋의 author 를 쓰면 팀장 이름이 나온다.
      - name: 디스코드
        if: steps.files.outputs.skip == '0'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # 텔레그램 시크릿도 받는다. 디스코드가 죽으면 이쪽으로 짧게 흘린다.
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # ★ -e 를 안 켠다. 이 워크플로는 «알림» 이고 알림은 관문이 아니다.
          #   여기서 죽으면 PR 이 빨간불이 되어 «내용에 문제가 있는 것»처럼 보인다.
          set -uo pipefail
          {
            printf '제출자: %s\n' "$AUTHOR"
            printf 'PR: %s\n\n' "$TITLE"
            printf '%s\n' "$FILES" | head -5 | sed 's/^/• /'
            printf '\n%s\n' "$URL"
            printf '(팀장 검토 후 머지하면 승격 검토 큐가 열립니다)\n'
          } > desc.txt
          jq -n --arg t "📥 inbox 새 제출 (검토 전)" --rawfile d desc.txt \
                '{embeds:[{title:$t, description:$d, color:1016969}]}' > payload.json
          # 빈 산출물이 «보냈다» 로 읽히지 않게 먼저 본다 (커널 원칙 2).
          if [ ! -s payload.json ]; then
            echo "::warning::디스코드 payload 가 비었습니다. 보내지 않습니다"; exit 0
          fi
          bash .github/scripts/notify_send.sh discord payload.json "inbox 제출 · 디스코드"

      - name: 팀장 텔레그램 (자동 검토 포함)
        if: steps.files.outputs.skip == '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 텔레그램이 죽으면 디스코드로 짧게 흘린다.
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # ★ -e 를 안 켠다. 알림은 관문이 아니다 (위 디스코드 단계와 같은 이유).
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "텔레그램 시크릿 없음, 건너뜀"; exit 0
          fi
          if [ -f .github/scripts/review_inbox.py ]; then
            printf '%s\n' "$FILES" | PR_AUTHOR="$AUTHOR" TODAY="$(TZ=Asia/Seoul date '+%F %H:%M')" xargs python3 .github/scripts/review_inbox.py > review.json || { echo "::warning::review_inbox.py 실패"; echo '{"error":"review failed"}' > review.json; }
          else
            # 이 스크립트는 799f58d 에서 들어왔다. 그 전에 갈라진 브랜치에는 없다.
            # 없다고 죽으면 그 PR 은 영구히 빨간불이 되고, 알림 실패가 검수 실패로
            # 보여 멀쩡한 PR 이 막힌다. 2026-09-08 에 #250 #177 #304 가 그 상태였다.
            echo "::warning::review_inbox.py 가 없습니다 (옛 브랜치). 자동 검토를 건너뜁니다"
            echo '{"skipped":"no reviewer on this branch"}' > review.json
          fi
          python3 - <<'PY' > tg.txt
          import io, json, os
          try:
              d = json.load(io.open('review.json', encoding='utf-8'))
          except Exception:
              d = {}
          print('[FOOTHOLD] inbox 새 제출 · 아직 머지 전')
          print('')
          print('제출자: %s' % os.environ.get('AUTHOR', ''))
          print('PR: %s' % os.environ.get('TITLE', ''))
          files = d.get('files') or []
          if files:
              for f in files:
                  print('')
                  print('· %s' % f.get('path', ''))
                  print('  제목: %s' % str(f.get('title', ''))[:60])
                  # 분류·작성자를 먼저 보여준다. 「학습 계획」이 「회의록」으로
                  # 올라간 사고는 알림에 분류가 없어서 지나쳤다 (2026-08-25).
                  if f.get('doc_kind'):
                      print('  분류: %s   작성: %s'
                            % (f['doc_kind'], f.get('writer', '')))
                  if f.get('lede'):
                      print('  요지: %s' % f['lede'])
                  print('  분량: %s줄 · 증거표기 %s · 출처 %s'
                        % (f.get('lines', '?'), f.get('evidence', '?'), f.get('links', '?')))
                  print('  판정: %s' % ('승격 가능' if f.get('ok') else '손질 필요'))
                  for x in (f.get('fixes') or []):
                      print('    - %s' % x)
          else:
              print('')
              names = [x.strip() for x in os.environ.get('FILES', '').split(chr(10)) if x.strip()]
              # 파일이 많으면 본문이 텔레그램 4096자 제한을 넘어 400 이 난다.
              # 2026-09-08 에 영상 42개짜리 PR(#301)에서 실제로 터졌다.
              for line in names[:15]:
                  print('· %s' % line)
              if len(names) > 15:
                  print('· 외 %d개' % (len(names) - 15))
          print('')
          print('검토하시고 머지하면 승격 검토 큐가 열립니다.')
          print(os.environ.get('URL', ''))
          PY
          # 길이 자르기는 여기서 하지 않는다. notify_send.sh 가 «보내기 직전»에 한다.
          # 두 곳에서 자르면 잘린 것을 또 잘라 꼬리말이 겹친다. 자르기는 전송의 일이고,
          # 한 자리에 두어야 pr-notify.yml 처럼 빠뜨린 곳이 안 생긴다 (실제로 빠져 있었다).
          # 본문이 비면 «보냈다»가 거짓이 된다. 보내기 전에 센다.
          if [ ! -s tg.txt ]; then
            echo "::warning::텔레그램 본문이 비었습니다. 보내지 않습니다"; exit 0
          fi
          # 길이 제한·재시도·실패 보고는 전부 notify_send.sh 가 한다. 여기서 죽지 않는다.
          bash .github/scripts/notify_send.sh telegram tg.txt "inbox 제출 · 텔레그램"

      # 팀원의 AI 는 우리 문서 표준을 모른 채 올린다. 그러면 팀장이 머지한 뒤
      # 발견해서 다시 시키게 되고 일이 쌓인다. 그래서 «무엇을 어떻게 쓰라»고
      # 설명하는 대신 «채워진 블록»을 그대로 준다. 복사해 붙이면 끝난다.
      - name: PR 코멘트 (붙여넣을 머리 다섯 줄)
        if: steps.files.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          set -uo pipefail
          # ★ -f 로만 보면 안 된다. 앞 단계에서 검수기가 죽으면 «{}» 가 쓰이는데
          #   그 파일도 «있다». 그대로 두면 need=[] 가 되어 «메타가 다 갖춰져
          #   있습니다» 로 초록불이 난다. 빈 산출물이 긍정 보고가 되는 경로다.
          if [ -f .github/scripts/review_inbox.py ] && { [ ! -s review.json ] || ! jq -e 'has("files")' review.json >/dev/null 2>&1; }; then
            printf '%s\n' "$FILES" | PR_AUTHOR="$AUTHOR" TODAY="$(TZ=Asia/Seoul date '+%F %H:%M')" xargs python3 .github/scripts/review_inbox.py > review.json || { echo "::warning::review_inbox.py 실패"; echo '{"error":"review failed"}' > review.json; }
          fi
          # ★ GitHub Actions 의 기본 셸은 bash -e 다. set -uo pipefail 은 -e 를 끄지 않는다.
          #   아래 파이썬이 「붙일 것 없음」을 9 로 알리는데, -e 가 켜져 있으면 그 순간
          #   스크립트가 죽어 RC=$? 에 도달하지 못한다. 그래서 메타가 잘 갖춰진 PR 일수록
          #   검사가 실패했다. 판정이 뒤집혀 있었다. 여기서만 -e 를 끈다.
          set +e
          python3 - <<'PYEOF' > comment.md
          import io, json, sys
          sys.stdout.reconfigure(encoding='utf-8')
          try:
              d = json.load(io.open('review.json', encoding='utf-8'))
          except Exception:
              d = {}
          need = [f for f in (d.get('files') or []) if f.get('block')]
          if not need:
              raise SystemExit(9)          # 붙일 것이 없으면 코멘트도 없다
          print('### 올려 주셔서 감사합니다. 아래만 채우면 그대로 정본으로 올라갑니다')
          print('')
          print('문서 맨 위에 이 다섯 줄이 필요합니다. **그대로 복사해 붙여넣고 값만 고쳐 주세요.**')
          print('')
          print('- `분류` 는 여덟 중 하나: 회의록 · 리서치 · 실험 · 계획 · 결정 · 운영 · 현장 · 가이드')
          print('- `근거` 는 넷 중 하나: 공식 문서 · 실측 · 본인 노트 · 미확인')
          print('- `상태` 는 셋 중 하나: 초안 · 검토중 · 확정')
          print('')
          for f in need:
              print('#### `%s`' % f['path'])
              print('')
              print('```')
              print(f['block'])
              print('```')
              fixes = [x for x in (f.get('fixes') or []) if '메타' not in x]
              if fixes:
                  print('')
                  print('그 밖에 보완하면 좋은 것:')
                  for x in fixes:
                      print('- %s' % x)
              print('')
          print('---')
          print('')
          print('고치지 않아도 제출은 됩니다. 팀장이 승격할 때 채웁니다.')
          print('규칙 전문은 저장소 루트의 AGENTS.md 와 https://foothold-project.vercel.app/collab 에 있습니다.')
          PYEOF
          RC=$?
          if [ "$RC" = "9" ]; then
            echo "메타가 다 갖춰져 있습니다. 코멘트 생략."; exit 0
          fi
          if [ "$RC" != "0" ]; then
            # 우리 스크립트의 버그다. 소리는 내되 PR 을 막지는 않는다.
            # 안내 코멘트가 없다고 팀원의 제출물이 나빠지는 것은 아니다.
            echo "::warning::코멘트 생성 실패 (rc=$RC). 안내 코멘트 없이 넘어갑니다"
            echo "- 안내 코멘트 생성 실패 (rc=\`$RC\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # synchronize 로 재실행되면 같은 블록을 또 단다. 먼저 세어 본다.
          BEFORE=$(gh pr view "$PR" -R "$REPO" --json comments --jq '[.comments[] | select(.body | startswith("### 올려 주셔서"))] | length')
          if [ "$BEFORE" -gt 0 ]; then
            echo "이미 안내 코멘트가 있습니다 ($BEFORE개). 중복으로 달지 않습니다."; exit 0
          fi
          gh pr comment "$PR" -R "$REPO" --body-file comment.md
          N=$(gh pr view "$PR" -R "$REPO" --json comments --jq '[.comments[] | select(.body | startswith("### 올려 주셔서"))] | length')
          echo "확인: 안내 코멘트 $BEFORE개 -> $N개"
          # ★ 총 개수만 세면 이전 런이 남긴 것에 속는다. 이번 런에서 늘었는지 본다.
          #   늘지 않았으면 확실히 알린다. 다만 이것도 «알림»이라 PR 은 막지 않는다.
          if [ "$N" -gt "$BEFORE" ]; then
            echo "- 안내 코멘트 1건 작성" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::이번 런에서 코멘트가 안 늘었습니다 ($BEFORE -> $N)"
            echo "- 안내 코멘트 작성 실패 ($BEFORE -> $N)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      # ★ 마지막에 «무슨 일이 있었는지»를 런 요약에 한 줄로 남긴다.
      #   always() 라 앞이 어떻게 되든 돈다. 조용한 성공과 조용한 실패를
      #   구분하지 못하면 화면만 봐서는 도는 것과 죽은 것이 같아 보인다.
      - name: 판정 (알림은 관문이 아니다)
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## inbox 제출 알림"
            echo ""
            echo "이 워크플로는 **알림**입니다. 실패해도 PR 검수와는 무관합니다."
            echo "빨간불이 보이면 먼저 아래 판정을 읽어 주세요."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/notify_send.sh verdict || true
