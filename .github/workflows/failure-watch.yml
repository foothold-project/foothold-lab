# 자동화가 «조용히 죽는 것» 을 막는다.
#
# 2026-08-30 에 주간 다이제스트가 실패했고 아무도 6일 동안 몰랐다. 이 저장소의
# 워크플로 18종 중 실패를 알리는 장치가 하나도 없었기 때문이다. 성공하면 조용하고
# 실패해도 조용하니, 화면만 봐서는 «도는 것» 과 «죽은 것» 이 구별되지 않았다.
#
# 워크플로 이름을 나열해 두면 나중에 생긴 것이 빠진다(2026-09-01 · 09-04 에 같은
# 부류로 두 번 당했다). 그래서 이름을 적지 않고 실행 기록을 조회한다.
#
# 실패가 없어도 월요일에는 한 줄 보낸다. 그래야 «알림이 안 온 것» 과 «감시가 죽은
# 것» 이 구별된다.
name: 자동화 실패 감시

on:
  schedule:
    - cron: "0 22 * * *"        # 매일 07:00 KST
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 최근 실패 모아 보고
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 시크릿이 없으면 이 감시는 «영원히 아무 말도 못 하는 상태» 다.
          # 그것을 초록불로 넘기면 감시가 죽은 것을 아무도 모른다.
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::텔레그램 시크릿이 없다. 이 감시는 보고할 통로가 없다"
            exit 1
          fi
          gh run list --repo "$REPO" --limit 200 \
            --json name,conclusion,createdAt,url,event,headBranch > runs.json
          echo "조회 응답 $(wc -c < runs.json) 바이트"

          # 종료코드 2 = «본문은 만들었다 · 다만 조회가 못 미덥다».
          # 여기서 바로 죽이면 사람이 그 사실을 못 듣는다. 보내고 나서 빨간불로 만든다.
          set +e
          python3 .github/scripts/failure_digest.py runs.json > tg.txt
          DIG_RC=$?
          set -e
          if [ "$DIG_RC" -ne 0 ] && [ "$DIG_RC" -ne 2 ]; then
            echo "::error::다이제스트 생성이 실패했다 (rc=$DIG_RC)"
            exit 1
          fi

          if [ ! -s tg.txt ]; then
            if [ "$DIG_RC" -eq 2 ]; then
              echo "::error::조회가 못 미더운데 본문이 비었다"; exit 1
            fi
            echo "보낼 것 없음 (실행 기록은 정상적으로 읽혔다)"
            exit 0
          fi

          # ★ 전에는 `curl -sS ... | head -c 300` 이었다. `-f` 도 `%{http_code}` 도
          #   없어서 HTTP 401/400 에서도 exit 0 이었다. 토큰이 폐기되면 응답 JSON 이
          #   로그에 300자 찍히고 런은 초록불로 끝났다.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${TG_CHAT}" \
                 --data-urlencode "parse_mode=HTML" \
                 --data-urlencode "text@tg.txt")
          echo "텔레그램 HTTP $CODE"
          case "$CODE" in
            2*) echo "전송 확인" ;;
            *)  echo "::error::텔레그램 전송 실패 (HTTP $CODE). 감시 보고가 안 나갔다"; exit 1 ;;
          esac

          if [ "$DIG_RC" -eq 2 ]; then
            echo "::error::보고는 보냈다. 다만 실행 기록 조회가 못 미덥다 (위 본문 참조)"
            exit 1
          fi
