# main 직접 push 감시. 규칙(2026-08-13 팀장): lab main 직접 커밋은 관리자만.
#
#   왜 «감시»인가: 강제(룰셋·브랜치 보호)는 무료 플랜의 비공개 저장소에서 불가능하다.
#   실측: POST /rulesets → 403 "Upgrade to GitHub Pro or make this repository public".
#   그래서 어길 수 없게 만드는 대신, 어기면 그 자리에서 보이게 만든다.
#   lab 을 공개로 바꾸거나 유료 플랜이 되면 이 워크플로를 룰셋으로 교체한다.
name: main 직접 push 감시

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    # 관리자 본인과 자동화 봇은 허용 대상이다
    if: >-
      github.actor != 'vfxpedia' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 알림
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then echo "시크릿 없음"; exit 1; fi
          TITLE=$(printf '%s' "$MSG" | head -n 1 | cut -c1-100)
          {
            printf '규칙상 lab 의 main 직접 커밋은 팀장만 합니다. 브랜치를 만들어 PR 로 올려 주세요.\n'
            printf '커밋: %s\n' "$TITLE"
            printf 'https://github.com/%s/commit/%s\n' "$REPO" "$SHA"
            printf '(작업물은 사라지지 않았습니다. 다음부터 브랜치로 올리면 됩니다)\n'
          } > desc.txt
          CODE=$(jq -n --arg t "lab main 직접 push: ${ACTOR}" --rawfile d desc.txt \
                   '{embeds:[{title:$t, description:$d, color:11027200}]}' \
                 | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                        -H "Content-Type: application/json" -d @- "$HOOK")
          echo "HTTP $CODE"
          case "$CODE" in 2*) echo "전송 확인" ;; *) echo "전송 실패"; exit 1 ;; esac
