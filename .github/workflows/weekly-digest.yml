# 팀 주간 다이제스트 재료 수집.
#
#   왜 「재료」만 모으는가: 다이제스트는 «무엇을 알게 됐나» 를 쓰는 문서다.
#   그건 판단이라 기계가 대신 못 쓴다. 커밋 목록에서 「보상이 높다고 걷는 것이
#   아니다」 같은 문장은 나오지 않는다. 기계가 흉내 내면 그럴듯하고 틀린 글이 남는다.
#   그래서 모으는 일만 자동으로 하고, 쓰는 일은 사람이 한다.
#
#   왜 여기(GitHub)에서 도는가: 어떤 기기도 켜져 있을 필요가 없다 (업무 철칙 1).
name: 주간 다이제스트 재료

on:
  schedule:
    - cron: "0 12 * * 0"      # 일요일 21:00 KST
  workflow_dispatch:
    inputs:
      week:
        description: "주 지정 (예: 2026-W35). 비우면 이번 주"
        required: false

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 주간 이력을 보려면 전체 이력이 필요하다

      - name: 재료 모으기
        id: gather
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          if [ -n "${WEEK:-}" ]; then
            python3 tools/digest_material.py --week "$WEEK" | tee out.txt
          else
            python3 tools/digest_material.py | tee out.txt
          fi
          FILE=$(sed -n 's/^만들었습니다: //p' out.txt | tr -d '\r')
          test -n "$FILE" && test -s "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$(basename "$FILE" -material.md)" >> "$GITHUB_OUTPUT"

      - name: 커밋
        env:
          FILE: ${{ steps.gather.outputs.file }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: 다이제스트 재료 수집 ($(TZ=Asia/Seoul date +%F))"
          git push
          echo "커밋 완료"

      - name: 팀장 텔레그램
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE: ${{ steps.gather.outputs.file }}
          TAG: ${{ steps.gather.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "텔레그램 시크릿 없음. 건너뜀"; exit 0
          fi
          {
            echo "[FOOTHOLD] 주간 다이제스트 재료가 모였습니다 · $TAG"
            echo ""
            sed -n 's/^  //p' out.txt | head -3
            echo ""
            echo "이 파일은 다이제스트가 아닙니다. 재료입니다."
            echo "골라서 docs/digest/$TAG.md 를 쓰면 다음 배포에 표지 띠로 올라갑니다."
            echo ""
            echo "https://github.com/$REPO/blob/main/$FILE"
          } > tg.txt
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${TG_CHAT}" \
                 --data-urlencode "disable_web_page_preview=true" \
                 --data-urlencode "text@tg.txt")
          echo "텔레그램 HTTP $CODE"
          case "$CODE" in 2*) ;; *) echo "::warning::텔레그램 전송 실패" ;; esac
