# 보드 뷰 정리. 팀장 결정(2026-08-13): 로드맵은 WBS 하나만 남긴다.
#
#   «로드맵 · 계획»과 «로드맵 · 실적» 두 뷰를 만들어 뒀었는데, 일감 7건에 실적 0건인
#   지금은 두 화면이 같은 그림이라 정보가 없다. 뷰가 셋이면 어느 게 진짜인지
#   매번 판단해야 한다. 평소에는 Table 하나 + WBS 로드맵 하나로 본다.
#   계획 대 실적 비교가 필요해지는 중간보고(11월) 시점에 다시 만들면 된다.
name: 보드 뷰 정리

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 계획·실적 로드맵 뷰 삭제
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORG: foothold-project
          PROJECT_NUMBER: "1"
        run: |
          set -euo pipefail
          gh api graphql -f query='
            query($org:String!,$num:Int!){
              organization(login:$org){ projectV2(number:$num){
                views(first:20){ nodes{ id name layout } } } } }' \
            -f org="$ORG" -F num="$PROJECT_NUMBER" \
            --jq '.data.organization.projectV2.views.nodes[] | "\(.id)\t\(.name)\t\(.layout)"' \
          | while IFS=$'\t' read -r VID VNAME VLAYOUT; do
              case "$VNAME" in
                "로드맵 · 계획"|"로드맵 · 실적")
                  gh api graphql -f query='
                    mutation($id:ID!){ deleteProjectV2View(input:{viewId:$id}){ clientMutationId } }' \
                    -f id="$VID" >/dev/null
                  echo "삭제: $VNAME"
                  ;;
                *)
                  echo "유지: $VNAME ($VLAYOUT)"
                  ;;
              esac
            done
