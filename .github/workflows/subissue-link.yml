# 이슈를 만들면 "어느 갈래의 일인가" 드롭다운을 읽어 그 갈래 부모 밑에 매단다.
#
#   WBS 1레벨 = 다섯 갈래(평가 체계·험지 환경·정책 학습·실기 전이·운영).
#   산출물이 실제로 갈라지는 지점만 부모로 둔다. 퀘스트 13개를 부모로 썼더니
#   부모(16)가 일감(7)보다 많아졌다(2026-08-13 팀장 지적). 퀘스트 번호는
#   드롭다운 설명·이슈 제목에 남겨 이야기는 유지한다. 시기는 마일스톤이 담당한다.
#
#   왜: 이슈가 늘어나면 목록은 평평해지고 "이게 어느 단계 일이었지" 를 아무도 모르게 된다.
#   GitHub 의 sub-issue 는 부모에 진행률(3/7)을 자동으로 표시해 주므로,
#   단계별 진척이 보드 밖에서도 한눈에 보인다.
#
#   ★ 부모 이슈는 미리 만들어 두지 않는다. 그 퀘스트의 첫 이슈가 올라올 때 **워크플로가 만든다.**
#     기획이 확정되기 전에 빈 부모 6개를 세워두면 쓰지도 않는 껍데기가 목록을 차지한다.
#     (done date 필드를 워크플로가 스스로 만든 것과 같은 방식)
name: 갈래별 sub-issue 연결

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  link:
    # ★ 자기가 만든 부모 이슈에 다시 반응하면 안 된다.
    #   2026-08-12 에 그 방어가 없어서 재귀 루프가 돌았다. 부모를 만들면 'opened' 가 다시 오고,
    #   그 부모의 본문에도 단계 문구가 들어 있어 또 부모를 만들기를 반복했다.
    #   제목이 점점 길어지다가 256자 제한에 걸려서야 멈췄다. 방어를 두 겹으로 둔다.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.issue.title, '[평가 체계]') &&
      !startsWith(github.event.issue.title, '[험지 환경]') &&
      !startsWith(github.event.issue.title, '[정책 학습]') &&
      !startsWith(github.event.issue.title, '[실기 전이]') &&
      !startsWith(github.event.issue.title, '[운영]')
    runs-on: ubuntu-latest
    steps:
      - name: 부모 찾거나 만들어서 매달기
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          # 퀘스트 부모는 이 저장소 한 곳에만 둔다. 저장소마다 만들면 같은 부모가
          # lab 과 rl 에 하나씩 생겨 WBS 가 두 갈래로 쪼개진다. sub-issue 는
          # 저장소를 넘어 연결된다(2026-08-12 실측). rl 은 공개라 보드에서 밖에도 보인다.
          PARENT_REPO: foothold-project/foothold-rl
          NUM: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail

          # 템플릿의 퀘스트 줄만 뽑는다. 줄 전체가 퀘스트 문구인 경우로 한정한다.
          #   본문 아무 데나 있는 문구를 잡으면 부모의 설명문까지 읽혀 제목이 길어진다
          #   (2026-08-12 재귀 사고의 직접 원인).
          LINE=$(printf '%s' "$BODY" | tr -d '\r' \
                  | grep -oE '^(평가 체계|험지 환경|정책 학습|실기 전이|운영) \([^)]{2,60}\)[[:space:]]*$' \
                  | head -n1 || true)
          if [ -z "$LINE" ]; then
            echo "갈래 표기 없음 (템플릿 미사용이거나 비워둠) → 연결 생략"
            exit 0
          fi
          BRANCH="${LINE%% (*}"
          echo "갈래: $BRANCH"

          PARENT_TITLE="[$BRANCH]"

          # 이미 이 이슈에 부모가 있으면 손대지 않는다 (사람이 옮겼을 수 있다)
          HAS_PARENT=$(gh api graphql -f query='
            query($owner:String!,$name:String!,$num:Int!){
              repository(owner:$owner,name:$name){ issue(number:$num){ parent{ number } } } }' \
            -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F num="$NUM" \
            --jq '.data.repository.issue.parent.number // ""')
          if [ -n "$HAS_PARENT" ]; then
            echo "이미 부모 #$HAS_PARENT 에 매달려 있음 → 그대로 둠"
            exit 0
          fi

          # 부모 이슈 찾기 (제목 완전 일치, 열린 것 우선)
          PARENT=$(gh issue list --repo "$PARENT_REPO" --state all --limit 100 \
                     --search "\"$PARENT_TITLE\" in:title" --json number,title \
                   --jq "[.[] | select(.title == \"$PARENT_TITLE\")] | .[0].number // \"\"")

          if [ -z "$PARENT" ]; then
            echo "부모 없음 → 새로 만든다"
            # 본문은 파일로 만든다. YAML 블록 안에서 여러 줄 문자열을 그대로 쓰면
            # 열 0 에서 시작한 줄이 블록을 끊어 워크플로가 통째로 깨진다(두 번 겪었다).
            {
              printf '퀘스트 **%s** 에 속한 작업들을 모으는 부모 이슈입니다.\n\n' "$QUEST"
              printf '이 이슈는 직접 작업하지 않습니다. 아래 하위 항목이 실제 일이고,\n'
              printf '하위가 닫힐 때마다 진행률이 자동으로 올라갑니다.\n\n'
              printf '**완료 조건은 설계도 §3 퀘스트 보드에 있습니다.** 여기에 옮겨 적지 않습니다.\n'
              printf '두 곳에 적으면 한쪽만 고쳐져서 어느 쪽이 맞는지 물어야 하기 때문입니다.\n\n'
              printf '설계도: https://foothold-project.vercel.app/plan.html\n'
              printf '보드:  https://github.com/orgs/foothold-project/projects/1\n\n'
              printf '(이 부모는 해당 단계의 첫 이슈가 올라올 때 자동으로 만들어졌습니다.)\n'
            } > parent-body.md
            NEW=$(gh issue create --repo "$PARENT_REPO" --title "$PARENT_TITLE" \
              --body-file parent-body.md | grep -oE '[0-9]+$')
            echo "부모 #$NEW 생성"

            # 경합 정리: 두 저장소의 이슈가 동시에 올라오면 양쪽 워크플로가 각각
            # "부모 없음" 을 보고 부모를 하나씩 만든다(2026-08-12 실측). 만든 뒤 다시 세어
            # 같은 제목이 여럿이면 가장 작은 번호만 남기고 내가 만든 것을 지운다.
            sleep 5
            PARENT=$(gh issue list --repo "$PARENT_REPO" --state all --limit 100 \
                       --search "\"$PARENT_TITLE\" in:title" --json number,title \
                     --jq "[.[] | select(.title == \"$PARENT_TITLE\") | .number] | min // \"\"")
            if [ "$PARENT" != "$NEW" ]; then
              echo "동시에 만들어진 부모 발견. #$NEW 를 지우고 #$PARENT 로 모은다"
              DUP_ID=$(gh api graphql -f query='
                query($owner:String!,$name:String!,$num:Int!){
                  repository(owner:$owner,name:$name){ issue(number:$num){ id } } }' \
                -f owner="${PARENT_REPO%%/*}" -f name="${PARENT_REPO##*/}" -F num="$NEW" \
                --jq '.data.repository.issue.id')
              gh api graphql -f query='
                mutation($id:ID!){ deleteIssue(input:{issueId:$id}){ clientMutationId } }' \
                -f id="$DUP_ID" >/dev/null || echo "중복 삭제 실패(권한). 사람이 정리 필요"
            fi
          fi

          PARENT_ID=$(gh api graphql -f query='
            query($owner:String!,$name:String!,$num:Int!){
              repository(owner:$owner,name:$name){ issue(number:$num){ id } } }' \
            -f owner="${PARENT_REPO%%/*}" -f name="${PARENT_REPO##*/}" -F num="$PARENT" \
            --jq '.data.repository.issue.id')

          gh api graphql -f query='
            mutation($p:ID!,$c:ID!){
              addSubIssue(input:{issueId:$p, subIssueId:$c}){ issue{ number } } }' \
            -f p="$PARENT_ID" -f c="$NODE_ID" >/dev/null

          echo "$REPO#$NUM → $PARENT_REPO#$PARENT 에 연결 완료"
