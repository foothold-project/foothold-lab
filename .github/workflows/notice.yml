# 공지 발송. docs/notices/ 의 md 를 #foothold-notice 로.
#   자동 발송이 아니라 **사람이 방아쇠를 당기는** 구조다(Actions 탭 → Run workflow).
#   시크릿 DISCORD_NOTICE_WEBHOOK (notice 채널의 웹후크) 필요.
#
#   2026-08-25 추가: 문체 관문.
#     사이트 빌드에는 em dash 관문이 있는데 공지에는 없었다. 그래서 «em dash 를
#     쓰지 마세요» 라고 안내하는 공지에 em dash 가 2개 들어간 채로 나갔다.
#     보내기 «전» 에 막는다. 나간 뒤에 고치는 것은 늦다.
name: 공지 발송

on:
  workflow_dispatch:
    inputs:
      file:
        description: "보낼 파일 (docs/notices/ 안)"
        default: "docs/notices/latest.md"
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 문체 검사 (보내기 전에 막는다)
        env:
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "파일 없음: $FILE"; exit 1; }
          python3 - "$FILE" <<'PY'
          import io, sys
          sys.stdout.reconfigure(encoding='utf-8')
          path = sys.argv[1]
          lines = io.open(path, encoding='utf-8').read().split('\n')
          EM = chr(0x2014)          # em dash. 리터럴로 적지 않는다(치환 도구가 먹는다)
          bad = [(i, l) for i, l in enumerate(lines, 1) if EM in l]
          if bad:
              print('::error::em dash %d줄. 공지를 보내지 않습니다.' % len(bad))
              for i, l in bad:
                  print('  %d: %s' % (i, l.strip()[:90]))
              print('')
              print('대신: 문장 끝이면 마침표 · 제목이면 쌍점 · 빈 칸이면 하이픈 · 나열이면 가운뎃점')
              raise SystemExit(1)
          print('문체 OK · %d줄' % len(lines))
          PY

      - name: 발송
        env:
          HOOK: ${{ secrets.DISCORD_NOTICE_WEBHOOK }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [ -n "$HOOK" ] || { echo "DISCORD_NOTICE_WEBHOOK 미설정"; exit 1; }
          # 디스코드 한 메시지 2000자 제한. 1900자 단위로 쪼개 순서대로 보낸다
          split -b 1900 "$FILE" /tmp/part_
          for p in /tmp/part_*; do
            CODE=$(jq -n --rawfile c "$p" '{content:$c}' \
                   | curl -sS -o /dev/null -w "%{http_code}" -X POST \
                          -H "Content-Type: application/json" -d @- "$HOOK")
            echo "조각 $p → HTTP $CODE"
            case "$CODE" in 2*) ;; *) echo "★ 전송 실패"; exit 1;; esac
            sleep 1
          done
          echo "발송 완료: $FILE"
