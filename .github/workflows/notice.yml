# 공지 발송. docs/notices/ 의 md 를 #foothold-notice 로.
#   자동 발송이 아니라 **사람이 방아쇠를 당기는** 구조다(Actions 탭 → Run workflow).
#   시크릿 DISCORD_NOTICE_WEBHOOK (notice 채널의 웹후크) 필요.
#
#   2026-08-25 추가: 문체 관문.
#     사이트 빌드에는 em dash 관문이 있는데 공지에는 없었다. 그래서 «em dash 를
#     쓰지 마세요» 라고 안내하는 공지에 em dash 가 2개 들어간 채로 나갔다.
#     보내기 «전» 에 막는다. 나간 뒤에 고치는 것은 늦다.
name: 공지 발송

on:
  workflow_dispatch:
    inputs:
      file:
        description: "보낼 파일 (docs/notices/ 안)"
        default: "docs/notices/latest.md"
        required: true
      mode:
        description: "preview = 팀장 텔레그램에만 예고 · send = 디스코드 발송"
        default: preview
        required: true
        type: choice
        options:
          - preview
          - send

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 문체 검사 (보내기 전에 막는다)
        env:
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "파일 없음: $FILE"; exit 1; }
          python3 - "$FILE" <<'PY'
          import io, sys
          sys.stdout.reconfigure(encoding='utf-8')
          path = sys.argv[1]
          lines = io.open(path, encoding='utf-8').read().split('\n')
          EM = chr(0x2014)          # em dash. 리터럴로 적지 않는다(치환 도구가 먹는다)
          bad = [(i, l) for i, l in enumerate(lines, 1) if EM in l]
          if bad:
              print('::error::em dash %d줄. 공지를 보내지 않습니다.' % len(bad))
              for i, l in bad:
                  print('  %d: %s' % (i, l.strip()[:90]))
              print('')
              print('대신: 문장 끝이면 마침표 · 제목이면 쌍점 · 빈 칸이면 하이픈 · 나열이면 가운뎃점')
              raise SystemExit(1)
          print('문체 OK · %d줄' % len(lines))
          PY

      # ★ 2026-08-26 신설. 게시 절차는 «정리 -> 팀장 컨펌 -> 게시» 인데
      #   컨펌 단계가 사람 기억에 맡겨져 있었고 실제로 건너뛰었다.
      #   기본값이 preview 라 그냥 돌리면 팀장에게만 간다. 실수로 팀 전체에
      #   나가지 않는다. 컨펌한 뒤 mode=send 로 다시 돌린다.
      - name: 팀장 예고 (preview 면 여기서 끝난다)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE: ${{ inputs.file }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "텔레그램 시크릿 없음. 예고 건너뜀"; exit 0
          fi
          N=$(wc -m < "$FILE")
          {
            if [ "$MODE" = "send" ]; then
              echo "[FOOTHOLD] 공지를 디스코드로 «보냅니다»"
            else
              echo "[FOOTHOLD] 공지 예고 (아직 안 보냈습니다)"
            fi
            echo ""
            echo "파일: $FILE · ${N}자"
            echo ""
            echo "===== 아래가 그대로 나갑니다 ====="
            echo ""
            head -c 2600 "$FILE"
            if [ "$N" -gt 2600 ]; then
              echo ""; echo ""; echo "... (이하 생략. 파일 전문을 보세요)"
            fi
            if [ "$MODE" != "send" ]; then
              echo ""; echo ""
              echo "문제 없으면 mode=send 로 다시 돌려주세요."
            fi
          } > tg.txt
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${TG_CHAT}" \
                 --data-urlencode "disable_web_page_preview=true" \
                 --data-urlencode "text@tg.txt")
          echo "텔레그램 HTTP $CODE"
          case "$CODE" in 2*) echo "예고 전송 확인" ;; *) echo "전송 실패"; exit 1 ;; esac

      - name: 발송
        if: ${{ inputs.mode == 'send' }}
        env:
          HOOK: ${{ secrets.DISCORD_NOTICE_WEBHOOK }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [ -n "$HOOK" ] || { echo "DISCORD_NOTICE_WEBHOOK 미설정"; exit 1; }
          # 디스코드 한 메시지 2000자 제한. 1900자 단위로 쪼개 순서대로 보낸다
          split -b 1900 "$FILE" /tmp/part_
          for p in /tmp/part_*; do
            CODE=$(jq -n --rawfile c "$p" '{content:$c}' \
                   | curl -sS -o /dev/null -w "%{http_code}" -X POST \
                          -H "Content-Type: application/json" -d @- "$HOOK")
            echo "조각 $p → HTTP $CODE"
            case "$CODE" in 2*) ;; *) echo "★ 전송 실패"; exit 1;; esac
            sleep 1
          done
          echo "발송 완료: $FILE"
