# 평가 하네스 시험 131개를 PR 에서 돌린다.
#
# 왜 생겼나 (2026-09-09 감사):
#   `sim/eval/tests/` 에 시험 131개가 있고 전부 통과하는데, `.github/` 어디에도
#   그 경로가 없었다. **아무도 안 부르고 있었다.** 시험이 없는 것보다 있는데
#   안 도는 것이 더 나쁘다. 있으니 돌고 있다고 믿게 되기 때문이다.
#   그동안 `metrics.py` `report.py` `terrains.py` `overlay/` 를 바꾸는 PR 은
#   평가 숫자를 바꾸면서도 초록불로 머지됐다.
#
# 무엇이 여기서 돌고 무엇이 못 도나 (2026-09-09 실측 · 빈 가상환경에서 재봤다):
#   · `metrics.py` `report.py` `terrains.py` `overlay/trace.py` 는 Isaac 도 GPU 도
#     torch 도 쓰지 않는다. import 문을 전수로 훑어 확인했다. 그래서 러너에서 돈다.
#   · `overlay/hud.py` 는 Pillow 를, 그 안의 글꼴 검사는 fontTools 를 쓴다.
#     둘을 같이 깔면 9건이 살아난다. **따로 깔면 안 된다** · Pillow 만 깔면
#     글꼴 시험 2건이 skip 이 아니라 ERROR 가 된다 (실측).
#   · `overlay/render.py` 의 4건은 PyAV 를 쓴다. ffmpeg 에 붙는 무거운 의존이라
#     이 관문에는 안 건다. **이 4건은 CI 에서 안 돈다.** 사람이 손으로 돌린다.
#   · Isaac Sim 이 필요한 시험은 이 폴더에 없다. 있었다면 여기 안 걸었을 것이다.
#
# 관문이 스스로 눈을 감지 않게: 판정은 `run_sim_tests.py` 가 한다.
#   unittest 는 시험을 0개 찾아도 «OK» 와 종료코드 0 을 준다. 그래서 «실제로 돈
#   개수» 를 바닥값과 대조한다. 건너뛴 것은 개수와 이유를 매번 찍는다.
name: 평가 하네스 시험

on:
  pull_request:
    paths:
      - 'sim/**'
      - '.github/scripts/run_sim_tests.py'
      - '.github/workflows/sim-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 깔리면 9건이 더 돌고, 못 깔려도 118건은 그대로 돈다.
      # 네트워크 사정으로 이 관문 전체가 막히는 일이 없게 실패를 허용한다.
      # 대신 아래 시험 단계가 «건너뛴 개수와 이유» 를 찍으므로 조용히 줄지 않는다.
      - name: 그림 도구 (있으면 더 돈다)
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check Pillow fonttools

      - name: 시험
        run: python .github/scripts/run_sim_tests.py sim/eval/tests
