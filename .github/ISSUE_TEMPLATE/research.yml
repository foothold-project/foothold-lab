name: 리서치
description: 답을 모르는 질문 하나. 조사 범위가 아니라 질문을 적는다.
title: "[리서치] "
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: 답하려는 질문
      description: 질문이 명확하면 조사는 절반이 끝난다.
      placeholder: Go2 내장 보행 모델의 행동을 로깅할 수 있는가? 가능하다면 어떤 API 로?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 이 답이 무엇을 가르나
      description: 답에 따라 우리 선택이 어떻게 달라지는지. 이게 안 써지면 지금 할 조사가 아니다.
      placeholder: 로깅이 되면 증류 teacher 로 쓸 수 있고, 안 되면 NVIDIA 공개 체크포인트를 teacher 로 써야 한다
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 어디를 볼 것인가
      description: 아는 만큼만. 조사하면서 갱신한다.
      placeholder: |
        Unitree SDK 공식 문서
        unitree_rl_lab 저장소
  - type: checkboxes
    id: rules
    attributes:
      label: 마칠 때 지킬 것
      options:
        - label: 정제본을 docs/research/ 에 md 로 남긴다 (원 출처 링크 포함)
          required: true
        - label: 숫자를 인용할 때는 논문이나 공식 문서만 쓴다 — 블로그 수치를 논문 수치처럼 쓰지 않는다
          required: true
        - label: 확인하지 못한 것은 "미확인"이라고 적는다
          required: true
  - type: dropdown
    id: quest
    attributes:
      label: 어느 퀘스트의 일인가
      description: "설계도 §3 퀘스트 보드. 완료 조건은 거기에 있다: https://foothold-project.vercel.app/plan.html"
      options:
        - "Q0 개발환경 구축 (② 기준)"
        - "Q1 거북이 조종하기 · ROS 입문 (② 기준)"
        - "Q2 남의 정책 재생 (② 기준)"
        - "Q3 첫 기록 재기 (② 기준)"
        - "Q4 지형 조각 1개 (③ 환경)"
        - "Q5 계곡형 지형 조합 (③ 환경)"
        - "Q6 문제를 숫자로 (③ 환경)"
        - "Q7 학습 1회 완주 (④ 학습)"
        - "Q8 기록 갱신 (⑤ 평가)"
        - "Q9 다른 세계에서도 · sim2sim (⑥ 전이)"
        - "Q10 계약서 검증 · 정합성 6종 (⑥ 전이)"
        - "Q11 로봇과 첫 대화 · ROS2 (⑥ 전이)"
        - "Q12 실기 첫 걸음 · 안전 사다리 (⑥ 전이)"
        - "보스전 실기 험지 10m + 갭 리포트 (⑦ 적응)"
        - "현장·장비 조사 (① 관측)"
        - "운영 문서 · 회의 · 인프라"
