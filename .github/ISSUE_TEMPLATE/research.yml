name: 리서치
description: 답을 모르는 질문 하나. 조사 범위가 아니라 질문을 적는다.
title: "[리서치] "
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: 답하려는 질문
      description: 질문이 명확하면 조사는 절반이 끝난다.
      placeholder: Go2 내장 보행 모델의 행동을 로깅할 수 있는가? 가능하다면 어떤 API 로?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 이 답이 무엇을 가르나
      description: 답에 따라 우리 선택이 어떻게 달라지는지. 이게 안 써지면 지금 할 조사가 아니다.
      placeholder: 로깅이 되면 증류 teacher 로 쓸 수 있고, 안 되면 NVIDIA 공개 체크포인트를 teacher 로 써야 한다
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 어디를 볼 것인가
      description: 아는 만큼만. 조사하면서 갱신한다.
      placeholder: |
        Unitree SDK 공식 문서
        unitree_rl_lab 저장소
  - type: checkboxes
    id: rules
    attributes:
      label: 마칠 때 지킬 것
      options:
        - label: 정제본을 docs/research/ 에 md 로 남긴다 (원 출처 링크 포함)
          required: true
        - label: 숫자를 인용할 때는 논문이나 공식 문서만 쓴다 — 블로그 수치를 논문 수치처럼 쓰지 않는다
          required: true
        - label: 확인하지 못한 것은 "미확인"이라고 적는다
          required: true
  - type: dropdown
    id: stage
    attributes:
      label: 설계도 어느 단계인가
      description: https://foothold-project.vercel.app/plan.html
      options:
        - "① 땅 보러 가기 — 조사·확인"
        - "② 터 다지기 — 환경·기준선"
        - "③ 연습장 만들기 — 지형·평가"
        - "④ 걷는 법 배우기 — 학습"
        - "⑤ 기록 재기 — 측정·발표"
        - "⑥ 몸에 옮기기 — 실기 전이"
        - "⑦ 현실에서 달리기 — 최종"
        - "운영 — 문서·회의·인프라"
