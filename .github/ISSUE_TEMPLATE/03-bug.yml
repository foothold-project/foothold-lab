name: 막힘·오류
description: 안 되는 것을 올리는 곳. 에러 메시지를 그대로 붙여넣으면 됩니다.
title: "[막힘] "
labels: [blocked]
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 안 되나
      description: 하려던 것 + 에러 메시지나 화면을 그대로. 정리 안 해도 됩니다.
      placeholder: |
        train.py 실행하면 아래 에러가 납니다.
        (에러 메시지 통째로 붙여넣기)
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 해본 것 (선택)
      description: 시도해 본 게 있으면. 없으면 비워두세요.
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 이 이슈가 프로젝트의 어느 축에 속하는지 고릅니다. 애매하면 C/운영.
      options:
        - "A/정책학습 · 학습 · 보상 · 관측 · 파인튜닝"
        - "A/지형씬제작 · 지형과 씬 에셋 제작"
        - "A/평가 · 일반화 벤치마크 · 지표"
        - "A/트윈렌더 · 실공간 복원 · 3DGS · 렌더 · 합성데이터"
        - "B/항법 · ROS2 · TF · SLAM · Nav2"
        - "B/인지 · LiDAR · 카메라 · 센서 융합"
        - "C/기록 · 회의록 · 문서 · 백과 · 커리큘럼 · 발표"
        - "C/운영 · 인프라 · 자동화 · 깃 · 웹 · 예산 · 일정"
  - type: dropdown
    id: gate
    attributes:
      label: 어느 관문까지
      description: 이 일이 끝나야 하는 발표 관문입니다. 모르면 비워 두세요.
      options:
        - "A-정책 · 9월 12일"
        - "MVP · 중간발표 · 9월 30일"
        - "NAV · 실기 항법 · 11월 7일"
        - "FINAL · 최종발표 · 12월 11일"