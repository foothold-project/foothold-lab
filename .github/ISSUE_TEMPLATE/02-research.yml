name: 리서치
description: 답을 모르는 질문 하나를 적는 곳.
title: "[리서치] "
labels: [research]
type: Feature
body:
  - type: textarea
    id: question
    attributes:
      label: 무엇이 궁금한가
      description: 질문 하나면 됩니다. 왜 궁금한지 적으면 더 좋지만 필수 아닙니다.
      placeholder: |
        MuJoCo 로 sim2sim 검증할 때 지형은 어떻게 옮기나?
        (왜: Q9 전에 알아야 함)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 이 이슈가 프로젝트의 어느 축에 속하는지 고릅니다. 애매하면 C/운영.
      options:
        - "A/정책학습 · 학습 · 보상 · 관측 · 파인튜닝"
        - "A/지형씬제작 · 지형과 씬 에셋 제작"
        - "A/평가 · 일반화 벤치마크 · 지표"
        - "A/트윈렌더 · 실공간 복원 · 3DGS · 렌더 · 합성데이터"
        - "B/항법 · ROS2 · TF · SLAM · Nav2"
        - "B/인지 · LiDAR · 카메라 · 센서 융합"
        - "C/기록 · 회의록 · 문서 · 백과 · 커리큘럼 · 발표"
        - "C/운영 · 인프라 · 자동화 · 깃 · 웹 · 예산 · 일정"
  - type: dropdown
    id: gate
    attributes:
      label: 어느 관문까지
      description: 이 일이 끝나야 하는 발표 관문입니다. 모르면 비워 두세요.
      options:
        - "A-정책 · 9월 12일"
        - "MVP · 중간발표 · 9월 30일"
        - "NAV · 실기 항법 · 11월 7일"
        - "FINAL · 최종발표 · 12월 11일"