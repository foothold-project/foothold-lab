name: 작업
description: 해야 할 일 하나. 끝났는지 아닌지 남이 봐도 판정되는 단위로.
title: "[작업] "
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: 무엇을 하나
      description: 한두 문장. "~한다"로 끝낸다.
      placeholder: 조선대 방문 질문지를 만들어 팀에 회람한다
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝났다는 기준
      description: 무엇이 존재하거나 통과하면 끝인가. 이게 안 써지면 아직 쪼개지지 않은 일이다.
      placeholder: |
        docs/questions-chosun.md 가 존재한다
        팀원 1명 이상이 검토 코멘트를 남겼다
    validations:
      required: true
  - type: input
    id: est
    attributes:
      label: 예상 소요
      description: 마감은 등록일 +7일로 자동 기록된다. 더 걸릴 것 같으면 보드에서 end date 를 직접 늘린다.
      placeholder: 반나절 / 2일 / 1주
  - type: input
    id: blocker
    attributes:
      label: 막고 있는 것
      description: 없으면 비워둔다. 있으면 이슈 번호나 사람.
      placeholder: "#12 가 끝나야 시작 가능 / 조선대 방문 후"
  - type: dropdown
    id: stage
    attributes:
      label: 설계도 어느 단계인가
      description: https://foothold-project.vercel.app/plan.html
      options:
        - "① 땅 보러 가기 — 조사·확인"
        - "② 터 다지기 — 환경·기준선"
        - "③ 연습장 만들기 — 지형·평가"
        - "④ 걷는 법 배우기 — 학습"
        - "⑤ 기록 재기 — 측정·발표"
        - "⑥ 몸에 옮기기 — 실기 전이"
        - "⑦ 현실에서 달리기 — 최종"
        - "운영 — 문서·회의·인프라"
    validations:
      required: true
