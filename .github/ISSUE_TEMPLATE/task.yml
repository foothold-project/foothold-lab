name: 작업
description: 해야 할 일 하나. 끝났는지 아닌지 남이 봐도 판정되는 단위로.
title: "[작업] "
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: 무엇을 하나
      description: 한두 문장. "~한다"로 끝낸다.
      placeholder: 조선대 방문 질문지를 만들어 팀에 회람한다
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝났다는 기준
      description: 무엇이 존재하거나 통과하면 끝인가. 이게 안 써지면 아직 쪼개지지 않은 일이다.
      placeholder: |
        docs/questions-chosun.md 가 존재한다
        팀원 1명 이상이 검토 코멘트를 남겼다
    validations:
      required: true
  - type: input
    id: est
    attributes:
      label: 예상 소요
      description: 마감은 등록일 +7일로 자동 기록된다. 더 걸릴 것 같으면 보드에서 end date 를 직접 늘린다.
      placeholder: 반나절 / 2일 / 1주
  - type: input
    id: blocker
    attributes:
      label: 막고 있는 것
      description: 없으면 비워둔다. 있으면 이슈 번호나 사람.
      placeholder: "#12 가 끝나야 시작 가능 / 조선대 방문 후"
  - type: dropdown
    id: quest
    attributes:
      label: 어느 퀘스트의 일인가
      description: "설계도 §3 퀘스트 보드. 완료 조건은 거기에 있다: https://foothold-project.vercel.app/plan.html"
      options:
        - "Q0 개발환경 구축 (② 기준)"
        - "Q1 거북이 조종하기 · ROS 입문 (② 기준)"
        - "Q2 남의 정책 재생 (② 기준)"
        - "Q3 첫 기록 재기 (② 기준)"
        - "Q4 지형 조각 1개 (③ 환경)"
        - "Q5 계곡형 지형 조합 (③ 환경)"
        - "Q6 문제를 숫자로 (③ 환경)"
        - "Q7 학습 1회 완주 (④ 학습)"
        - "Q8 기록 갱신 (⑤ 평가)"
        - "Q9 다른 세계에서도 · sim2sim (⑥ 전이)"
        - "Q10 계약서 검증 · 정합성 6종 (⑥ 전이)"
        - "Q11 로봇과 첫 대화 · ROS2 (⑥ 전이)"
        - "Q12 실기 첫 걸음 · 안전 사다리 (⑥ 전이)"
        - "보스전 실기 험지 10m + 갭 리포트 (⑦ 적응)"
        - "현장·장비 조사 (① 관측)"
        - "운영 문서 · 회의 · 인프라"
    validations:
      required: true
