name: 작업
description: 해야 할 일 하나. 끝났는지 아닌지 남이 봐도 판정되는 단위로.
title: "[작업] "
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: 무엇을 하나
      description: 한두 문장. "~한다"로 끝낸다.
      placeholder: 조선대 방문 질문지를 만들어 팀에 회람한다
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝났다는 기준
      description: 무엇이 존재하거나 통과하면 끝인가. 이게 안 써지면 아직 쪼개지지 않은 일이다.
      placeholder: |
        docs/questions-chosun.md 가 존재한다
        팀원 1명 이상이 검토 코멘트를 남겼다
    validations:
      required: true
  - type: input
    id: est
    attributes:
      label: 예상 소요
      description: 마감은 등록일 +7일로 자동 기록된다. 더 걸릴 것 같으면 보드에서 end date 를 직접 늘린다.
      placeholder: 반나절 / 2일 / 1주
  - type: input
    id: blocker
    attributes:
      label: 막고 있는 것
      description: 없으면 비워둔다. 있으면 이슈 번호나 사람.
      placeholder: "#12 가 끝나야 시작 가능 / 조선대 방문 후"
  - type: dropdown
    id: quest
    attributes:
      label: 어느 갈래의 일인가
      description: "다섯 갈래가 WBS 1레벨이다. 세부 순서(퀘스트 Q0~Q12)는 설계도 §3: https://foothold-project.vercel.app/plan.html"
      options:
        - "평가 체계: 통과율 정의·자동 평가·기준선 (Q3·Q6·Q8)"
        - "험지 환경: 지형 제작·계곡형·3DGS (Q4·Q5)"
        - "정책 학습: 학습 실행·보상·실험 (Q7·Q8)"
        - "실기 전이: 정합성·sim2sim·ROS2·안전 사다리 (Q9~Q12·보스전)"
        - "운영: 문서·회의·인프라·발표·현장조사"
    validations:
      required: true
