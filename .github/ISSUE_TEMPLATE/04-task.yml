name: 작업 등록
description: 이런 작업을 진행합니다 하고 선언하는 곳. 쓰는 건 두 개뿐입니다.
title: "[작업] "
labels: [task]
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: 무엇을 하나
      description: 한두 문장이면 됩니다. 끝났다는 기준까지 적으면 더 좋지만 필수 아닙니다.
      placeholder: 계단 지형 조각을 만들어 로봇을 세워 본다. (끝 기준 스크린샷 한 장)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 이 이슈가 프로젝트의 어느 축에 속하는지 고릅니다. 애매하면 C/운영.
      options:
        - "A/정책학습 · 학습 · 보상 · 관측 · 파인튜닝"
        - "A/지형씬제작 · 지형과 씬 에셋 제작"
        - "A/평가 · 일반화 벤치마크 · 지표"
        - "A/트윈렌더 · 실공간 복원 · 3DGS · 렌더 · 합성데이터"
        - "B/항법 · ROS2 · TF · SLAM · Nav2"
        - "B/인지 · LiDAR · 카메라 · 센서 융합"
        - "C/기록 · 회의록 · 문서 · 백과 · 커리큘럼 · 발표"
        - "C/운영 · 인프라 · 자동화 · 깃 · 웹 · 예산 · 일정"
  - type: dropdown
    id: gate
    attributes:
      label: 어느 관문까지
      description: 이 일이 끝나야 하는 발표 관문입니다. 모르면 비워 두세요.
      options:
        - "A-정책 · 9월 12일"
        - "MVP · 중간발표 · 9월 30일"
        - "NAV · 실기 항법 · 11월 7일"
        - "FINAL · 최종발표 · 12월 11일"
  - type: textarea
    id: memo
    attributes:
      label: 메모 (선택)
      description: 막힐 것 같은 지점, 참고 링크, 예상 소요. 비워도 됩니다.
