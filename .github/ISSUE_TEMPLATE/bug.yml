name: 막힘·오류
description: 안 되는 것. 에러가 나거나 예상과 다르게 도는 것.
title: "[막힘] "
labels: [blocked]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 안 되나
      description: 기대한 것과 실제 일어난 것을 나눠 적는다.
      placeholder: |
        기대: 학습이 시작되고 곡선이 뜬다
        실제: 12초 뒤 프로세스가 종료된다
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 남이 그대로 따라 할 수 있게. 명령어는 그대로 붙여넣는다.
      placeholder: |
        1. conda activate isaac311
        2. python train_go2_win.py --task ... --headless
        3. 12초 뒤 종료
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      placeholder: |
        GPU: RTX 5080 / 드라이버 576.83
        Isaac Lab: v2.3.2
        브랜치: feature/12-obs-tuning
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 에러 로그
      description: 마지막 30줄이면 충분하다.
      render: shell
  - type: textarea
    id: tried
    attributes:
      label: 이미 해본 것
      description: 같은 걸 두 번 시도하지 않기 위해.
  - type: dropdown
    id: quest
    attributes:
      label: 어느 퀘스트의 일인가
      description: "설계도 §3 퀘스트 보드. 완료 조건은 거기에 있다: https://foothold-project.vercel.app/plan.html"
      options:
        - "Q0 개발환경 구축 (② 기준)"
        - "Q1 거북이 조종하기 · ROS 입문 (② 기준)"
        - "Q2 남의 정책 재생 (② 기준)"
        - "Q3 첫 기록 재기 (② 기준)"
        - "Q4 지형 조각 1개 (③ 환경)"
        - "Q5 계곡형 지형 조합 (③ 환경)"
        - "Q6 문제를 숫자로 (③ 환경)"
        - "Q7 학습 1회 완주 (④ 학습)"
        - "Q8 기록 갱신 (⑤ 평가)"
        - "Q9 다른 세계에서도 · sim2sim (⑥ 전이)"
        - "Q10 계약서 검증 · 정합성 6종 (⑥ 전이)"
        - "Q11 로봇과 첫 대화 · ROS2 (⑥ 전이)"
        - "Q12 실기 첫 걸음 · 안전 사다리 (⑥ 전이)"
        - "보스전 실기 험지 10m + 갭 리포트 (⑦ 적응)"
        - "현장·장비 조사 (① 관측)"
        - "운영 문서 · 회의 · 인프라"
