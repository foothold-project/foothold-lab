name: 막힘·오류
description: 안 되는 것. 에러가 나거나 예상과 다르게 도는 것.
title: "[막힘] "
labels: [blocked]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 안 되나
      description: 기대한 것과 실제 일어난 것을 나눠 적는다.
      placeholder: |
        기대: 학습이 시작되고 곡선이 뜬다
        실제: 12초 뒤 프로세스가 종료된다
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 남이 그대로 따라 할 수 있게. 명령어는 그대로 붙여넣는다.
      placeholder: |
        1. conda activate isaac311
        2. python train_go2_win.py --task ... --headless
        3. 12초 뒤 종료
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      placeholder: |
        GPU: RTX 5080 / 드라이버 576.83
        Isaac Lab: v2.3.2
        브랜치: feature/12-obs-tuning
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 에러 로그
      description: 마지막 30줄이면 충분하다.
      render: shell
  - type: textarea
    id: tried
    attributes:
      label: 이미 해본 것
      description: 같은 걸 두 번 시도하지 않기 위해.
  - type: dropdown
    id: quest
    attributes:
      label: 어느 갈래의 일인가
      description: "다섯 갈래가 WBS 1레벨이다. 세부 순서(퀘스트 Q0~Q12)는 설계도 §3: https://foothold-project.vercel.app/plan.html"
      options:
        - "평가 체계: 통과율 정의·자동 평가·기준선 (Q3·Q6·Q8)"
        - "험지 환경: 지형 제작·계곡형·3DGS (Q4·Q5)"
        - "정책 학습: 학습 실행·보상·실험 (Q7·Q8)"
        - "실기 전이: 정합성·sim2sim·ROS2·안전 사다리 (Q9~Q12·보스전)"
        - "운영: 문서·회의·인프라·발표·현장조사"
