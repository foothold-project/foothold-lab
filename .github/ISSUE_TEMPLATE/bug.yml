name: 막힘·오류
description: 안 되는 것. 에러가 나거나 예상과 다르게 도는 것.
title: "[막힘] "
labels: [blocked]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 안 되나
      description: 기대한 것과 실제 일어난 것을 나눠 적는다.
      placeholder: |
        기대: 학습이 시작되고 곡선이 뜬다
        실제: 12초 뒤 프로세스가 종료된다
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 남이 그대로 따라 할 수 있게. 명령어는 그대로 붙여넣는다.
      placeholder: |
        1. conda activate isaac311
        2. python train_go2_win.py --task ... --headless
        3. 12초 뒤 종료
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      placeholder: |
        GPU: RTX 5080 / 드라이버 576.83
        Isaac Lab: v2.3.2
        브랜치: feature/12-obs-tuning
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 에러 로그
      description: 마지막 30줄이면 충분하다.
      render: shell
  - type: textarea
    id: tried
    attributes:
      label: 이미 해본 것
      description: 같은 걸 두 번 시도하지 않기 위해.
