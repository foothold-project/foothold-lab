  canon_section: "E.2 E1 레벨 (v0.17j · decisions.tsv 2026-11-12 12:52, 13:03)"
  canon_quote: "앞 세 구간(1~750 회)은 상한 5 그대로 명령만 넓히고, 뒤 네 구간(751~1,750 회)이 상한 6 → 7 → 8 → 9 다"
