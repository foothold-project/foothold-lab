  boundary_axes:
  - terrain_kind_level_cap
  - terrain_exposure
  - terrain_level_cap
  - command_allocation
  # Fixed before any result of this stage is seen (lead 2026-11-12 01:40). One axis per boundary (CG one-axis rule).
  # CG order as written: D, K, L+, C (E.1 E3 row and E.2 E3 one-axis row). The entry axis is the first one.
  # L+ is the continuous cap +1 per boundary up to L9: decisions.tsv 2026-11-06 22:3x, 23:2x, 2026-11-08 19:0x.
  # An axis whose CG condition is not met is skipped; with none eligible the boundary changes no axis (CG E.1 E1 row).
  boundary:
    entry_axis: terrain_kind_level_cap
    axis_order: [terrain_kind_level_cap, terrain_exposure, terrain_level_cap, command_allocation]
    rule: rotate_in_order_one_axis_per_boundary
    not_eligible: skip
    none_eligible: no_axis_change
    source:
      canon: CURRICULUM-GATES v0.17c E.1 E3 row, E.2 E3 one-axis row
      decisions: ['2026-11-06 22:3x', '2026-11-06 23:2x', '2026-11-08 19:0x']
