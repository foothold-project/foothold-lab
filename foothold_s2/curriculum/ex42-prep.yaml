- id: E1
  exit_judge: map39_e1_v2_two_window
  # E1 redesign v3, decisions.tsv 2026-11-14 00:09 (48fd2c94). These
  # records are training observations, not graduation thresholds. A changed
  # plan needs a new SHA and separately pinned launch approval.
  live_monitor:
    enabled: true
    moving_updates: 20
    # Fix the training-env signal threshold after the Kit five-update noise probe.
    decline_from_peak: null
    map_off_survival_updates: 50
    map_off_survival_drop_alert: null
    initial_slow_track_weight: 0.2
    alert_run_env: EX42_ALERT_RUN_ID
    initial: {slow_forward: learning, side_left: learning, side_right: learning}
  live_adjustment:
    file_env: EX42_UPDATE_ADJUST
    segment_reward_limits_sha256: 15dfcdcdf464fab34db1829d82ac95048d45b686f16cb54244655458314ee04e
    # Repeated cells must equal the segment fence; this plan SHA pins that agreement.
    extra_reward_limits:
      zero_yaw: [-2.0, -0.5]
      feet_air_time_threshold: [0.04, 0.5]
      slow_track: [0.0, 0.3]
      slow_track_sigma: [0.5, 0.5]
      slow_track_speed_min: [0.1, 0.1]
      slow_track_speed_max: [0.3, 0.3]
    command_limits:
      low_forward_fraction: [0.2, 0.5]
    # Run-time cells, registered off at the start (decisions.tsv 2026-11-14 12:42, lead; planner review block 1): a run
    # that has started cannot change this plan or the limits file, so the knobs the lead may need are here now. The two
    # copies (here and `runtime_cells` of the limits file) must agree. policy_std_cap 0 = off.
    runtime_limits:
      policy_std_cap: [0.0, 2.0]
      terrain_level_cap: [5, 9]
    runtime_start:
      policy_std_cap: 0.0
  authorization_contract:
    validator: legacy_e1
    source_stage_ids:
    - E0
    entry_gate_adapter: map39
    required_sha256_paths: []
    required_string_paths: []
    required_values: {}
    required_boolean_paths: []
    required_stage_values: {}
  name: continuous_terrain_and_commands
  # Parent = the finished E0 run's model_250.pt (cumulative 13250). Pin recorded from that run's manifest
  # (completed_updates 250); the lead confirms it when the E0 re-judgement passes.
  parent:
    cumulative_update: 13250
    manifest_local_update: 250
    checkpoint_key: model_250.pt
    sha256: 680c820b73646d9c11f62f184fd35e6cc096ffd04681951d542b2b4b472d779e
  # CG E.2 E1 (v0.17k, decisions.tsv 2026-11-12 12:52 and 13:03): one run of seven 250-update segments. Segments
  # 1-3 keep cap 5 and train the widened commands; segments 4-7 raise the cap 6, 7, 8, 9. No exit before 1750.
  minimum_updates: 1750
  maximum_updates: 1750
  extension_updates: 500
  extension_max_count: 2
  critic_mirror: true
  boundary_axes:
  - terrain_level_cap
  # Command profile of the whole stage (opened once at the stage start, not widened per segment).
  # Shares: stage zero with forward 0.23 -> 0.19 and each side 0.07 -> 0.09 (decisions.tsv 2026-11-12 13:03).
  # Ranges and turn overlay: decisions.tsv 2026-11-12 12:52. Stage zero had side 0.2~0.6, walk vx 0.3~0.8,
  # walk wz 0.2~1.0, spin 0.3~1.5 and no turn overlay.
  commands:
    shares:
      forward: 0.19
      walk_left: 0.06
      walk_right: 0.06
      spin_left: 0.09
      spin_right: 0.09
      stand: 0.1
      reverse: 0.14
      side_left: 0.09
      side_right: 0.09
      diag_fwd_left: 0.02
      diag_fwd_right: 0.02
      diag_back_left: 0.025
      diag_back_right: 0.025
    ranges:
      forward_vx: [0.1, 1.5]
      walk_vx: [0.3, 1.2]
      walk_wz_abs: [0.1, 1.0]
      spin_wz_abs: [0.15, 1.5]
      reverse_vx: [-1.3, -0.2]
      side_vy_abs: [0.1, 0.8]
      diag_vx_abs: [0.3, 0.6]
      diag_vy_abs: [0.2, 0.5]
    turn_overlay:              # reverse, side and diagonal commands: this share also turns
      fraction: 0.25
      wz_abs: [0.2, 0.6]
  # Reward cells of the whole stage, from its first update (E1 again from m13250; decisions.tsv 2026-11-13 14:29,
  # ledger commit e8822852: the starting pair zero_yaw -1.0 + track_lin_vel_std 0.35). zero_yaw: the weight on the
  # yaw rate while the turn command is zero, -0.5 -> -1.0. track_lin_vel_std: 0.5 -> 0.35, so that standing still
  # under a slow forward command costs more than the zero_yaw penalty of walking (remedial segment A, m2250: forward
  # 0.1 progress ratio 0.084 -> 0.004 at width 0.5). Both inside the limits of decisions.tsv 2026-11-12 20:37 and
  # 2026-11-13 09:52. The other three are the values the finished E1 ran with.
  # Registered for later boundaries and unchanged at the start (decisions.tsv 2026-11-13 15:30): the feet_air_time
  # threshold 0.5 s (its weight is 0) and ex42_slow_track at weight 0 with the constants of its draft formula.
  rewards: {track_lin_vel_std: 0.35, track_ang_vel_std: 0.5, feet_air_time: 0.0, foot_slip: -0.15, zero_yaw: -1.0,
            feet_air_time_threshold: 0.5, slow_track: 0.2, slow_track_sigma: 0.5, slow_track_speed_min: 0.1,
            slow_track_speed_max: 0.3, slow_progress: 0.2}
  # slow_progress 0.2 from the first update of the E1 restart v28 from m13250 (decisions.tsv 2026-11-14 12:11, ledger
  # commit b6024dd2; inside the limits [0, 0.3] of ledger 4f7e431e). It was 0 in v27.3.
  # feet_air_time stays 0 with threshold 0.5 (decisions.tsv 2026-11-14 01:21, ledger commit 06d4a1ae: the 0.1 / 0.04 s
  # of 01:08 was withdrawn, too small to break the standing equilibrium). slow_progress is the one-sided progress term
  # registered at weight 0 for the same reason; its limits are closed until the team lead approves them.
  # slow_track 0.2 from the first update of the E1 restart from m13250 (decisions.tsv 2026-11-14 00:21, ledger commit
  # 64de0cad; inside the limits [0, 0.3]). Left at 0 the slow forward progress fell 0.447 -> 0.312 in one boundary.
  # The share of the forward commands drawn below 0.3 m/s, from the first update of the stage (the source stage has
  # 0.20; decisions.tsv 2026-11-13 15:17, ledger commit a00ab2a8: 0.2 -> 0.4). With the forward share 0.19 the
  # commands between 0.1 and 0.3 m/s go from 3.8 % to 7.6 % of all commands. Limits: ex42-reward-adjust-limits.yaml.
  # decisions.tsv 2026-11-14 00:28 (team lead, direct; ledger commit bc66f6ee): 0.4 -> 0.5 for the E1 restart from
  # m13250 (9.5 % of all commands), and the slow forward commands of heading envs count for ex42_slow_track too.
  low_forward_fraction: 0.5
  # true: a heading env inside the slow band is a slow_track target although its turn command comes from the heading
  # controller (it was left out before, which removed 30 % of the slow forward commands). Flag envs stay left out.
  slow_track_heading: true
  command_adjust_limits:       # decisions.tsv 2026-11-12 14:23: the lines a segment adjustment may not cross. The run
    ranges:                    # starts on `commands` above; a cell not named here is limited to its `commands` value.
      side_vy_abs: [0.1, 1.0]
      walk_vx: [0.3, 1.5]
    turn_overlay: {fraction_max: 0.4, wz_abs: [0.2, 0.8]}
    shares:
      forward: [0.13, 0.23]
      side_left: [0.07, 0.12]
      side_right: [0.07, 0.12]
  enabled: true
  hold_policy: hold_exposure_continue_training
  terrain:
    # CG E.2 E1 "레벨" row (v0.17j): continuous 7 kinds 100 %, promotion by performance. Segments 1-3 (updates
    # 1-750) keep cap 5, segments 4-7 run with cap 6, 7, 8, 9: the first raise is at the third boundary
    # (decisions.tsv 2026-11-06 22:3x, 23:2x, 2026-11-12 11:28, 12:52). The cap in force is
    # min(start + step * max(0, boundaries passed - first_raise_boundary + 1), end) for both caps: the promotion cap
    # _ex41_terrain.level_cap and the per-column level_caps (terrains/ex42_exposure.py raise_continuous_cap). The
    # plan does not change between segments. Operation: when the retention table (CG E.3.1) is on HOLD the next
    # segment is not started. exposure_at_E1 holds the start value. kind_task is E0's. Registered before any result.
    # v28 (decisions.tsv 2026-11-14 12:11 and 12:42; planner review block 1): the cap is held at the first segment's 5 by
    # the plan (end 5); the lead raises it only through the live cell runtime.terrain_level_cap (limits [5, 9], one
    # step at a time, after the probe shows the slow walk holds). The canon schedule 5 -> 9 from boundary 3 above is
    # therefore NOT what this plan does; the canon claim row E1.continuous_level_cap carries the same end 5.
    continuous_level_cap:
      start: 5
      step_per_boundary: 1
      end: 5
      first_raise_boundary: 3
    exposure_at_E1:
      default: {exposure: 0.0, level_cap: 0}
      positive:
      - {family: A, kinds_of: continuous, exposure: 1.0, level_cap: 5}
    floors:
      global_command_floor:
        reverse: 0.05
        side_left: 0.03
        side_right: 0.03
- id: E1F
  # The command ranges and the turn overlay reinforced in E1 stay in force after it (decisions.tsv 2026-11-12 12:52,
  # 13:03). Without this cell a stage falls back to the stage-zero ranges (ex42_shares.stage_commands). `ranges` and
  # `turn_overlay` are E1's plan values. `shares` here are the 13 free slots for environments outside the continuous
  # columns; inside them the split is the row's own `shares` (with flag), which this cell does not change.
  commands:
    shares: {forward: 0.1888888889, walk_left: 0.0666666667, walk_right: 0.0666666667, spin_left: 0.0777777778, spin_right: 0.0777777778, stand: 0.1111111111, reverse: 0.1111111111, side_left: 0.1, side_right: 0.1, diag_fwd_left: 0.0222222222, diag_fwd_right: 0.0222222222, diag_back_left: 0.0277777778, diag_back_right: 0.0277777778}
