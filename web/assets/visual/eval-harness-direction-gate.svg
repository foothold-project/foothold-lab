<rect x="520" y="392" width="424" height="180" rx="10" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.2"/>
<text x="540" y="422" font-size="13" font-weight="600" fill="#16202c">통과선을 못 넘긴 판은 어떻게 되나</text>
<line x1="540" y1="436" x2="924" y2="436" stroke="#e2e8f0" stroke-width="1"/>
<text x="540" y="462" font-size="11.5" fill="#b5341f">끝점 판정 · 이탈이 작게 나와 통과처럼 보인다</text>
<text x="540" y="488" font-size="11.5" fill="#17795e">통과선 판정 · gate_lateral_drift_m 이 None 이라 실패</text>
<text x="540" y="520" font-size="11" fill="#5b6b7f">None 은 0.0 이 아니다. 도달한 판과 구별하려고</text>
<text x="540" y="540" font-size="11" fill="#5b6b7f">일부러 갈랐다 · metrics.py:179~180</text>
<text x="540" y="562" font-size="10" fill="#5b6b7f">gate_direction_success · metrics.py:267~276</text>

<text x="32" y="600" font-size="10.5" fill="#5b6b7f">멘토 기준은 「목표점 도달 시 좌우 5 cm」다. 20초 × 1.0 m/s 면 끝점이 20 m 라, 끝점으로 재면 목표점의 두 배 지점을 재게 된다.</text>
