<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Malgun Gothic',sans-serif">
<rect width="1080" height="660" fill="#f6f5f1"/>
<text x="30" y="42" font-size="22" font-weight="800" fill="#161c26">실패 지형 파인튜닝: 레시피 병렬 → 혼합 단일 런</text>
<text x="30" y="66" font-size="13" fill="#4a5566">합치는 것은 체크포인트가 아니라 «레시피(설정·지식)»다. 최종 정책은 언제나 하나의 혼합 런에서 나온다.</text>
<text x="30" y="108" font-size="14" font-weight="800" fill="#0e7a6e">1~2주차 · 병렬 (팀원 5인, 지형 1개씩)</text>
<text x="1050" y="108" font-size="12" fill="#4a5566" text-anchor="end">숫자는 벤치마크 v2 실측 (지형당 50에피소드) · 성공 / 생존 / 전진</text>
<g font-size="12">
<rect x="30" y="120" width="196" height="176" rx="8" fill="#fff" stroke="#a3342a" stroke-width="1.6"/>
<text x="44" y="145" font-size="13" font-weight="800" fill="#161c26">gap</text>
<text x="212" y="145" font-size="12.5" font-weight="800" fill="#a3342a" text-anchor="end">임석헌</text>
<text x="44" y="168" fill="#a3342a">낙상형 · 3.2초에 접촉</text>
<text x="44" y="188" fill="#4a5566">0% / 42% / 0.86 m</text>
<text x="44" y="212" fill="#161c26">틈 폭 0.15~0.40 m</text>
<text x="44" y="236" fill="#4a5566">① 단독 50ep 재현</text>
<text x="44" y="256" fill="#4a5566">② 실패 영상 분류</text>
<text x="44" y="276" fill="#4a5566">③ 관측·발 배치 처방</text>

<rect x="240" y="120" width="196" height="176" rx="8" fill="#fff" stroke="#a3342a" stroke-width="1.6"/>
<text x="254" y="145" font-size="13" font-weight="800" fill="#161c26">rails</text>
<text x="422" y="145" font-size="12.5" font-weight="800" fill="#a3342a" text-anchor="end">맹라현</text>
<text x="254" y="168" fill="#a3342a">낙상형 · 2.1초에 접촉</text>
<text x="254" y="188" fill="#4a5566">2% / 36% / 0.93 m</text>
<text x="254" y="212" fill="#161c26">레일 두께·높이 2축</text>
<text x="254" y="236" fill="#4a5566">가장 빨리 넘어진다</text>
<text x="254" y="256" fill="#4a5566">1/50 성공 = 학습 신호</text>
<text x="254" y="276" fill="#4a5566">③ 관측·발 배치 처방</text>

<rect x="450" y="120" width="196" height="176" rx="8" fill="#fff" stroke="#a86a08" stroke-width="2"/>
<text x="464" y="145" font-size="13" font-weight="800" fill="#161c26">stepping_stones</text>
<text x="632" y="145" font-size="12.5" font-weight="800" fill="#a86a08" text-anchor="end">오현민</text>
<text x="464" y="168" fill="#a86a08">혼합 · v2에서 재분류</text>
<text x="464" y="188" fill="#4a5566">0% / 42% / 0.97 m</text>
<text x="464" y="212" fill="#161c26">디딤돌 크기·간격</text>
<text x="464" y="236" fill="#4a5566">낙상 58%가 새로 나옴</text>
<text x="464" y="256" fill="#a86a08">두 처방을 다 시험한다</text>
<text x="464" y="276" fill="#4a5566">= 비교 실험대</text>

<rect x="660" y="120" width="196" height="176" rx="8" fill="#fff" stroke="#0e7a6e" stroke-width="1.6"/>
<text x="674" y="145" font-size="13" font-weight="800" fill="#161c26">pit</text>
<text x="842" y="145" font-size="12.5" font-weight="800" fill="#0e7a6e" text-anchor="end">이민우</text>
<text x="674" y="168" fill="#0e7a6e">순수 전진불능</text>
<text x="674" y="188" fill="#4a5566">2% / 100% / 1.07 m</text>
<text x="674" y="212" fill="#161c26">구덩이 깊이 0.10~0.30</text>
<text x="674" y="236" fill="#4a5566">한 번도 안 넘어진다</text>
<text x="674" y="256" fill="#4a5566">③ 보상·명령 처방</text>
<text x="674" y="276" fill="#4a5566">(전진 보상 쪽)</text>

<rect x="870" y="120" width="180" height="176" rx="8" fill="#fff" stroke="#0e7a6e" stroke-width="1.6"/>
<text x="884" y="145" font-size="13" font-weight="800" fill="#161c26">floating_ring</text>
<text x="1036" y="163" font-size="12.5" font-weight="800" fill="#0e7a6e" text-anchor="end">오흥재</text>
<text x="884" y="186" fill="#0e7a6e">대체로 전진불능</text>
<text x="884" y="206" fill="#4a5566">0% / 86% / 0.94 m</text>
<text x="884" y="230" fill="#161c26">고리 폭·높이</text>
<text x="884" y="254" fill="#4a5566">14%는 넘어진다</text>
<text x="884" y="276" fill="#4a5566">③ 보상 처방</text>
</g>
<g stroke="#0e7a6e" stroke-width="2" fill="none">
<path d="M128 296 V326 H540"/><path d="M338 296 V326"/><path d="M548 296 V326"/><path d="M758 296 V326"/><path d="M960 296 V326 H540"/>
<path d="M540 326 V356"/>
</g>
<path d="M540 356 l-7 -12 h14 z" fill="#0e7a6e"/>
<rect x="240" y="362" width="600" height="90" rx="8" fill="#e0f0ed" stroke="#0e7a6e" stroke-width="2"/>
<text x="260" y="388" font-size="14" font-weight="800" fill="#0e7a6e">산출물 = 지형별 «레시피 1장» × 5</text>
<text x="260" y="410" font-size="12.5" fill="#161c26">작동한 지형 비율(proportion) · 난이도 시작점 · 보상 변경 · 학습률 · rough 회귀 폭</text>
<text x="260" y="430" font-size="12.5" fill="#161c26">체크포인트 5개를 합치는 게 아니다 (RL 가중치 병합은 성립하지 않음)</text>
<path d="M540 452 V482" stroke="#0e7a6e" stroke-width="2"/><path d="M540 482 l-7 -12 h14 z" fill="#0e7a6e"/>
<text x="30" y="478" font-size="14" font-weight="800" fill="#0e7a6e">3주차 · 통합 (단일 런)</text>
<rect x="180" y="488" width="720" height="66" rx="8" fill="#fff" stroke="#161c26" stroke-width="2"/>
<text x="200" y="514" font-size="13.5" font-weight="800" fill="#161c26">rough 0.5 + gap·rails·stones·pit·floating_ring 각 0.1 혼합 커리큘럼 → 정책 1개 학습</text>
<text x="200" y="536" font-size="12.5" fill="#4a5566">Isaac Lab terrain_generator sub_terrains에 5종 추가 (다섯 모두 내장 cfg) · resume vs scratch 1런씩 비교</text>
<path d="M540 554 V578" stroke="#0e7a6e" stroke-width="2"/><path d="M540 578 l-7 -12 h14 z" fill="#0e7a6e"/>
<rect x="180" y="584" width="720" height="60" rx="8" fill="#fbf0dc" stroke="#a86a08" stroke-width="1.6"/>
<text x="200" y="608" font-size="13" font-weight="800" fill="#a86a08">4주차 · 전 지형 재벤치(기존+신규 10종) + ablation 표(단독 vs 혼합의 rough 붕괴)</text>
<text x="200" y="630" font-size="12.5" fill="#a86a08">판정선: 실패 5종 중 3종 이상 개선 &amp; 통과 5종이 95% 아래로 안 내려갈 것</text>
</svg>
