<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 3 952 620" width="980" height="620" font-family="system-ui,-apple-system,Segoe UI,Malgun Gothic,Apple SD Gothic Neo,sans-serif" role="img" aria-label="방향 판정을 끝점에서 통과선으로 옮긴 구조">
<title>방향 판정 · 끝점에서 통과선으로</title>

<rect x="0" y="0" width="980" height="620" fill="#131a24"/>

