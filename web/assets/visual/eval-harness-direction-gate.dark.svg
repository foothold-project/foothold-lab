<text x="330" y="516" font-size="12" font-weight="600" fill="#bfcad7" text-anchor="end">2.143 m</text>
<text x="464" y="516" font-size="12" font-weight="600" fill="#d26d5d" text-anchor="end">0 / 100</text>
<text x="84" y="550" font-size="10" fill="#808c9a">평지 정본 20260903-flat-10m-spec20s · 원장 09-02 아래 표</text>

<rect x="520" y="392" width="424" height="180" rx="10" fill="#171717" stroke="#2f3844" stroke-width="1.6"/>
<text x="540" y="422" font-size="13" font-weight="600" fill="#bfcad7">통과선을 못 넘긴 에피소드는 어떻게 되나</text>
<line x1="540" y1="436" x2="924" y2="436" stroke="#202732" stroke-width="1"/>
<text x="540" y="462" font-size="11.5" fill="#d26d5d">끝점 판정 · 이탈이 작게 나와 통과처럼 보인다</text>
<text x="540" y="488" font-size="11.5" fill="#3dc6a0">통과선 판정 · gate_lateral_drift_m 이 None 이라 실패</text>
<text x="540" y="520" font-size="11" fill="#808c9a">None 은 0.0 이 아니다. 도달한 에피소드와 구별하려고</text>
<text x="540" y="540" font-size="11" fill="#808c9a">일부러 갈랐다 · metrics.py:179~180</text>
<text x="540" y="562" font-size="10" fill="#808c9a">gate_direction_success · metrics.py:267~276</text>

<text x="32" y="600" font-size="10.5" fill="#808c9a">멘토 기준은 「목표점 도달 시 좌우 5 cm」다. 20초 × 1.0 m/s 면 끝점이 20 m 라, 끝점으로 재면 목표점의 두 배 지점을 재게 된다.</text>
