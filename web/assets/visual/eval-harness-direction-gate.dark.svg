<text x="704" y="340" font-size="10" fill="#808c9a" text-anchor="middle">15 m</text>

<rect x="64" y="392" width="424" height="180" rx="10" fill="#171717" stroke="#2f3844" stroke-width="1.6"/>
<text x="84" y="422" font-size="13" font-weight="600" fill="#bfcad7">같은 100에피소드를 두 기준으로 재면</text>
<line x1="84" y1="436" x2="468" y2="436" stroke="#202732" stroke-width="1"/>
<text x="84" y="458" font-size="10.5" fill="#808c9a">무엇으로 재나</text>
<text x="330" y="458" font-size="10.5" fill="#808c9a" text-anchor="end">평균 좌우 이탈</text>
<text x="464" y="458" font-size="10.5" fill="#808c9a" text-anchor="end">직진성</text>
<text x="84" y="488" font-size="12" font-weight="600" fill="#5590d0">통과선 10 m</text>
