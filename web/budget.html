<!doctype html>
<html lang="ko">

<title>예산안 · FOOTHOLD</title>
<style>
body{font-family:'Pretendard','Malgun Gothic','Segoe UI',system-ui,sans-serif;
  background:var(--paper,#f4f2ec);color:var(--ink,#16202a);margin:0;font-size:15px}
.top{position:sticky;top:0;z-index:60;background:var(--paper,#f4f2ec);
  border-bottom:1px solid var(--rule,#d8d4c8)}
.top .row{max-width:1040px;margin:0 auto;padding:.6rem 1.2rem;display:flex;
  align-items:center;gap:.9rem}
.top a{color:inherit;text-decoration:none;font-weight:700;font-size:.85rem}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.25;
  margin:.3em 0 .35em}
.note{font-size:15px;color:var(--ink-2,#3d4a58);line-height:1.75}
.gatebox{display:flex;align-items:center;justify-content:center;
  min-height:max(300px, calc(100vh - 21rem));padding:1.5rem 0}
.gate{border:1px solid var(--rule,#d8d4c8);
  background:var(--card,#fbfaf6);padding:26px 24px;border-radius:8px;
  width:100%;max-width:440px}
.gate>b{font-size:.9rem;letter-spacing:-.01em}
.gate input{width:100%;box-sizing:border-box;padding:.6rem .8rem;font-size:16px;border:1px solid var(--rule,#d8d4c8);
  border-radius:5px;margin:.4rem 0;background:var(--paper,#fff);color:inherit}
.gate button{padding:.55rem 1.2rem;font-weight:800;border:none;border-radius:5px;
  background:var(--dim,#0e7a6e);color:#fff;cursor:pointer;font-size:.9rem}
.gate .err{color:#b3452c;font-size:.8rem;min-height:1.2em}
.item{border:1px solid var(--rule,#d8d4c8);border-radius:8px;background:var(--card,#fbfaf6);
  padding:16px 18px;margin:14px 0}
.item .no{display:inline-block;background:var(--ink,#16202a);color:var(--paper,#fff);font-size:.68rem;font-weight:800;padding:.15rem .45rem;border-radius:3px;margin-right:.55rem;letter-spacing:.06em;vertical-align:.08em}
.item b{font-size:.98rem}
.item .m{font-size:.75rem;color:var(--ink-3,#6b7683);margin:.2rem 0 .6rem}
.item button{margin-right:.5rem;padding:.4rem .9rem;font-weight:700;border:1px solid var(--dim,#0e7a6e);
  border-radius:5px;background:transparent;color:var(--dim,#0e7a6e);cursor:pointer}
.pdfbox{margin-top:10px;max-height:82vh;overflow-y:auto;border-radius:6px}
#list{display:none}

:root{
  --paper:#f6f5f1;--paper-2:#eeece6;--card:#fff;
  --ink:#161c26;--ink-2:#4a5566;--ink-3:#7c8798;
  --rule:#d9d6cd;--dim:#0e7a6e;--dim-soft:#e0f0ed;
  --note:#a86a08;--note-soft:#fbf0dc;
  --stop:#a3342a;--stop-soft:#fbe9e7;
  --grid:rgba(22,28,38,.04);
  --measure:760px;
  /* ★ --dim / --note 를 연한 배경(--*-soft) 위 글자로 쓰면 대비가 모자란다.
     실측 --dim on --dim-soft = 4.43 · --note on --note-soft = 3.93 (둘 다 4.5 미달).
     그런 자리에는 아래 진한 짝을 쓴다. DESIGN.md §2 참조. */
  --dim-ink:#0b6459;
  --note-ink:#8a5600;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12161d;--paper-2:#191e27;--card:#181d26;
    --ink:#e9e7e1;--ink-2:#adb5c1;--ink-3:#7d8693;
    --rule:#2b323d;--dim:#3ec7b4;--dim-soft:#11302c;
    --note:#dc9a30;--note-soft:#332710;
    --stop:#e56d5e;--stop-soft:#331c19;
    --grid:rgba(233,231,225,.035);
    /* 어두운 모드에서는 soft 배경이 어두우므로 원래 토큰이 이미 충분히 밝다 */
    --dim-ink:#3ec7b4;
    --note-ink:#dc9a30;
  }
}
html[data-theme="light"]{--paper:#f6f5f1;--paper-2:#eeece6;--card:#fff;--ink:#161c26;--ink-2:#4a5566;--ink-3:#7c8798;--rule:#d9d6cd;--brand:#0e7a6e;--dim:#0e7a6e;--dim-soft:#e0f0ed;--note:#a86a08;--note-soft:#fbf0dc;--stop:#a3342a;--stop-soft:#fbe9e7;--dim-ink:#0b6459;--grid:rgba(22,28,38,.04);--note-ink:#8a5600;}
html[data-theme="dark"]{--paper:#12161d;--paper-2:#191e27;--card:#181d26;--ink:#e9e7e1;--ink-2:#adb5c1;--ink-3:#7d8693;--rule:#2b323d;--brand:#3ec7b4;--dim:#3ec7b4;--dim-soft:#11302c;--note:#dc9a30;--note-soft:#332710;--stop:#e56d5e;--stop-soft:#331c19}
:root{--bg:var(--paper);--panel:var(--card);--sub:var(--ink-3);--line:var(--rule);--brand:var(--dim);--brand-ink:var(--dim-ink,#0b3d2e);--brand-soft:var(--dim-soft);--brand-line:var(--dim);--accent:var(--note);--accent-soft:var(--note-soft);--code:var(--paper-2);--shadow:none}body{font-family:'Pretendard','Malgun Gothic','Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
</style>
<link rel="icon" type="image/svg+xml" href="assets/brand/foothold-favicon.svg?v=08e237b2">
<style id="ia-css">
/* ★ 허브 이동 때 «흔들림» 실측 원인 셋 (2026-08-31 팀장 지적)
   ① 문서가 짧은 페이지엔 스크롤바가 없어 좌우가 15px 튄다 -> 항상 자리를 잡는다
   ② 허브 본문 폭이 824, 표지가 1000 -> PRD §4-1 대로 1040 한 벌
   ③ navctl 안에 <script> 가 인라인 요소로 들어가 바 높이가 2px 달랐다 */
html{scrollbar-gutter:stable}
/* ★ 실측 (팀장 8/31 · 백과): 페이지가 가진 «고정» 요소(사이드바 · 떠 있는 버튼)가
   top:0 이라 sticky 전역바 «뒤» 로 깔려 안 보였다. 바 높이(2.94rem)만큼 내린다.
   바 자신과 그 안의 것은 제외한다. */
/* ★ 9/1 실측: 2.94rem = 47.04px 인데 바의 실제 높이는 48px 이었다.
   1px 틈이 생겨 아래 요소가 바 밑으로 비쳤다. 실측값을 쓴다. */
body :not(.gnav):not(.gnav *){--navh:48px}
nav:not(.gnav),aside{top:var(--navh)!important;height:calc(100vh - var(--navh))!important}
/* ★ 9/1 실측 (커리큘럼): 「1 / 44 · 표지로 · PDF」 줄이 top:0 sticky 라
   전역바와 48px «전부» 겹쳐 스크롤 중 아예 안 보였다. nav·aside 만 내리던
   규칙이 <div> 로 만든 상단 줄을 통째로 비켜간 것이다 (철칙 4: 관문이 한
   층위만 봤다). 이름이 아니라 «역할» 로 잡는다. */
body .topbar:not(.gnav),body .subnav,body .deckbar,body .pagebar{
  top:var(--navh)!important}
body .topbar .row{max-width:1040px!important;box-sizing:border-box}
body>button[class]:not(.gnav *),body>a[class]:not(.gnav *){top:calc(var(--navh) + 7px)!important}
/* PRD §4-1: 바깥 컨테이너 1040 한 벌. 셸(research.html)이 --measure 기반 824 를
   물려주고 표지는 1000 이라 페이지마다 본문 좌표가 달랐다 (실측 179 vs 91). */
/* box-sizing 이 content-box 인 페이지는 패딩이 폭 밖에 붙어 1080 이 됐다
   (예산·자료실 실측). 컨테이너는 border-box 로 못박는다. */
body .wrap,main.wrap,div.wrap{max-width:1040px!important;box-sizing:border-box}
/* .wrap 을 안 쓰고 main 을 컨테이너로 쓰는 페이지(커리큘럼 784 · 백과 931)도
   같은 폭으로. 실측으로 잡았다. */
/* ⑤ 커리큘럼만 784. #deck 제외 규칙이 커리큘럼을 통째로 비켜갔다.
   덱 슬라이드 «안» 은 그대로 두고 컨테이너 폭만 맞춘다. */
main#deck{max-width:1040px!important;margin-left:auto;margin-right:auto}
body main:not(.wrap):not(#deck){max-width:1040px!important;
  margin-left:auto;margin-right:auto}
@media print{.wrap{max-width:none!important}}
.gnav .navctl script{display:none}
/* ★ 9/1: 검색 버튼은 런타임에 JS 가 만든다. 그때 «그 페이지의 PDF 버튼
   클래스» 를 복사해 페이지마다 크기가 달랐다 (팀장: 돋보기 크기가 변한다).
   복사는 searchbox 에서 없앴고, 여기서 바의 규격으로 못박는다. */
.gnav .fh-sbtn{font-size:.8rem!important;font-weight:600!important;letter-spacing:-.01em!important;line-height:1.5!important;padding:.34rem .55rem!important;height:1.85rem!important;gap:.28rem!important;border:0!important;background:transparent!important;position:static!important;box-sizing:border-box!important}
.gnav .fh-sbtn svg{width:11px!important;height:11px!important;flex:none}
.gnav{position:sticky;top:0;z-index:220;background:var(--paper);
  border-bottom:1px solid var(--rule);font-size:.82rem}
/* ★ 바 높이가 44 / 48 / 50 세 가지였다 (실측). 바가 «페이지의 line-height» 를
   물려받아 링크 높이가 27 / 31 / 33 으로 달라졌다. 바는 자기 값으로 선다. */
/* 바도 border-box 로. content-box 인 페이지에서 1078px 이 되어 좌표가
   51 로 밀렸다 (예산·자료실 실측). */
.gnav *{box-sizing:border-box}
.side,aside,.toc,.sidebar,.sticky,.stick{z-index:60}
.gnav{z-index:220}
.gnav .in{max-width:1040px;margin:0 auto;padding:.5rem 1.2rem;display:flex;
  align-items:center;gap:.1rem;flex-wrap:wrap;line-height:1.5;min-height:2.6rem;
  box-sizing:border-box;height:2.94rem}
/* 높이를 값으로 못박는다. 페이지마다 제어 버튼 수가 달라 45~47px 로 흔들렸다. */
.gnav a,.gnav .q,.gnav .navctl>*{line-height:1.5}
/* ★ 팀장 3차 지적 (8/31). 실측으로 남아 있던 어긋남:
     굵기 650 / 600 두 종 · 색 두 종 · 높이 25 / 26 / 29px 세 종 ·
     세로 위치 9 / 10 / 11px 세 종 («다크» 버튼만 3px 낮고 1px 위로 밀림).
   상단바 «모든» 항목이 같은 상자로 선다. 하나라도 예외를 두면 또 어긋난다. */
/* ★ 9/1 실측: 버튼 폭이 페이지마다 2px 달랐다. 원인은 «선언된 폰트 스택» 이
   달라서다 (기획 Arial · 백과·커리큘럼 Pretendard). 같은 글자여도 폭이 다르다.
   바는 자기 폰트를 갖는다. 그래야 페이지를 옮겨도 안 흔들린다. */
.gnav a,.gnav button,.gnav .navctl>*{
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif!important;letter-spacing:-.01em!important;  font-size:.8rem!important;font-weight:600!important;
  line-height:1.5!important;color:var(--ink-3)!important;
  padding:.34rem .55rem!important;border-radius:4px!important;
  border:0!important;background:transparent!important;
  display:inline-flex!important;align-items:center!important;
  height:1.85rem!important;box-sizing:border-box!important;
  white-space:nowrap;text-decoration:none;cursor:pointer}
.gnav a:hover,.gnav button:hover,.gnav .navctl>*:hover{
  color:var(--ink)!important;background:var(--paper-2)!important}
.gnav a.home{margin-right:.6rem;padding:.34rem .3rem!important}
.gnav .lgi,.gnav .lgr{display:block}
.gnav .lgr{display:none}
@media (prefers-color-scheme:dark){.gnav .lgi{display:none}.gnav .lgr{display:block}}
html[data-theme="dark"] .gnav .lgi{display:none}
html[data-theme="dark"] .gnav .lgr{display:block}
html[data-theme="light"] .gnav .lgi{display:block}
html[data-theme="light"] .gnav .lgr{display:none}
/* ★ 현재 위치 (팀장 8/31: 밑줄이 별로다). 글자를 진하게 + 옅은 면.
   밑줄·알약 대신 «지금 여기» 를 조용히 말한다. */
.gnav a.on{color:var(--ink)!important;font-weight:800!important;
  background:var(--paper-2)!important}
.gnav a.on:hover{background:var(--paper-2)!important}
.gnav .sp{flex:1}

/* ★ 2026-08-28. 검색·다크 버튼이 position:fixed 로 «떠다니며» 상단바를 덮었다.
   모바일 실측: 검색 버튼이 「파이프라인」 글자를 가렸고(둘 다 z-index:70 이라
   나중에 그려지는 쪽이 이긴다), 다크 버튼은 iOS 에서 주소창이 접히자
   화면 중간으로 튀어 카드 글씨를 덮었다(fixed 의 고질적 재계산).
   떠다니게 두는 대신 **상단바 안의 정상 요소**로 앉힌다.
   상단바는 이미 sticky 라 따라오고, 흐름 안이라 아무것도 안 가린다. */
.gnav .navctl{display:inline-flex;align-items:center;gap:.3rem;margin-left:auto}
/* ★ 통일성 실측 (팀장 8/31): 바 안에 폰트 3종(13.1 / 12.2 / 9.9px) ·
   반경 2종(4px / 99px) · 굵기 3종이 섞여 있었다. 두 등급으로 줄인다.
   허브(주) .82rem 700 · 바로가기와 제어(부) .76rem 600 · 반경은 전부 4px. */
.gnav .navctl>*{position:static!important;inset:auto!important;top:auto!important;
  right:auto!important;bottom:auto!important;left:auto!important;z-index:auto!important;
  margin:0!important}
/* ★ 모바일 실측 (2026-08-31 · 390px): 상단바가 13개 항목을 wrap 해 3줄이 되고
   화면 상단 1/8 을 먹었다. 모바일에서는 **허브 여섯만** 한 줄로 두고
   가로 스크롤로 넘긴다. 바로가기는 접는다 (표지와 각 허브에서 닿는다). */
@media (max-width:720px){
  .gnav{height:auto}
  .gnav .in{padding:.4rem .7rem;flex-wrap:nowrap;overflow-x:auto;height:auto;
    min-height:2.7rem;scrollbar-width:none}
  .gnav .in::-webkit-scrollbar{display:none}
  .gnav .q{display:none}
  .gnav .sp{display:none}
  .gnav a.home{margin-right:.35rem;flex:none}
  .gnav a{flex:none;padding:.3rem .45rem}
  /* ★ 2026-09-08 팀장 지적: 모바일에서 검색·테마가 화면 밖이다.
     실측(390px · 같은 출처 iframe · 높이 30000): .navctl 오른쪽 끝이 x=860.
     바가 가로로 스크롤되는 것은 8/31 팀장 확정이라 그대로 둔다. 다만 그 결정은
     «허브 링크» 를 한 줄에 두려던 것이었고, 검색·테마까지 밀려날 이유는 없었다.
     완비 관문 [3.46] 은 「토글이 있는가」만 보고 「닿는가」는 아무도 안 봤다.
     스크롤 컨테이너 안에서 sticky 로 오른쪽에 붙여 언제나 닿게 한다. */
  .gnav .navctl{margin-left:auto;flex:none;position:sticky;right:0;
    background:var(--paper);padding-left:.35rem;z-index:1}
}

.band{display:block;text-decoration:none;color:inherit;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:var(--p-radius,8px);
  padding:1rem 1.2rem;margin:0 0 14px;transition:border-color .12s,background .12s}
/* ★ 호버 한 벌 (팀장 정정 8/31): 슬롭은 «위·왼쪽 악센트 바» 였지 테두리가 아니었다.
   「최근 올라온 것」처럼 **호버에 테두리 색이 들어가** 눈에 띄게 한다.
   표지 아홉 · 바로가기 · 최근 목록이 같은 방식으로 반응한다. */
.band:hover,.bands3 .band:hover,.hubs a:hover,.quick a:hover{
  border-color:var(--dim)}
.hubs a.hot:hover,.bands3 .b-deliv:hover{border-color:var(--note)}
.band .t{font-size:1.06rem;font-weight:850;letter-spacing:.02em}
.band .d{font-size:.8rem;color:var(--ink-3);margin-top:.22rem}
.band .w{float:right;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;
  color:var(--ink-3);font-weight:700}

/* ★ 표지 3열 (팀장 8/31): 디자인 시스템 안에서 배경톤 베리에이션.
   토큰의 soft 짝을 써서 셋을 구분한다. 새 색을 만들지 않는다. */
.bands3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:0 0 14px}
/* ★ 팀장 재지적: 「면과 위쪽 한 줄」도 AI 슬롭이다. 악센트 바를 전부 뺀다.
   구분은 배경 면 · 여백 · 글자 위계로만. 색은 뜻이 있을 때만 (급한 것). */
.bands3 .band{margin:0;padding:.9rem 1.1rem;min-height:5.2rem;
  display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--rule)}
.bands3 .band .t{font-size:.98rem}
/* ★ 배경톤 베리에이션 (팀장 8/31). 새 색을 만들지 않는다.
   토큰의 soft 짝을 쓰되 «뜻» 에 맞춰 고른다:
     팀 공지 = 우리 안에서 도는 것 -> dim-soft
     다이제스트 = 지난 것을 갈무리 -> paper-2 (중립)
     산출물 = 급한 것 -> note-soft */
.bands3 .b-notice{background:var(--dim-soft)}
.bands3 .b-digest{background:var(--paper-2)}
.bands3 .b-deliv{background:var(--note-soft)}
.bands3 .b-deliv .d{color:var(--note-ink,var(--note));font-weight:700}
@media (max-width:820px){.bands3{grid-template-columns:1fr}}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));
  gap:.6rem;margin:0 0 16px}
.quick a{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--p-radius,8px);
  padding:.72rem .85rem;transition:border-color .12s}
.quick .k{font-size:.92rem;font-weight:800}
.quick .e{font-family:ui-monospace,Consolas,monospace;font-size:.6rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:.08rem}

        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();})
      .then(function(j){
        if(!Array.isArray(j)||(j.length&&typeof j[0].x!=='string'))
          throw new Error('schema');
        IDX=j;IDXERR=null;cb();})
      .catch(function(err){
        IDX=[];IDXERR=(err&&err.message==='schema')?'schema':'fetch';cb();});}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  /* fh-rank:시작 · 순위 규칙은 여기 하나뿐이다. 빌드 관문 [1.8993] 이 이 함수를
     «그대로» 떼어 node 로 돌려 알려진 답과 맞춰 본다. 규칙을 두 번 적지 않는다. */
  function fhRank(IDX,q,cap,lim){
    var hits=[],i;
    for(i=0;i<IDX.length;i++){
      var e=IDX[i],H=e.h.toLowerCase(),X=e.x.toLowerCase(),T=e.t.toLowerCase(),
          hi=H.indexOf(q),ti=X.indexOf(q),pi=T.indexOf(q);
      if(hi<0&&ti<0&&pi<0)continue;
      var score=(hi>=0?3:0)+(pi>=0?2:0)+(ti>=0?1:0);
      /* ★ 2026-09-09 실측. 점수가 «어느 칸에 있나» 만 보니 본문에 한 번 스친 글과
         본문이 온통 그 얘기인 글이 동점이었고, 동점은 색인 순서로 풀려 결국
         파일이름 순이 됐다. 라이브에서 «rails» 를 치면 12칸이 전부 a~d 로
         시작하는 페이지로 찼고 정작 rails 진단 문서 셋은 하나도 없었다.
         그 낱말을 «몇 번» 쓴 글인가를 칸 다음 순위로 넣는다. 20에서 끊는다.
         (긴 글이 짧은 글을 무조건 이기면 그것대로 또 틀린 순위다.) */
      var n=0,at=-1;
      while(n<20&&(at=X.indexOf(q,at+1))>=0)n++;
      var bt=-1;
      while(n<20&&(bt=H.indexOf(q,bt+1))>=0)n++;
      var snip='';
      if(ti>=0){var s=Math.max(0,ti-34);snip=(s>0?'…':'')+e.x.substr(s,95)+'…';}
      hits.push({e:e,s:score,n:n,i:i,snip:snip});
    }
    /* 동점이면 색인 순서로 고정한다. 정렬이 흔들리면 같은 검색어가 매번 다른
       차례를 준다 (재현 빌드에서 A1 과 A2 가 갈리던 것과 같은 부류다). */
    hits.sort(function(a,b){return b.s-a.s||b.n-a.n||a.i-b.i});
    /* ★ 한 문서가 칸을 다 먹지 않게 한다. «pit» 을 치면 pit 진단 한 장의 절
       여섯이 화면을 채워 다른 문서를 전부 밀어냈다. 페이지당 cap 장까지만
       남기면 12칸이 적어도 네 문서를 담는다. */
    var seen={},keep=[];
    for(i=0;i<hits.length&&keep.length<lim;i++){
      var pg=hits[i].e.p,c=seen[pg]||0;
      if(c>=cap)continue;
      seen[pg]=c+1;keep.push(hits[i]);
    }
    return {hits:keep,total:hits.length};
  }
  /* fh-rank:끝 */
  function go(){
    var q=inp.value.trim().toLowerCase();sel=-1;
    if(q.length<2){res.innerHTML='';return;}
    load(function(){
      /* ★ 2026-09-08 감사 F-02. 전에는 hits.length<40 인 동안만 훑고 그 40개를
         정렬했다. 색인은 페이지 이름 순이라, 뒤쪽 페이지의 «제목 일치»(3점)가
         앞쪽 페이지의 «본문 일치»(1점)보다 높아도 후보에 못 들었다.
         실측: 프로젝트·보행·평가·문서·정책 다섯 낱말에서 화면 상위 12가
         전역 상위 12와 달랐다. 전부 점수 매기고 정렬한 «뒤에» 자른다. */
      var hits=fhRank(IDX,q,3,12).hits;
      if(!hits.length){
        var msg=IDXERR==='fetch'?'검색 색인을 불러오지 못했습니다. 새로고침해 주세요'
               :IDXERR==='schema'?'검색 색인 형식이 올바르지 않습니다. 관리자에게 알려 주세요'
               :'결과 없음: '+esc(q);
        res.innerHTML='<div class="none">'+msg+'</div>';}
      else{res.innerHTML=hits.map(function(h){
        return '<a href="'+h.e.p+(h.e.a?'#'+h.e.a:'')+'"><div class="sp1">'+esc(h.e.t)
          +'</div><div class="sp2">'+esc(h.e.h)+'</div>'
          +(h.snip?'<div class="sp3">'+esc(h.snip)+'</div>':'')+'</a>';}).join('');}
    });
  }
  inp.addEventListener('input',go);
  inp.addEventListener('keydown',function(e){
    e.stopPropagation(); /* 커리큘럼 등 자체 키보드 내비게이션 페이지로 새지 않게 */
    if(e.key==='Escape'){close();return;}
    var as=res.querySelectorAll('a');if(!as.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,as.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();as[sel].click();return;}
    else return;
    as.forEach(function(a,i){a.classList.toggle('sel',i===sel)});
    if(as[sel])as[sel].scrollIntoView({block:'nearest'});
  });
});
</script>

<script>
let MAN=null, KEY=null;
async function loadMan(){
  if(!MAN) MAN = await (await fetch('assets/secure/manifest.json?t='+Date.now(), {cache:'no-store'})).json();
  return MAN;
}
async function deriveKey(pw, saltHex, iters){
  const salt = Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iters, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
// 캐시 버스터는 «파일마다» 다르다 (mai-os#22 묶음 6.6).
//   전에는 salt 앞자리를 썼다. 그때는 빌드마다 salt 가 새로 나왔으니 그것이
//   곧 «이 빌드의 판» 이었다. 이제 입력이 같으면 salt 를 이어쓰므로, 바뀐
//   파일 하나가 옛 주소를 그대로 갖게 되어 브라우저가 옛 암호문을 붙잡는다.
//   그래서 manifest 가 파일별 태그(v)를 싣고, 없으면 salt 로 물러선다.
//   태그는 «암호문» 의 해시 앞자리다. 내려받으면 누구나 계산할 수 있는 값이라
//   원문에 대해 아무것도 말하지 않는다.
function _tag(url){
  if(MAN.tags && MAN.tags[url]) return MAN.tags[url];
  return MAN.salt.slice(0,8);
}
async function decryptFile(url){
  const buf = new Uint8Array(await (await fetch(url+'?v='+_tag(url), {cache:'no-store'})).arrayBuffer());
  const nonce = buf.slice(0,12), ct = buf.slice(12);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce}, KEY, ct));
}
document.getElementById('go').addEventListener('click', async ()=>{
  const err = document.getElementById('err'); err.textContent='';
  try{
    const man = await loadMan();
    KEY = await deriveKey(document.getElementById('pw').value, man.salt, man.iters);
    const cb = Uint8Array.from(man.check.match(/../g).map(h=>parseInt(h,16)));
    await crypto.subtle.decrypt({name:'AES-GCM', iv:cb.slice(0,12)}, KEY, cb.slice(12));
  }catch(e){ err.textContent='비밀번호가 맞지 않습니다.'; KEY=null; return; }
  // 앵커(gatebox)째로 숨긴다. gate 만 숨기면 min-height 380px 빈칸이 남는다
  document.getElementById('gatebox').style.display='none';
  const list = document.getElementById('list'); list.style.display='block';
  const KIND='budget';
  // 암호 뒤에 둔 안내(저장소 주소 · 담당자). 해제해야만 보인다.
  if(MAN.notes && MAN.notes[KIND]){
    try{
      const nb = await decryptFile(MAN.notes[KIND]);
      document.getElementById('extra').innerHTML = new TextDecoder().decode(nb);
    }catch(e){ console.error('note', e); }
  }
  for(const it of MAN.items.filter(x=>(x.kind||'chosun')===KIND)){
    const d = document.createElement('div'); d.className='item';
    d.innerHTML = '<span class="no">'+it.no+'</span><b>'+it.title+'</b>'
      +'<div class="m">'+it.name+' · '+(it.size/1048576).toFixed(1)+' MB · 등록 '+it.added+'</div>';
    const dl = document.createElement('button'); dl.textContent='다운로드 (원본)';
    dl.onclick = async ()=>{
      const data = await decryptFile(it.file);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data]));
      a.download = it.name; a.click();
    };
    d.appendChild(dl);
    // 2026-08-28: 자료실이 PDF 만 다룰 수 있었다. 조선대가 강의 PDF 4종을 지우고
    //   4.5MB 짜리 HTML 런북 하나로 갈아탔으므로 형식을 넓힌다.
    //   그림으로 그려 보여주는 것(pdf.js)은 PDF 에만 되고, HTML 은 새 탭으로 연다.
    const isPdf = it.vkind === 'pdf';
    if(it.view && isPdf){
      const v = document.createElement('button'); v.textContent='여기서 보기';
      v.onclick = async ()=>{
        let box = d.querySelector('.pdfbox');
        if(box){ box.remove(); d.querySelector('.close').remove(); return; }
        v.disabled = true; v.textContent = '여는 중...';
        try{
          const data = await decryptFile(it.view);
          const pdfjs = await import('/assets/vendor/pdfjs/pdf.min.mjs');
          pdfjs.GlobalWorkerOptions.workerSrc = '/assets/vendor/pdfjs/pdf.worker.min.mjs';
          const doc = await pdfjs.getDocument({data}).promise;
          box = document.createElement('div'); box.className='pdfbox';
          const cl = document.createElement('button'); cl.className='close';
          cl.textContent='닫기'; cl.style.display='block'; cl.style.margin='8px 0';
          cl.onclick = ()=>{ box.remove(); cl.remove(); };
          d.appendChild(box); d.appendChild(cl);
          const wpx = Math.min(d.clientWidth - 4, 920);
          for(let n=1; n<=doc.numPages; n++){
            const pg = await doc.getPage(n);
            const base = pg.getViewport({scale:1});
            const scale = wpx / base.width * (window.devicePixelRatio||1);
            const vp = pg.getViewport({scale});
            const cv = document.createElement('canvas');
            cv.width = vp.width; cv.height = vp.height;
            cv.style.width = '100%'; cv.style.display='block';
            cv.style.border = '1px solid var(--rule,#d8d4c8)'; cv.style.marginBottom='6px';
            box.appendChild(cv);
            await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
          }
        }catch(e){ const er=document.createElement('div'); er.style.cssText='color:#b3452c;font-size:.8rem;margin-top:6px'; er.textContent='열기 실패: '+e.message; d.appendChild(er); console.error('viewer', e); }
        v.disabled = false; v.textContent = '여기서 보기';
      };
      d.appendChild(v);
    }
    if(it.view){
      // ★ 2026-08-28. HTML 은 «여기서 보기» 를 먼저 준다. 모바일에서 새 탭이
      //   팝업 차단에 막히기 때문이다 (팀장 실사용에서 확인).
      if(!isPdf){
        const hv = document.createElement('button'); hv.textContent='여기서 보기';
        hv.onclick = async ()=>{
          let box = d.querySelector('.htmlbox');
          if(box){ box.remove(); const c=d.querySelector('.hclose'); if(c) c.remove(); return; }
          hv.disabled = true; hv.textContent = '여는 중...';
          try{
            const data = await decryptFile(it.view);
            const url = URL.createObjectURL(new Blob([data],{type:'text/html;charset=utf-8'}));
            box = document.createElement('iframe'); box.className='htmlbox';
            box.src = url; box.setAttribute('sandbox','allow-scripts');
            box.style.cssText='display:block;width:100%;height:78vh;margin-top:10px;border:1px solid var(--rule,#d8d4c8);border-radius:6px;background:#fff';
            const cl = document.createElement('button'); cl.className='hclose';
            cl.textContent='닫기'; cl.style.cssText='display:block;margin:8px 0';
            cl.onclick = ()=>{ box.remove(); cl.remove(); URL.revokeObjectURL(url); };
            d.appendChild(box); d.appendChild(cl);
          }catch(e){ const er=document.createElement('div');
            er.style.cssText='color:#b3452c;font-size:.8rem;margin-top:6px';
            er.textContent='열기 실패: '+e.message; d.appendChild(er); }
          hv.disabled = false; hv.textContent = '여기서 보기';
        };
        d.appendChild(hv);
      }
      const nt = document.createElement('button'); nt.textContent='새 탭에서 보기';
      nt.onclick = async ()=>{
        // ★ 창을 «먼저» 연다. 복호화(await) 뒤에 열면 사용자 제스처 맥락이
        //   끊겨 모바일 브라우저가 팝업으로 막는다. 실제로 막혔다.
        const w = window.open('', '_blank');
        nt.disabled = true; nt.textContent = '여는 중...';
        try{
          const data = await decryptFile(it.view);
          const mime = isPdf ? 'application/pdf' : 'text/html;charset=utf-8';
          const url = URL.createObjectURL(new Blob([data],{type:mime}));
          if(w && !w.closed){ w.location = url; }
          else { throw new Error('팝업이 막혔습니다. 위의 «여기서 보기» 를 쓰세요'); }
        }catch(e){ if(w && !w.closed) w.close();
          const er=document.createElement('div');
          er.style.cssText='color:#b3452c;font-size:.8rem;margin-top:6px';
          er.textContent='열기 실패: '+e.message; d.appendChild(er); }
        nt.disabled = false; nt.textContent = '새 탭에서 보기';
      };
      d.appendChild(nt);
    }
    list.appendChild(d);
  }
});
