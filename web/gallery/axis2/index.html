<!DOCTYPE html>

<link rel="stylesheet" href="/gallery/gallery.css">
<style>.top .sp{flex:1}
.tool .q{font-size:.76rem;color:var(--ink-2);flex:1}
.side,aside,.toc,.sidebar,.sticky,.stick{z-index:60}

.band{display:block;text-decoration:none;color:inherit;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:var(--p-radius,8px);
  padding:1rem 1.2rem;margin:0 0 14px;transition:border-color .12s,background .12s}
/* ★ 호버 한 벌 (팀장 정정 8/31): 슬롭은 «위·왼쪽 악센트 바» 였지 테두리가 아니었다.
   「최근 올라온 것」처럼 **호버에 테두리 색이 들어가** 눈에 띄게 한다.
   표지 아홉 · 바로가기 · 최근 목록이 같은 방식으로 반응한다. */
.band:hover,.bands3 .band:hover,.hubs a:hover,.quick a:hover{
  border-color:var(--dim)}
.hubs a.hot:hover,.bands3 .b-deliv:hover{border-color:var(--note)}
.band .t{font-size:1.06rem;font-weight:850;letter-spacing:.02em}
.band .d{font-size:.8rem;color:var(--ink-3);margin-top:.22rem}
.band .w{float:right;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;
  color:var(--ink-3);font-weight:700}

/* ★ 표지 3열 (팀장 8/31): 디자인 시스템 안에서 배경톤 베리에이션.
   토큰의 soft 짝을 써서 셋을 구분한다. 새 색을 만들지 않는다. */
.bands3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:0 0 14px}
/* ★ 팀장 재지적: 「면과 위쪽 한 줄」도 AI 슬롭이다. 악센트 바를 전부 뺀다.
   구분은 배경 면 · 여백 · 글자 위계로만. 색은 뜻이 있을 때만 (급한 것). */
.bands3 .band{margin:0;padding:.9rem 1.1rem;min-height:5.2rem;
  display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--rule)}
.bands3 .band .t{font-size:.98rem}
/* ★ 배경톤 베리에이션 (팀장 8/31). 새 색을 만들지 않는다.
   토큰의 soft 짝을 쓰되 «뜻» 에 맞춰 고른다:
     팀 공지 = 우리 안에서 도는 것 -> dim-soft
     다이제스트 = 지난 것을 갈무리 -> paper-2 (중립)
     산출물 = 급한 것 -> note-soft */
.bands3 .b-notice{background:var(--dim-soft)}
.bands3 .b-digest{background:var(--paper-2)}
.bands3 .b-deliv{background:var(--note-soft)}
.bands3 .b-deliv .d{color:var(--note-ink,var(--note));font-weight:700}
@media (max-width:820px){.bands3{grid-template-columns:1fr}}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));
  gap:.6rem;margin:0 0 16px}
.quick a{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--p-radius,8px);
  padding:.72rem .85rem;transition:border-color .12s}
.quick .k{font-size:.92rem;font-weight:800}
.quick .e{font-family:ui-monospace,Consolas,monospace;font-size:.6rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:.08rem}
.quick .d{font-size:.72rem;color:var(--ink-3);line-height:1.5;margin-top:.3rem}

/* ★ v3: PC 3열×2행 (팀장 지시 2026-08-30). 좁으면 흘러내린다. */
.hubs{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:0 0 28px}
@media (max-width:720px){.hubs{grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr))}}
.hubs a.hot .d{color:var(--note-ink,var(--note));font-weight:700}
/* ★ 높이 통일 (팀장 8/31): 설명 길이가 달라 행마다 높이가 달랐다.
   같은 격자 안에서 늘려 맞추고, 설명은 두 줄로 잘라 통일한다. */
/* ★ AI 슬롭 제거 (팀장 8/31): 카드마다 두른 외곽선을 없앤다.
   구분은 «면(배경)» 과 위쪽 3px 한 줄로만. 선을 겹쳐 두르지 않는다. */
/* 허브 여섯: 흰 카드 다섯의 반복이 단조로웠다. «무엇을 보러 가는가» 로 톤을 나눈다.
     밖에 보이는 것(기획·회의) = card 흰 면
     우리가 만든 것(연구·기술) = paper-2
     굴리는 것(파이프라인)     = paper-2 · 옅은 글자
     급한 것(일정)             = note-soft
   전부 기존 토큰이다. 새 색 없음. */
.hubs a{display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--rule);
  border-radius:var(--p-radius,8px);padding:.9rem 1rem;min-height:6.4rem;
  transition:border-color .12s,background .12s}
.hubs a:nth-child(4),.hubs a:nth-child(5),.hubs a:nth-child(6){background:var(--paper-2)}
.hubs a.hot{background:var(--note-soft)}
.hubs .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-top:auto}

.hubs .k{font-size:1rem;font-weight:850}
.hubs .e{font-family:ui-monospace,Consolas,monospace;font-size:.6rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:.08rem}
.hubs .d{font-size:.73rem;color:var(--ink-3);line-height:1.5;margin-top:.34rem}
.hubs .n{font-size:.7rem;color:var(--ink-3);font-weight:700;margin-top:.3rem}

.hlede{font-size:.74rem;color:var(--ink-3);margin:-2px 0 9px;line-height:1.5}
.hv{border:1px solid var(--rule);border-radius:3px;padding:0 4px;font-weight:700;
  font-size:.92em;margin-left:.4rem;color:var(--ink-3)}
.hgroup{margin:26px 0 8px;font-size:.7rem;font-weight:800;letter-spacing:.12em;
  color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:.35rem}
.hlist{display:grid;gap:.5rem}
.hlist a{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--p-radius,8px);padding:.65rem .85rem}
.hlist a:hover{border-color:var(--dim)}
.hlist a{position:relative;padding-left:3.1rem}
.hlist .hn{position:absolute;left:.85rem;top:.68rem;font-family:ui-monospace,Consolas,monospace;
  font-size:.72rem;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.hlist .t{font-size:.92rem;font-weight:750}
.hlist .d{font-size:.75rem;color:var(--ink-3);line-height:1.55;margin-top:.2rem}
.hlist .m{font-size:.7rem;color:var(--ink-3);margin-top:.35rem;

/* 「먼저 볼 것」. 이 허브에 처음 왔으면 여기서 시작한다 (#73). */
.hhero{display:block;text-decoration:none;color:inherit;margin:0 0 1.5rem;
  border:1px solid var(--dim);border-radius:8px;background:var(--card);

.hhero:hover{border-color:var(--ink-3)}

.hhero .t{font-size:1.28rem;font-weight:820;line-height:1.3;letter-spacing:-.01em}
.hhero .d{font-size:.88rem;color:var(--ink-2,var(--ink-3));line-height:1.6;

.hhero .m{font-size:.72rem;color:var(--ink-3);margin-top:.55rem;

.hhero .hv{font-size:.62rem;margin-left:.5rem;vertical-align:.3em}
@media (max-width:560px){.hhero .t{font-size:1.08rem}}

/* 표지 「최근 올라온 것」. ia-css 는 모든 페이지에 실리므로 여기 한 자리면 된다. */
.recent{display:grid;gap:.45rem;margin:0 0 10px}
.recent a{display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap;

.recent .rd{flex:none;font-size:.72rem;color:var(--ink-3);

.recent .rk{flex:none;font-size:.62rem;font-weight:800;letter-spacing:.08em;
  color:var(--dim);min-width:4.6em}
.recent .rt{font-size:.86rem;font-weight:750;line-height:1.45}
.recent .rn{flex:none;font-size:.58rem;font-weight:800;background:var(--dim);
  color:var(--paper);border-radius:3px;padding:1px 5px;letter-spacing:.06em}
@media (max-width:560px){
  .recent a{gap:.4rem}
  .recent .rt{flex-basis:100%}
}


/* ★ 2026-09-29. **`el.hidden` 은 제작자 CSS 한 줄에 진다.**
   브라우저 기본 시트의 `[hidden]{display:none}` 이라 우리 `.ended{display:...}`
   같은 규칙이 이기면 숨긴 것이 보인다. 빌드의 hidden 안전망 검사가 잡았다
   (갤러리를 공개 페이지 목록에 넣자 바로 걸렸다). */

  padding:9px 12px;background:var(--card);border:1px solid var(--rule);
  border-radius:8px}

span.fh-new{display:inline-block!important;margin-left:.45rem;vertical-align:.14em;
  background:var(--note)!important;color:#fff!important;font-size:.55rem!important;
  font-weight:800!important;letter-spacing:.1em!important;line-height:1.5!important;
  padding:.13rem .4rem!important;border-radius:3px!important;white-space:nowrap;
  text-transform:none!important;font-family:inherit}
</style>
<script>
(function(){
  var W=7*86400000,KEY='fh_seen';
  var TITLE='.t,.rt,.bt,.tlt3,.ex3,.pk3,.k,.hb3,b,strong,h2,h3';
  function norm(s){
    /* 2026-09-12. split('/').pop() 이 끝의 빈 조각을 집어
       /gallery/ · /index.html · /team-meang/index.html 이 전부 'index' 로
       뭉개졌다. 표지를 여는 순간 갤러리가 「봤음」이 돼 NEW 가 안 떴다. */
    s=(s||'').split('#')[0].split('?')[0].replace(/\.html$/,'').replace(/\/+$/,'');
    var p=s.split('/').filter(Boolean);
    var last=p.pop()||'index';
    if(last==='index'&&p.length)last=p.pop()+'/index';
    return last;
  }
  function host(a){
    var h=a.querySelector(TITLE);
    if(h)return h;
    for(var i=0;i<a.children.length;i++)
      if(a.children[i].textContent.trim())return a.children[i];
    return a;
  }
  function mark(a,on){
    var b=a.querySelector('.fh-new');
    if(!on){if(b)b.parentNode.removeChild(b);return}
    if(b)return;
    b=document.createElement('span');b.className='fh-new';b.textContent='NEW';
    host(a).appendChild(b);
  }
  function apply(){
    var seen={},raw={};
    try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
    for(var k in raw)seen[norm(k)]=raw[k];
    seen[norm(location.pathname)]=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}
    document.querySelectorAll('a[data-added]').forEach(function(a){
      var t=Date.parse(a.getAttribute('data-added')+'T00:00:00');
      var tgt=norm(a.getAttribute('href'));
      var on=!isNaN(t)&&Date.now()-t>=0&&Date.now()-t<=W&&!seen[tgt];
      a.classList.toggle('is-new',on);
      mark(a,on);
    });
  }
  document.addEventListener('DOMContentLoaded',apply);
  window.addEventListener('pageshow',function(e){if(e.persisted)apply()});
})();
</script>

/* ★ 2026-09-08 감사 F-06. 검색 버튼 실측 58x30. 손가락 목표 44x44 에 못 미친다.

<script>
document.addEventListener('DOMContentLoaded',function(){
  /* «← …로» 버튼은 라벨이 가리키는 곳으로만 간다.
     예전의 «스마트 뒤로가기»(history.back)는 제거했다. 라벨은 «표지로»인데
     실제로는 직전 페이지로 돌아가 사용자를 속였다. (2026-08-24) */
  /* 검색 버튼: PDF 저장 버튼 왼쪽, 같은 스타일 (레이아웃을 새로 만들지 않는다) */
  var pb=document.getElementById('pdfBtn')||document.querySelector('.pdfbtn');
  var sb=document.createElement('button');sb.type='button';
  /* ★ 9/1 팀장 실측: 「돋보기 아이콘 크기가 달라지면서 위치가 변한다」.
     여기가 그 원인이다. 검색 버튼이 «그 페이지의 PDF 버튼 클래스를 복사» 해서
     페이지마다 패딩·글자·자간이 달랐고, 그만큼 오른쪽 묶음이 밀렸다.
     전역바가 바를 소유한 지금은 복사할 이유가 없다. 자기 클래스만 쓴다. */
  sb.className=(pb&&!pb.closest('.gnav')?'fh-sbtn-fix ':'')+'fh-sbtn';
  sb.setAttribute('aria-label','사이트 검색');
  sb.innerHTML='<svg viewBox="0 0 16 16" width="11" height="11" fill="none" '
    +'stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
    +'<circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4L14 14"/></svg>검색';
  /* ★ 2026-08-28. 전에는 PDF 버튼 옆에 붙이려다, PDF 가 숨겨진 화면(모바일)에서
     position:fixed 로 튕겨나가 top:7px/right:14px 에 앉았다. 그 자리가 바로
     sticky 상단바 위였고 z-index 가 둘 다 70 이라 나중에 그려지는 검색이 이겨서
     「파이프라인」 글자를 덮었다 (팀장 모바일 실측).
     상단바에 자리(.navctl)를 마련했으니 **거기 앉는다.** 떠다니지 않는다. */
  var slot=document.querySelector('.gnav .navctl');
  if(slot){ slot.insertBefore(sb, slot.firstChild); }
  else if(pb){ pb.parentNode.insertBefore(sb,pb); }
  else { document.body.appendChild(sb); }
  function offset(){
    if(slot){ sb.style.position='';sb.style.top='';sb.style.right='';sb.style.zIndex='';return; }
    if(!pb)return;var cs=getComputedStyle(pb);
    var r=pb.getBoundingClientRect();
    if(cs.display==='none'||r.width===0){
      sb.style.position='fixed';sb.style.top='7px';sb.style.right='14px';sb.style.zIndex='71';
    }else if(cs.position==='fixed'){
      sb.style.position='fixed';sb.style.top=r.top+'px';
      sb.style.right=(window.innerWidth-r.left+8)+'px';sb.style.zIndex=cs.zIndex;
    }else{sb.style.position='';sb.style.top='';sb.style.right='';}}
  offset();window.addEventListener('resize',offset);
  /* 오버레이
     ★ 2026-09-08 감사 F-06. 화면에는 대화상자로 보이는데 «기계에게는» 그냥 div 였다.
       role·aria-modal 이 없어 보조 기술이 대화상자로 읽지 못하고, 결과가 바뀌어도
       aria-live 가 없어 알리지 않았다. 탭이 뒤 페이지로 새어 나갔고, 닫은 뒤에는
       포커스가 숨은 입력에 남아 키보드 사용자가 어디에 있는지 잃었다.
       보이는 것과 읽히는 것이 다르면 그것은 만들다 만 것이다. */
  var ov=document.createElement('div');ov.className='fh-so';
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label','사이트 검색');
  ov.innerHTML='<div class="fh-sp"><input type="search" placeholder="검색 (제목 · 절 · 본문)" '
    +'aria-label="사이트 검색"><div class="fh-sr" role="listbox" aria-live="polite" '
    +'aria-label="검색 결과"></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('input'),res=ov.querySelector('.fh-sr'),IDX=null,sel=-1;
  sb.setAttribute('aria-haspopup','dialog');
  sb.setAttribute('aria-expanded','false');
  function open(){
    ov.classList.add('on');
    sb.setAttribute('aria-expanded','true');
    inp.focus();inp.select();
  }
  function close(){
    ov.classList.remove('on');
    sb.setAttribute('aria-expanded','false');
    /* 닫으면 «열었던 그 버튼» 으로 돌아간다. 안 그러면 키보드 사용자는
       숨은 입력에 포커스가 남아 화면 어디에 있는지 알 수 없다. */
    try{ sb.focus(); }catch(e){}
  }
  sb.addEventListener('click',open);
  ov.addEventListener('mousedown',function(e){if(e.target===ov)close();});
  /* 포커스 가두기. 열려 있는 동안 탭이 뒤 페이지로 새지 않게 한다.
     가둘 것은 입력과 결과 링크뿐이라 목록을 그때그때 다시 센다. */
  ov.addEventListener('keydown',function(e){
    if(e.key!=='Tab')return;
    var f=[inp].concat([].slice.call(res.querySelectorAll('a')));
    if(!f.length)return;
    var first=f[0],last=f[f.length-1],cur=document.activeElement;
    if(e.shiftKey&&(cur===first||!ov.contains(cur))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&cur===last){e.preventDefault();first.focus();}
  });
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open();}
    /* ★ 2026-09-08 감사 F-06. Ctrl/Cmd+K 는 브라우저가 주소창 검색으로 먼저
       가져갈 수 있다. 감사도 「실제 키로는 안 열렸다」고 적었고, 내 환경에서는
       키 자체가 페이지에 도달하지 않아 어느 쪽인지 «확인하지 못했다».
       확인 못 한 것을 고쳤다고 할 수 없으므로 Ctrl+K 는 그대로 두고,
       브라우저가 안 가져가는 «/» 를 함께 연다. 위키·깃허브가 쓰는 그 키다.
       글자를 치는 중일 때는 열지 않는다. 그러면 검색어에 / 를 못 넣는다. */
    else if(e.key==='/'&&!ov.classList.contains('on')){
      var a=document.activeElement, tag=(a&&a.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'||(a&&a.isContentEditable))return;
      e.preventDefault();open();
    }
    else if(e.key==='Escape'&&ov.classList.contains('on'))close();
  });
  /* ★ 2026-09-08 감사 F-06. 셋을 한 덩어리로 삼켜 «결과 없음» 하나로 보여줬다.
     색인을 못 받은 것 · 받았는데 모양이 틀린 것 · 정말로 없는 것은 서로 다르다.
     앞의 둘은 우리 잘못이고 사용자는 다시 시그림야 한다는 것을 알아야 한다.
     경로도 루트 절대경로로 바꾼다. team-meang/ 처럼 한 단계 아래 페이지에서
     상대경로면 team-meang/assets/... 를 찾아 항상 실패한다. */
  var IDXERR=null;
  function load(cb){if(IDX)return cb();
    fetch('/assets/search-index.json?v=60a445b8').then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();})
      .then(function(j){
        if(!Array.isArray(j)||(j.length&&typeof j[0].x!=='string'))
          throw new Error('schema');
        IDX=j;IDXERR=null;cb();})
      .catch(function(err){
        IDX=[];IDXERR=(err&&err.message==='schema')?'schema':'fetch';cb();});}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  /* fh-rank:시작 · 순위 규칙은 여기 하나뿐이다. 빌드 관문 [1.8993] 이 이 함수를
     «그대로» 떼어 node 로 돌려 알려진 답과 맞춰 본다. 규칙을 두 번 적지 않는다. */
  function fhRank(IDX,q,cap,lim){
    var hits=[],i;
    for(i=0;i<IDX.length;i++){
      var e=IDX[i],H=e.h.toLowerCase(),X=e.x.toLowerCase(),T=e.t.toLowerCase(),
          hi=H.indexOf(q),ti=X.indexOf(q),pi=T.indexOf(q);
      if(hi<0&&ti<0&&pi<0)continue;
      var score=(hi>=0?3:0)+(pi>=0?2:0)+(ti>=0?1:0);
      /* ★ 2026-09-09 실측. 점수가 «어느 칸에 있나» 만 보니 본문에 한 번 스친 글과
         본문이 온통 그 얘기인 글이 동점이었고, 동점은 색인 순서로 풀려 결국
         파일이름 순이 됐다. 라이브에서 «rails» 를 치면 12칸이 전부 a~d 로
         시작하는 페이지로 찼고 정작 rails 진단 문서 셋은 하나도 없었다.
         그 낱말을 «몇 번» 쓴 글인가를 칸 다음 순위로 넣는다. 20에서 끊는다.
         (긴 글이 짧은 글을 무조건 이기면 그것대로 또 틀린 순위다.) */
      var n=0,at=-1;
      while(n<20&&(at=X.indexOf(q,at+1))>=0)n++;
      var bt=-1;
      while(n<20&&(bt=H.indexOf(q,bt+1))>=0)n++;
      var snip='';
      if(ti>=0){var s=Math.max(0,ti-34);snip=(s>0?'…':'')+e.x.substr(s,95)+'…';}
      hits.push({e:e,s:score,n:n,i:i,snip:snip});
    }
    /* 동점이면 색인 순서로 고정한다. 정렬이 흔들리면 같은 검색어가 매번 다른
       차례를 준다 (재현 빌드에서 A1 과 A2 가 갈리던 것과 같은 부류다). */
    hits.sort(function(a,b){return b.s-a.s||b.n-a.n||a.i-b.i});
    /* ★ 한 문서가 칸을 다 먹지 않게 한다. «pit» 을 치면 pit 진단 한 장의 절
       여섯이 화면을 채워 다른 문서를 전부 밀어냈다. 페이지당 cap 장까지만
       남기면 12칸이 적어도 네 문서를 담는다. */
    var seen={},keep=[];
    for(i=0;i<hits.length&&keep.length<lim;i++){
      var pg=hits[i].e.p,c=seen[pg]||0;
      if(c>=cap)continue;
      seen[pg]=c+1;keep.push(hits[i]);
    }
    return {hits:keep,total:hits.length};
  }
  /* fh-rank:끝 */
  function go(){
    var q=inp.value.trim().toLowerCase();sel=-1;
    if(q.length<2){res.innerHTML='';return;}
    load(function(){
      /* ★ 2026-09-08 감사 F-02. 전에는 hits.length<40 인 동안만 훑고 그 40개를
         정렬했다. 색인은 페이지 이름 순이라, 뒤쪽 페이지의 «제목 일치»(3점)가
         앞쪽 페이지의 «본문 일치»(1점)보다 높아도 후보에 못 들었다.
         실측: 프로젝트·보행·평가·문서·정책 다섯 낱말에서 화면 상위 12가
         전역 상위 12와 달랐다. 전부 점수 매기고 정렬한 «뒤에» 자른다. */
      var hits=fhRank(IDX,q,3,12).hits;
      if(!hits.length){
        var msg=IDXERR==='fetch'?'검색 색인을 불러오지 못했습니다. 새로고침해 주세요'
               :IDXERR==='schema'?'검색 색인 형식이 올바르지 않습니다. 관리자에게 알려 주세요'
               :'결과 없음: '+esc(q);
        res.innerHTML='<div class="none">'+msg+'</div>';}
      else{res.innerHTML=hits.map(function(h){
        return '<a href="'+h.e.p+(h.e.a?'#'+h.e.a:'')+'"><div class="sp1">'+esc(h.e.t)
          +'</div><div class="sp2">'+esc(h.e.h)+'</div>'
          +(h.snip?'<div class="sp3">'+esc(h.snip)+'</div>':'')+'</a>';}).join('');}
    });
  }
  inp.addEventListener('input',go);
  inp.addEventListener('keydown',function(e){
    e.stopPropagation(); /* 커리큘럼 등 자체 키보드 내비게이션 페이지로 새지 않게 */
    if(e.key==='Escape'){close();return;}
    var as=res.querySelectorAll('a');if(!as.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,as.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();as[sel].click();return;}
    else return;
    as.forEach(function(a,i){a.classList.toggle('sel',i===sel)});
    if(as[sel])as[sel].scrollIntoView({block:'nearest'});
  });
});
</script>

<script>
(async function () {
  'use strict';
  const body = document.getElementById('body');

  /* ── 색인 읽기 ─────────────────────────────────────────── */
  let index, data, version;

  try {
    index = G.checkSchema(await G.loadJSON(G.at('versions.json')),
                          'foothold-gallery-index/');
  } catch (err) {
    body.appendChild(G.warn('판 목록을 읽지 못했습니다. ' + err.message, true));
    return;
  }

  /* **축 2 색인이 있는 판만 고를 수 있다.** 없는 판을 고르게 두면 빈 화면이
   * 된다. `versions.json` 이 적어 준 것만 믿는다. */
  const withAxis2 = (index.versions || []).filter(v => v.axis2 && v.axis2.index);

  if (!withAxis2.length) {
    body.appendChild(G.warn(
      '축 2 색인을 가진 판이 아직 없습니다. `gallery_axis2.py` 를 돌린 뒤 ' +
      '`gallery_versions.py` 로 판 목록을 다시 만드십시오.', true));
    return;
  }

  const allowed = { v: withAxis2.map(v => v.version) };
  const read = G.readParams(allowed);
  version = read.value.v || withAxis2[0].version;

  const picked = withAxis2.find(v => v.version === version);

  try {
    data = G.checkSchema(await G.loadJSON(G.at(picked.axis2.index)),
                         'foothold-gallery-axis2/');
  } catch (err) {
    body.appendChild(G.warn('축 2 색인을 읽지 못했습니다. ' + err.message, true));
    return;
  }

  /* 시나리오도 색인에 있는 것만 받는다. */
  const allowed2 = { scenario: data.facets.scenario, v: allowed.v };
  const read2 = G.readParams(allowed2);
  const rejected = read.rejected.concat(read2.rejected)
    .filter((x, i, a) => a.indexOf(x) === i);

  let scenario = read2.value.scenario || data.scenarios[0].id;

  /* 열 차례는 **갤러리와 같은 규칙**을 쓴다 (`G.lineage`). 여기 따로 적으면
   * 갈라진다. 축 2 는 판이 셋뿐이라 셋을 다 보인다. */
  const models = G.lineage(Object.keys(data.models || {}));
  const cellOf = {};
  (data.cells || []).forEach(c => { cellOf[c.scenario + '|' + c.model] = c; });
  const scOf = {};
  (data.scenarios || []).forEach(s => { scOf[s.id] = s; });

  /* ── 재생 묶기. `compare` 와 **같은 것을 쓴다** ──────────── */
  const endedTag = {};
  let ui = null;

  const group = G.syncGroup({
    onClock: t => { if (ui) ui.clock.textContent = t; },
    onButton: t => { if (ui) ui.button.textContent = t; },
    onNote: t => { if (ui) ui.note.textContent = t; },
    onEnded: (key, done) => { if (endedTag[key]) endedTag[key].hidden = !done; }
  });

  /* ── 숫자를 글자로 ─────────────────────────────────────── */

  /* 자릿수는 **값의 크기로** 정한다. 비율 0.03 을 「0.0」 으로 적으면
   * 0 과 구별이 안 된다. */
  function num(v) {
    if (v === null || v === undefined || !isFinite(v)) return '측정값 없음';
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a < 0.01) return v.toFixed(4);
    if (a < 1) return v.toFixed(3);
    if (a < 10) return v.toFixed(2);
    return v.toFixed(1);
  }

  /* **좋고 나쁨을 색으로 말하지 않는다.** 문턱을 안 정했으니 어디부터
   * 나쁜지 우리가 모른다. 색을 칠하면 모르는 것을 아는 척하게 된다.
   * 대신 «1.00 에서 얼마나 떨어졌나» 처럼 읽는 법을 글로 적는다. */
  function readAs(cell) {
    const head = cell.headline;
    if (head.good === 'one') {
      if (head.value === null || head.value === undefined) return '';
      const d = head.value - 1;
      if (Math.abs(d) < 0.005) return '명령과 거의 같다';
      return d > 0 ? '명령보다 ' + num(d) + ' 넘어섰다'
                   : '명령보다 ' + num(-d) + ' 못 미쳤다';
    }
    if (head.good === 'low') {
      const n = cell.envs || 0;
      const k = Math.round((head.value || 0) * n);
      return n ? k + ' / ' + n + ' env' : '';
    }
    return '';
  }

  /* ── 그리기 ────────────────────────────────────────────── */

  function push(replace) {
    G.writeParams({
      v: withAxis2.length > 1 ? version : null,
      scenario: scenario === data.scenarios[0].id ? null : scenario
    }, replace);
  }

  function axisTabs() {
    const wrap = G.el('div', { class: 'viewsw' });
    const one = (href, text, on) => {
      const a = G.el('a', { class: 'rb' + (on ? ' on' : ''), href: href, text: text });
      if (on) a.setAttribute('aria-current', 'page');
      return a;
    };
    /* **절대경로로 적는다.** 이 페이지는 `/gallery/axis2` (슬래시 없이) 로
     * 서빙되므로 상대경로는 한 칸 위로 풀린다. 갤러리 첫 화면에서 같은
     * 실수로 404 를 낸 적이 있다 `확인됨`. */
    wrap.appendChild(one('/gallery/view?v=' + encodeURIComponent(version),
                         '축 1 · 험지 통과', false));
    wrap.appendChild(one('#', data.label || '축 2 · 명령 응답', true));
    return wrap;
  }

  function scenarioRows() {
    const wrap = G.el('div', { class: 'tgrp' });

    (data.groups || []).forEach(g => {
      const list = (data.scenarios || []).filter(s => s.group === g.id);
      if (!list.length) return;

      const row = G.el('div', { class: 'frow tset' }, [
        G.el('span', { class: 'flabel', text: g.label + ' ' + list.length + '종' })
      ]);

      list.forEach(s => {
        const on = scenario === s.id;
        const n = models.filter(m => cellOf[s.id + '|' + m]).length;
        const chip = G.el('button', {
          class: 'chip', type: 'button',
          'aria-pressed': on ? 'true' : 'false',
          disabled: (n === 0 && !on) || null
        }, [G.el('span', { text: s.label }),
            G.el('span', { class: 'n', text: String(n) })]);
        chip.addEventListener('click', () => {
          if (on) return;
          scenario = s.id; push(); draw();
        });
        row.appendChild(chip);
      });

      wrap.appendChild(row);
      wrap.appendChild(G.el('div', { class: 'note' },
                            [G.el('span', { text: g.note })]));
    });

    return wrap;
  }

  function column(model) {
    const cell = cellOf[scenario + '|' + model];
    const col = G.el('div', { class: 'col' });
    const head = G.el('div', { class: 'colhead' });

    head.appendChild(G.el('div', { class: 'chead' }, [
      G.el('b', { text: model }),
      G.el('span', { class: 'tag ' + (data.judged ? 'main' : 'warn'),
                     text: data.badge })
    ]));

    const score = G.el('div', { class: 'colscore' });

    if (!cell) {
      score.appendChild(G.el('span', { class: 'tag stop', text: '미측정' }));
      score.appendChild(G.el('span', { class: 'sub',
        text: '이 판은 이 시나리오를 돌리지 않았습니다' }));
      head.appendChild(score);
      col.appendChild(head);
      return col;
    }

    const mt = (data.metrics || {})[cell.headline.metric] || {};

    /* **성공률처럼 보이는 큰 숫자를 쓰지 않는다** (팀장: 「평가 대상은
     * 아니고 기록」). `big` 은 축 1 의 성공률 자리다. 여기서는 한 단계
     * 작은 글자로 두고 무엇을 잰 값인지 이름을 먼저 적는다. */
    score.appendChild(G.el('span', { class: 'sub', text: mt.label || cell.headline.metric }));
    score.appendChild(G.el('span', { class: 'num', text: num(cell.headline.value) }));

    const how = readAs(cell);
    if (how) score.appendChild(G.el('span', { class: 'sub', text: how }));

    score.appendChild(G.el('span', { class: 'sub', text: 'env ' + cell.envs + ' 칸' }));

    Object.entries(cell.extra || {}).forEach(([k, v]) => {
      const t = (data.metrics || {})[k] || {};
      score.appendChild(G.el('span', { class: 'sub',
        text: (t.label || k) + ' ' + num(v) + (t.unit ? ' ' + t.unit : '') }));
    });

    if (Object.keys(cell.yaw_follow_ratio || {}).length) {
      score.appendChild(G.el('span', { class: 'sub mono',
        text: '요 추종비 ' + Object.entries(cell.yaw_follow_ratio)
          .map(([k, v]) => k + ' ' + num(v)).join(' · ') }));
    }

    head.appendChild(score);
    col.appendChild(head);

    const box = G.el('div', { class: 'slot' });
    const video = G.video({ preload: 'auto' });
    const src = G.at(picked.folder + '/' + cell.clip.file);

    if (cell.clip.poster) {
      video.poster = G.at(picked.folder + '/' + cell.clip.poster);
    }
    video.src = src;

    const tag = G.el('span', { class: 'ended', text: '영상 종료', hidden: true });
    box.appendChild(video);
    box.appendChild(tag);
    endedTag[model] = tag;
    group.add(model, video, cell.clip.seconds);
    video.addEventListener('click', () => group.toggle());
    col.appendChild(box);

    col.appendChild(G.el('div', { class: 'cut' }, [
      G.el('figcaption', {}, [
        G.el('div', { class: 'meta' }, [
          G.el('span', { class: 'mono', text: scenario }),
          G.el('span', { text: (cell.clip.seconds || 0).toFixed(1) + '초' }),
          G.el('span', { text: (cell.clip.bytes / 1048576).toFixed(1) + ' MB' })
        ])
      ])
    ]));

    return col;
  }

  function draw() {
    group.clear();
    models.forEach(m => delete endedTag[m]);
    ui = null;
    body.textContent = '';

    if (rejected.length) {
      body.appendChild(G.warn('링크의 ' + rejected.join(' · ') +
        ' 은 지금 색인에 없는 값입니다. 다른 값으로 몰래 바꾸지 않았습니다.', true));
    }

    /* 판 고르개는 축 2 를 가진 판이 둘 이상일 때만 낸다. */
    if (withAxis2.length > 1) {
      const row = G.el('div', { class: 'frow' }, [
        G.el('span', { class: 'flabel', text: '판' })
      ]);
      withAxis2.forEach(v => {
        const on = v.version === version;
        const chip = G.el('button', { class: 'chip', type: 'button',
                                      'aria-pressed': on ? 'true' : 'false' },
                          [G.el('span', { text: 'gallery-' + v.version })]);
        chip.addEventListener('click', () => {
          if (on) return;
          location.search = '?v=' + encodeURIComponent(v.version);
        });
        row.appendChild(chip);
      });
      body.appendChild(row);
    }

    body.appendChild(scenarioRows());

    const s = scOf[scenario] || {};

    /* 이 시나리오가 무엇을 묻는지. **프로브가 적어 둔 글을 그대로 쓴다.** */
    const about = G.el('div', { class: 'cmpcond' }, [
      G.el('b', { text: s.label + ' · ' }),
      G.el('span', { text: s.what || '' })
    ]);
    if (s.duration_s) {
      about.appendChild(G.el('span', { class: 'mono',
        text: '  ' + s.duration_s + '초' }));
    }
    if (s.commanded_vx_mps) {
      about.appendChild(G.el('span', { class: 'mono',
        text: '  명령 ' + s.commanded_vx_mps.toFixed(2) + ' m/s' }));
    }
    body.appendChild(about);

    /* 앞 구간을 재기에서 빼는 시나리오는 **화면에서도 말해 준다.**
     * 컷에는 20 초가 다 나오는데 표는 5 초 뒤부터만 센다. */
    if (s.skip_s) {
      body.appendChild(G.warn(
        '이 시나리오는 앞 ' + s.skip_s + '초를 재기에서 뺍니다 (가속 구간). ' +
        '컷에는 처음부터 다 나오므로, 위 숫자와 같은 구간을 보려면 ' +
        s.skip_s + '초 뒤부터 보십시오.'));
    }

    /* 관문 자는 «적기만» 한다. 통과·미달을 찍지 않는다. */
    if ((s.thresholds || []).length) {
      body.appendChild(G.el('div', { class: 'note' }, [
        G.el('b', { text: '아홉 관문이 이 시나리오에 대는 자 · ' }),
        G.el('span', { class: 'mono', text: s.thresholds.map(t =>
          t.metric + ' ' + t.op + ' ' + t.limit +
          (t.per_step ? ' (요 명령 네 크기 각각)' : '')).join('  ·  ') })
      ]));
    }

    body.appendChild(G.warn(data.why_not_judged));
    body.appendChild(G.warn(data.not_the_verdict));

    ui = G.transport(group);
    body.appendChild(ui.row);
    group.clock();

    const cmp = G.el('div', { class: 'cmp' });
    models.forEach(m => cmp.appendChild(column(m)));
    body.appendChild(cmp);

    body.appendChild(G.el('p', { class: 'cmpnote' }, [
      G.el('b', { text: '컷과 숫자는 같은 실행에서 나왔습니다. ' }),
      G.el('span', { text: '옆에 적은 값은 그 실행의 env ' +
        data.protocol.num_envs + '칸 집계이고, 컷은 그중 한 칸입니다. ' +
        '한 칸이 ' + data.protocol.num_envs + '칸을 대표한다고 읽지 마십시오.' })
    ]));

    const foot = document.getElementById('foot');
    foot.textContent = '하네스 ' + data.protocol.harness + ' · env ' +
      data.protocol.num_envs + ' · 시드 ' + data.protocol.seed + ' · ' +
      data.protocol.terrain + ' · 평가 ' +
      (data.evaluated_at ? data.evaluated_at.slice(0, 10) : '미기록');
  }

  document.getElementById('axistab').appendChild(axisTabs());
  window.addEventListener('popstate', () => location.reload());
  if (!rejected.length) push(true);
  draw();
})();
</script>
</body>
</html>
