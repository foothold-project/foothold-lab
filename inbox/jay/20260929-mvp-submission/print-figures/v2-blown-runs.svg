an x="265" dy="0">0.1</tspan></text><text x="322" y="386" font-size="13" fill="#161c26" font-weight="400"><tspan x="322" dy="0">scalar</tspan></text><rect x="387" y="375" width="280" height="9" fill="#eeece6" stroke="none"/><rect x="387" y="375" width="280.0" height="9" fill="#0e7a6e" stroke="none"/><text x="681" y="386" font-size="14" fill="#0e7a6e" font-weight="700"><tspan x="681" dy="0">3000</tspan></text><text x="733" y="386" font-size="13" fill="#0e7a6e" font-weight="400"><tspan x="733" dy="0">완주</tspan></text><text x="12" y="434" font-size="14" fill="#4a5566" font-weight="400"><tspan x="12" dy="0">시드 43 은 0.01 5 판(이름 4)이 다 죽고 0.1 하나가 살았다 · 시드 44 는 0.01 3 판 중 2 이 죽고 log 하나가 살</tspan><tspan x="12" dy="21.0">았다</tspan></text><text x="12" y="486.0" font-size="14" fill="#4a5566" font-weight="400"><tspan x="12" dy="0">그런데 log 에 0.1 을 함께 준 판도 2900 에서 죽었다. 매개화가 원인이라는 가설이 반증됐다</tspan></text><text x="12" y="517.0" font-size="14" fill="#4a5566" font-weight="400"><tspan x="12" dy="0">표본이 작고 조건이 통제되지 않았다. 단일 원인을 특정하지 못한다. 다만 «모든 판에 똑같이 있던 것» 이 하나 있다</tspan><tspan x="12" dy="21.0"> · resume</tspan></text></svg>