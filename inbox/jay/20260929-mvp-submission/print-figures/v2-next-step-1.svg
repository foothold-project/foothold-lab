<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Malgun Gothic, sans-serif"><ns0:text x="12" y="25" font-size="20" fill="#161c26" font-weight="700"><ns0:tspan x="12" dy="0">여기까지 무엇을 세웠고, 다음은 어디를 건드리나</ns0:tspan></ns0:text><ns0:text x="12" y="53" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="12" dy="0">정책 수준(보상·명령)의 탐색은 멈출 선에 닿았다. 다음은 관측이다</ns0:tspan></ns0:text><ns0:rect x="0" y="73" width="800" height="200" fill="#eeece6" stroke="none" /><ns0:text x="18" y="101" font-size="17" fill="#161c26" font-weight="700"><ns0:tspan x="18" dy="0">① 지금 정책이 보는 것</ns0:tspan></ns0:text><ns0:text x="18" y="127" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="18" dy="0">env.yaml 의 observations.policy 여덟 항목</ns0:tspan></ns0:text><ns0:rect x="14" y="136" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="23" y="155" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="23" dy="0">base_lin_vel</ns0:tspan></ns0:text><ns0:rect x="14" y="167" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="23" y="186" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="23" dy="0">base_ang_vel</ns0:tspan></ns0:text><ns0:rect x="14" y="198" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="23" y="217" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="23" dy="0">projected_gravity</ns0:tspan></ns0:text><ns0:rect x="14" y="229" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="23" y="248" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="23" dy="0">velocity_commands</ns0:tspan></ns0:text><ns0:rect x="406" y="136" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="415" y="155" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="415" dy="0">joint_pos</ns0:tspan></ns0:text><ns0:rect x="406" y="167" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="415" y="186" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="415" dy="0">joint_vel</ns0:tspan></ns0:text><ns0:rect x="406" y="198" width="376" height="27" fill="#fff" stroke="none" /><ns0:text x="415" y="217" font-size="14" fill="#161c26" font-weight="400"><ns0:tspan x="415" dy="0">actions</ns0:tspan></ns0:text><ns0:rect x="406" y="229" width="376" height="27" fill="#e0f0ed" stroke="none" /><ns0:text x="415" y="248" font-size="14" fill="#0e7a6e" font-weight="400"><ns0:tspan x="415" dy="0">height_scan</ns0:tspan></ns0:text><ns0:text x="595" y="248" font-size="13" fill="#0e7a6e" font-weight="400"><ns0:tspan x="595" dy="0">여기가 다음 자리</ns0:tspan></ns0:text><ns0:text x="18" y="310" font-size="17" fill="#0e7a6e" font-weight="700"><ns0:tspan x="18" dy="0">② 신경망을 바꿔도 남는 것</ns0:tspan></ns0:text><ns0:rect x="18" y="326" width="3" height="35" fill="#0e7a6e" stroke="none" /><ns0:text x="30" y="341" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">평가 하네스</ns0:tspan></ns0:text><ns0:text x="235" y="341" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">지형에 올리고 행동만 잰다. 관측이 무엇이든 상관없다</ns0:tspan></ns0:text><ns0:rect x="18" y="374" width="3" height="35" fill="#0e7a6e" stroke="none" /><ns0:text x="30" y="389" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">기준선 숫자</ns0:tspan></ns0:text><ns0:text x="235" y="389" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">새 구조가 넘어야 할 선. 없으면 «더 낫다» 를 반증 못 한다</ns0:tspan></ns0:text><ns0:rect x="18" y="422" width="3" height="35" fill="#0e7a6e" stroke="none" /><ns0:text x="30" y="437" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">환경의 함정</ns0:tspan></ns0:text><ns0:text x="235" y="437" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">커리큘럼 붕괴 · ang_vel_z 와 heading 의 한 쌍</ns0:tspan></ns0:text><ns0:rect x="18" y="470" width="3" height="35" fill="#0e7a6e" stroke="none" /><ns0:text x="30" y="485" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">명령·보상 설정</ns0:tspan></ns0:text><ns0:text x="235" y="485" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">새 구조도 명령을 받고 보상으로 배운다</ns0:tspan></ns0:text><ns0:rect x="18" y="518" width="3" height="35" fill="#0e7a6e" stroke="none" /><ns0:text x="30" y="533" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">멈출 기준</ns0:tspan></ns0:text><ns0:text x="235" y="533" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">시드 폭보다 작은 차이는 차이가 아니다</ns0:tspan></ns0:text><ns0:text x="18" y="600" font-size="17" fill="#a86a08" font-weight="700"><ns0:tspan x="18" dy="0">③ 다음 단계가 답할 물음</ns0:tspan></ns0:text><ns0:rect x="18" y="616" width="3" height="35" fill="#a86a08" stroke="none" /><ns0:text x="30" y="631" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">관측을 무엇으로 채울까</ns0:tspan></ns0:text><ns0:text x="235" y="631" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">지금은 발밑 격자를 직접 읽는다</ns0:tspan></ns0:text><ns0:rect x="18" y="664" width="3" height="35" fill="#a86a08" stroke="none" /><ns0:text x="30" y="679" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">어떻게 압축할까</ns0:tspan></ns0:text><ns0:text x="235" y="679" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">격자 그대로 넣을까 · 요약해 넣을까</ns0:tspan></ns0:text><ns0:rect x="18" y="712" width="3" height="35" fill="#a86a08" stroke="none" /><ns0:text x="30" y="727" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">기억을 둘까</ns0:tspan></ns0:text><ns0:text x="235" y="727" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">지금은 한 시점만 본다</ns0:tspan></ns0:text><ns0:rect x="18" y="760" width="3" height="35" fill="#a86a08" stroke="none" /><ns0:text x="30" y="775" font-size="14" fill="#161c26" font-weight="700"><ns0:tspan x="30" dy="0">못 본 자리를 어떻게 메울까</ns0:tspan></ns0:text><ns0:text x="235" y="775" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="235" dy="0">가려진 곳의 값을 무엇으로 둘까</ns0:tspan></ns0:text><ns0:text x="12" y="842" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="12" dy="0">버려지는 것은 가중치 파일 하나다. 관측 차원이 바뀌면 resume 이 안 되므로 체크포인트는 못 쓴다.</ns0:tspan></ns0:text><ns0:text x="12" y="872.0" font-size="14" fill="#4a5566" font-weight="400"><ns0:tspan x="12" dy="0">그 외는 남는다. 그래서 신경망 교체가 예정돼 있으면 정책 탐색은 멈출 선에 닿는 순간 멈추는 것이 맞다.</ns0:tspan></ns0:text></ns0:svg>