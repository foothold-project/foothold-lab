<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" width="800" height="488" font-family="Malgun Gothic, sans-serif"><text x="12" y="25" font-size="18" fill="#161c26" font-weight="700"><tspan x="12" dy="0">한 칸씩 바꿔서 여기까지 왔다</tspan></text><text x="12" y="52" font-size="13" fill="#161c26" font-weight="400"><tspan x="12" dy="0">가로 막대는 난이도 0.5 의 48 칸 평균 % · 오른쪽은 그 판에서 «무엇을 바꿨나»</tspan></text><text x="12" y="78" font-size="13" fill="#161c26" font-weight="400"><tspan x="12" dy="0">E · F · G 는 D 에서 «두 칸» 씩 바뀌었다 (lin_vel_x 하한 0.4 가 공통)</tspan></text><rect x="0" y="94" width="800" height="32" fill="#f6f5f1" stroke="none"/><text x="12" y="115" font-size="14" fill="#161c26" font-weight="700"><tspan x="12" dy="0">NVIDIA</tspan></text><rect x="132" y="104" width="102.92500000000001" height="11" fill="#4a5566" stroke="none"/><text x="397" y="115" font-size="14" fill="#0e7a6e" font-weight="700"><tspan x="397" dy="0">41.17</tspan></text><text x="465" y="115" font-size="13" fill="#4a5566" font-weight="400"><tspan x="465" dy="0">출발점 · 학습 6종</tspan></text><text x="14" y="148" font-size="14" fill="#161c26" font-weight="700"><tspan x="14" dy="0">A · B</tspan></text><rect x="132" y="137" width="222.2" height="11" fill="#0e7a6e" stroke="none"/><text x="397" y="148" font-size="14" fill="#0e7a6e" font-weight="700"><tspan x="397" dy="0">88.88</tspan></text><text x="465" y="148" font-size="13" fill="#4a5566" font-weight="400"><tspan x="465" dy="0">학습에 틈을 넣는다</tspan></text><rect x="0" y="160" width="800" height="32" fill="#f6f5f1" stroke="none"/><text x="16" y="181" font-size="14" fill="#161c26" font-weight="700"><tspan x="16" dy="0">D</tspan></text><rect x="132" y="170" width="217.975" height="11" fill="#0e7a6e" stroke="none"/><text x="397" y="181" font-size="14" fill="#0e7a6e" font-weight="700"><tspan x="397" dy="0">87.19</tspan></text><text x="465" y="181" font-size="13" fill="#4a5566" font-weight="400"><tspan x="465" dy="0">명령 다섯을 되돌린다</tspan></text><text x="18" y="214" font-size=