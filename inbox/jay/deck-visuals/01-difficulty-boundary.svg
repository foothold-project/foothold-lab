<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">성공률이 아니라 난이도 경계의 이동</title>
  <desc id="desc">현재 정책의 통과 경계와 파인튜닝 뒤 목표 경계를 비교하는 개념도</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/></marker>
    <style>
      text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#1a1a1a}.muted{fill:#6b6865}.small{font-size:15px}.tiny{font-size:13px}.label{font-size:18px;font-weight:700}.title{font-size:34px;font-weight:800}.accent{fill:#c2410c}.grid{stroke:#dedad6;stroke-width:1}.axis{stroke:#4a4a4a;stroke-width:2}.base{fill:none;stroke:#4a4a4a;stroke-width:5}.target{fill:none;stroke:#c2410c;stroke-width:6;stroke-dasharray:12 8}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="54" class="small accent" font-weight="700">KPI 전환 · 개념도</text>
  <text x="60" y="96" class="title">성공률이 아니라 난이도 경계의 이동</text>
  <text x="60" y="127" class="small muted">쉬운 맵에서 점수를 올리는 대신, 같은 평가 규칙에서 통과 가능한 경계를 오른쪽으로 민다.</text>

  <rect x="70" y="165" width="790" height="400" rx="5" fill="#faf9f8" stroke="#cfcbc7"/>
  <line x1="135" y1="205" x2="135" y2="505" class="axis"/>
  <line x1="135" y1="505" x2="815" y2="505" class="axis"/>
  <line x1="135" y1="430" x2="815" y2="430" class="grid"/>
  <line x1="135" y1="355" x2="815" y2="355" class="grid"/>
  <line x1="135" y1="280" x2="815" y2="280" class="grid"/>
  <line x1="135" y1="205" x2="815" y2="205" class="grid"/>
  <text x="95" y="510" class="tiny muted">0</text><text x="88" y="435" class="tiny muted">25</text><text x="88" y="360" class="tiny muted">50</text><text x="88" y="285" class="tiny muted">75</text><text x="80" y="210" class="tiny muted">100</text>
  <text x="148" y="536" class="small muted">낮음</text><text x="770" y="536" class="small muted">높음</text>
  <text x="402" y="554" class="small" font-weight="700">지형 난이도</text>
  <text x="39" y="393" class="small" font-weight="700" transform="rotate(-90 39 393)">통과율 (%)</text>

  <path d="M150 222 C265 224 350 240 420 278 C475 308 510 358 540 480" fill="none" stroke="#4a4a4a" stroke-width="5"/>
  <path d="M150 217 C330 219 470 230 560 270 C630 302 685 355 724 478" fill="none" stroke="#c2410c" stroke-width="6" stroke-dasharray="12 8"/>
  <line x1="493" y1="374" x2="672" y2="374" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="522" y="331" width="127" height="32" rx="16" fill="#fff3ea" stroke="#c2410c"/>
  <text x="585" y="353" class="small accent" text-anchor="middle" font-weight="700">경계 +25%</text>
  <circle cx="482" cy="344" r="7" fill="#4a4a4a"/><circle cx="659" cy="344" r="8" fill="#c2410c"/>
  <text x="395" y="327" class="small" font-weight="700">기준선 경계</text>
  <text x="670" y="327" class="small accent" font-weight="700">목표 경계</text>
  <text x="145" y="190" class="tiny muted">통과율이 급격히 낮아지는 지점</text>

  <rect x="900" y="165" width="250" height="252" rx="5" fill="#1a1a1a"/>
  <text x="928" y="207" font-size="16" style="fill:#ffffff" font-weight="700">발표에서 말할 한 문장</text>
  <text x="928" y="254" font-size="26" style="fill:#ffffff" font-weight="800">같은 시험에서</text>
  <text x="928" y="290" font-size="26" style="fill:#ffffff" font-weight="800">더 어려운 지형을</text>
  <text x="928" y="326" font-size="26" style="fill:#f28c52" font-weight="800">통과하게 만든다.</text>
  <line x1="928" y1="350" x2="1118" y2="350" stroke="#77716c"/>
  <text x="928" y="379" font-size="14" style="fill:#d8d4d0">기존 통과 5종은 비후퇴 조건</text>

  <rect x="900" y="437" width="250" height="128" rx="5" fill="#fff3ea" stroke="#e3a27b"/>
  <text x="925" y="474" class="label accent">미측정</text>
  <text x="925" y="504" class="small">곡선과 +25% 위치는 목표 표현이다.</text>
  <text x="925" y="531" class="small">경계 그리드 실측 뒤 좌표를 교체한다.</text>
  <text x="60" y="631" class="tiny muted">근거: docs/DECISIONS.md · inbox/jay/20260902-기준선-재정립-HANDOFF.md</text>
</svg>
