<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 130 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">성공률이 아니라 난이도 경계의 이동</title>
  <desc id="desc">현재 정책의 통과 경계와 파인튜닝 뒤 목표 경계를 비교하는 개념도</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a86a08"/></marker>
    <style>
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#161c26}.muted{fill:#4a5566}.small{font-size:15px}.tiny{font-size:13px}.label{font-size:18px;font-weight:700}.title{font-size:34px;font-weight:800}.accent{fill:#a86a08}.grid{stroke:#d9d6cd;stroke-width:1}.axis{stroke:#4a5566;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f6f5f1"/>

  <rect x="70" y="165" width="790" height="400" rx="5" fill="#ffffff" stroke="#d9d6cd"/>
  <line x1="135" y1="205" x2="135" y2="505" class="axis"/>
  <line x1="135" y1="505" x2="815" y2="505" class="axis"/>
  <line x1="135" y1="430" x2="815" y2="430" class="grid"/>
  <line x1="135" y1="355" x2="815" y2="355" class="grid"/>
  <line x1="135" y1="280" x2="815" y2="280" class="grid"/>
  <line x1="135" y1="205" x2="815" y2="205" class="grid"/>
  <text x="95" y="510" class="tiny muted">0</text><text x="88" y="435" class="tiny muted">25</text><text x="88" y="360" class="tiny muted">50</text><text x="88" y="285" class="tiny muted">75</text><text x="80" y="210" class="tiny muted">100</text>
  <text x="148" y="536" class="small muted">낮음</text><text x="770" y="536" class="small muted">높음</text>
  <text x="402" y="554" class="small" font-weight="700">지형 난이도</text>
  <text x="39" y="393" class="small" font-weight="700" transform="rotate(-90 39 393)">통과율 (%)</text>

  <path d="M150 222 C265 224 350 240 420 278 C475 308 510 358 540 480" fill="none" stroke="#4a5566" stroke-width="5"/>
  <path d="M150 217 C330 219 470 230 560 270 C630 302 685 355 724 478" fill="none" stroke="#a86a08" stroke-width="6" stroke-dasharray="12 8"/>
  <line x1="493" y1="374" x2="672" y2="374" stroke="#a86a08" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="522" y="331" width="127" height="32" rx="16" fill="#fbf0dc" stroke="#a86a08"/>
  <text x="585" y="353" class="small accent" text-anchor="middle" font-weight="700">경계 +25%</text>
  <circle cx="482" cy="344" r="7" fill="#4a5566"/><circle cx="659" cy="344" r="8" fill="#a86a08"/>
  <text x="395" y="327" class="small" font-weight="700">기준선 경계</text>
  <text x="670" y="327" class="small accent" font-weight="700">목표 경계</text>
  <text x="145" y="190" class="tiny muted">통과율이 급격히 낮아지는 지점</text>

  <rect x="900" y="165" width="250" height="252" rx="5" fill="#ffffff" stroke="#d9d6cd"/>
  <text x="928" y="207" font-size="16" style="fill:#0e7a6e" font-weight="700">KPI</text>
  <text x="928" y="254" font-size="26" font-weight="800">같은 시험에서</text>
  <text x="928" y="290" font-size="26" font-weight="800">통과 가능한 경계를</text>
  <text x="928" y="326" font-size="26" style="fill:#0e7a6e" font-weight="800">넓힌다</text>
  <line x1="928" y1="350" x2="1118" y2="350" stroke="#d9d6cd"/>
  <text x="928" y="379" font-size="14" style="fill:#4a5566">기존 통과 5종은 95% 이상 유지</text>

  <rect x="900" y="437" width="250" height="128" rx="5" fill="#fbf0dc" stroke="#a86a08"/>
  <text x="925" y="474" class="label accent">목표 · +25%</text>
  <text x="925" y="504" class="small">현재는 측정 구조를 제시한다.</text>
  <text x="925" y="531" class="small">실측 뒤 경계 좌표를 표시한다.</text>
</svg>
