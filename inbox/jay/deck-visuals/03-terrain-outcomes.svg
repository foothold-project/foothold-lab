<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">미경험 10종 결과와 실패 병목</title>
  <desc id="desc">다섯 지형 통과와 다섯 지형 실패를 원인별로 묶은 결과 지도</desc>
  <defs><style>
    text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#1a1a1a}.title{font-size:32px;font-weight:800}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#6b6865}.accent{fill:#c2410c}.chip{fill:#f1efed;stroke:#c9c4bf}.fail{fill:#fff3ea;stroke:#c2410c;stroke-width:1.5}.dark{fill:#1a1a1a}
  </style></defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="56" y="52" class="small accent" font-weight="700">확인됨 · NVIDIA 정책 · 1,000판</text>
