<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 140 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">같은 주행에서 판정 시점이 바꾸는 방향 결과</title>
  <desc id="desc">10미터 관문과 에피소드 끝의 방향 판정을 구분하는 설명도</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a86a08"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#161c26}.title{font-size:31px;font-weight:800}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#4a5566}.accent{fill:#a86a08}.metric{font-size:24px;font-weight:800}</style>
  </defs>
  <rect width="1200" height="675" fill="#f6f5f1"/>

  <rect x="55" y="158" width="750" height="368" rx="5" fill="#ffffff" stroke="#d9d6cd"/>
  <rect x="105" y="298" width="640" height="70" fill="#e0f0ed"/>
  <line x1="105" y1="333" x2="745" y2="333" stroke="#7c8798" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="105" y1="298" x2="745" y2="298" stroke="#0e7a6e" stroke-width="1.5"/>
  <line x1="105" y1="368" x2="745" y2="368" stroke="#0e7a6e" stroke-width="1.5"/>
  <text x="118" y="286" class="tiny accent" font-weight="700">허용 복도 +5 cm</text><text x="118" y="388" class="tiny accent" font-weight="700">허용 복도 -5 cm</text>
  <circle cx="125" cy="333" r="9" fill="#161c26"/><text x="111" y="414" class="small" font-weight="700">출발</text>
  <path d="M125 333 C245 329 335 326 430 309 C520 292 602 250 720 205" fill="none" stroke="#161c26" stroke-width="6" stroke-linecap="round"/>
  <line x1="525" y1="190" x2="525" y2="470" stroke="#a86a08" stroke-width="3"/>
  <text x="525" y="181" class="small accent" text-anchor="middle" font-weight="800">10 m 관문</text>
  <circle cx="525" cy="280" r="10" fill="#a86a08"/>
  <rect x="408" y="418" width="234" height="72" rx="4" fill="#fbf0dc" stroke="#a86a08"/>
  <text x="525" y="446" class="small accent" text-anchor="middle" font-weight="700">10 m 도달 순간 방향 판정</text>
  <text x="525" y="477" font-size="25" class="accent" text-anchor="middle" font-weight="800">33 / 100</text>

  <circle cx="720" cy="205" r="10" fill="#161c26"/>
  <line x1="720" y1="205" x2="752" y2="185" stroke="#a86a08" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="568" y="181" width="139" height="57" rx="4" fill="#161c26"/>
  <text x="637" y="203" class="tiny" style="fill:#ffffff" text-anchor="middle">에피소드 끝 방향 판정</text>
  <text x="637" y="226" font-size="21" style="fill:#dc9a30" text-anchor="middle" font-weight="800">2 / 100</text>
  <text x="104" y="500" class="tiny muted">20초 · 10 m · 1.0 m/s · 100판 · seed 42</text>

  <rect x="835" y="158" width="310" height="214" rx="5" fill="#161c26"/>
  <text x="860" y="194" font-size="17" style="fill:#ffffff" font-weight="700">10 m 기준 지표</text>
  <text x="860" y="237" class="small" style="fill:#adb5c1">생존</text><text x="1115" y="237" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <text x="860" y="279" class="small" style="fill:#adb5c1">전진</text><text x="1115" y="279" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <text x="860" y="321" class="small" style="fill:#adb5c1">속도</text><text x="1115" y="321" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <line x1="860" y1="337" x2="1115" y2="337" stroke="#7c8798"/>
  <text x="860" y="360" class="small" style="fill:#dc9a30" font-weight="700">방향은 판정 시점에 따라 구분</text>

  <rect x="835" y="392" width="310" height="134" rx="5" fill="#fbf0dc" stroke="#a86a08"/>
  <text x="860" y="428" font-size="18" class="accent" font-weight="800">판정 기준</text>
  <text x="860" y="458" class="small">10 m 도달 순간과 에피소드 종료점은</text>
  <text x="860" y="482" class="small">서로 다른 측정 지점이다.</text>
  <text x="860" y="506" class="small" font-weight="700">결과에는 판정 시점을 함께 표기한다.</text>
</svg>
