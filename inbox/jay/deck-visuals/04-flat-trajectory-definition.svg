<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">같은 주행에서 판정 시점이 바꾸는 방향 결과</title>
  <desc id="desc">10미터 관문과 에피소드 끝의 방향 판정을 구분하는 설명도</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c2410c"/></marker>
    <style>text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#1a1a1a}.title{font-size:31px;font-weight:800}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#6b6865}.accent{fill:#c2410c}.metric{font-size:24px;font-weight:800}</style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="55" y="51" class="small accent" font-weight="700">평지 10 m · 판정 정의 확인용 설명도</text>
  <text x="55" y="91" class="title">같은 주행도 어디에서 재느냐에 따라 방향 결과가 달라진다</text>
  <text x="55" y="120" class="small muted">실제 개별 궤적을 복원한 그림이 아니다. 10 m 관문과 에피소드 종료점의 정의 차이를 보여준다.</text>

  <rect x="55" y="158" width="750" height="368" rx="5" fill="#faf9f8" stroke="#cfcbc7"/>
  <rect x="105" y="298" width="640" height="70" fill="#fff3ea"/>
  <line x1="105" y1="333" x2="745" y2="333" stroke="#aaa49f" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="105" y1="298" x2="745" y2="298" stroke="#c2410c" stroke-width="1.5"/>
  <line x1="105" y1="368" x2="745" y2="368" stroke="#c2410c" stroke-width="1.5"/>
  <text x="118" y="286" class="tiny accent" font-weight="700">허용 복도 +5 cm</text><text x="118" y="388" class="tiny accent" font-weight="700">허용 복도 -5 cm</text>
  <circle cx="125" cy="333" r="9" fill="#1a1a1a"/><text x="111" y="414" class="small" font-weight="700">출발</text>
  <path d="M125 333 C245 329 335 326 430 309 C520 292 602 250 720 205" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="525" y1="190" x2="525" y2="470" stroke="#c2410c" stroke-width="3"/>
  <text x="525" y="181" class="small accent" text-anchor="middle" font-weight="800">10 m 관문</text>
  <circle cx="525" cy="280" r="10" fill="#c2410c"/>
  <rect x="408" y="418" width="234" height="72" rx="4" fill="#fff3ea" stroke="#c2410c"/>
  <text x="525" y="446" class="small accent" text-anchor="middle" font-weight="700">10 m 도달 순간 방향 판정</text>
  <text x="525" y="477" font-size="25" class="accent" text-anchor="middle" font-weight="800">33 / 100</text>

  <circle cx="720" cy="205" r="10" fill="#1a1a1a"/>
  <line x1="720" y1="205" x2="752" y2="185" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="568" y="181" width="139" height="57" rx="4" fill="#1a1a1a"/>
  <text x="637" y="203" class="tiny" fill="#ffffff" text-anchor="middle">에피소드 끝 방향 판정</text>
  <text x="637" y="226" font-size="21" fill="#f28c52" text-anchor="middle" font-weight="800">2 / 100</text>
  <text x="104" y="500" class="tiny muted">조건 표기 후보: 20초 · 10 m · 1.0 m/s · 100판 · seed 42</text>

  <rect x="835" y="158" width="310" height="214" rx="5" fill="#1a1a1a"/>
  <text x="860" y="194" font-size="17" style="fill:#ffffff" font-weight="700">10 m 기준 지표</text>
  <text x="860" y="237" class="small" style="fill:#d8d4d0">생존</text><text x="1115" y="237" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <text x="860" y="279" class="small" style="fill:#d8d4d0">전진</text><text x="1115" y="279" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <text x="860" y="321" class="small" style="fill:#d8d4d0">속도</text><text x="1115" y="321" class="metric" style="fill:#ffffff" text-anchor="end">100 / 100</text>
  <line x1="860" y1="337" x2="1115" y2="337" stroke="#77716c"/>
  <text x="860" y="360" class="small" style="fill:#f28c52" font-weight="700">방향은 판정 시점 확인 필요</text>

  <rect x="835" y="392" width="310" height="134" rx="5" fill="#fff3ea" stroke="#e3a27b"/>
  <text x="860" y="428" font-size="18" class="accent" font-weight="800">미확인 · 도입 전 정리</text>
  <text x="860" y="458" class="small">33/100과 2/100은 모순이 아니라</text>
  <text x="860" y="482" class="small">서로 다른 판정 시점의 값일 수 있다.</text>
  <text x="860" y="506" class="small" font-weight="700">원자료 경로와 종료 조건을 하나로 고정한다.</text>
  <text x="55" y="579" class="tiny muted">33/100: deliverables/plan/proposal.pdf · inbox/jay/20260903-report-v2-개정안.md</text>
  <text x="55" y="601" class="tiny muted">2/100: sim/eval/results/20260903-flat-10m/README.md · generalization_summary.csv</text>
  <text x="55" y="634" class="tiny accent" font-weight="700">발표에서는 판정 시점을 함께 말한다. 숫자 하나로 합치지 않는다.</text>
</svg>
