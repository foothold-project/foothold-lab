<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">두 트랙이 다섯 관문에서 합류하는 WBS</title>
  <desc id="desc">정책 평가, 디지털 트윈, 항법 인지, 공통 산출물의 관문별 작업 흐름</desc>
  <defs><style>
    text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#1a1a1a}.title{font-size:32px;font-weight:800}.small{font-size:14px}.tiny{font-size:12px}.muted{fill:#6b6865}.accent{fill:#c2410c}.row{stroke:#d8d4d0;stroke-width:1}.barA{fill:#fff3ea;stroke:#c2410c;stroke-width:1.5}.barB{fill:#f1efed;stroke:#8d8883}.barC{fill:#1a1a1a}.gate{stroke:#aaa49f;stroke-width:1.5;stroke-dasharray:4 5}
  </style></defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="52" y="52" class="small accent" font-weight="700">WBS 구조 검토본 · 진척률 미표기</text>
  <text x="52" y="92" class="title">두 트랙이 다섯 관문에서 합류한다</text>
  <text x="52" y="120" class="small muted">날짜와 작업명은 원본 WBS에서 읽고, 발표에서는 의존성과 합류 지점만 강조한다.</text>

