<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="레일즈 지형 단면 · 고리 두 개"><rect x="0.0" y="0.0" width="960.0" height="520.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="104.0" y="26.0" font-size="16" text-anchor="start" fill="#1b1b1b" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">레일즈 지형 단면 · 고리 두 개</text><text x="104.0" y="45.0" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">높이는 난이도가 정하고 두 고리가 «같다». 8·18 cm 는 «두께»(앞뒤 폭)이지 높이가 아니다.</text><rect x="100.0" y="340.0" width="800.0" height="26.0" fill="#eeeeee" fill-opacity="1.0" stroke="none" stroke-width="1"/><line x1="100.0" y1="340.0" x2="900.0" y2="340.0" stroke="#bdbdbd" stroke-width="1.5"/><rect x="276.5" y="274.9" width="18.8" height="65.1" fill="#9e9e9e" fill-opacity="1.0" stroke="#4f4f4f" stroke-width="1.2"/><text x="285.9" y="244.9" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">안쪽 고리</text><text x="285.9" y="260.9" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">두께 8 cm</text><text x="285.9" y="382.0" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">0.750 ~ 0.830 m</text><rect x="735.3" y="274.9" width="42.4" height="65.1" fill="#9e9e9e" fill-opacity="1.0" stroke="#4f4f4f" stroke-width="1.2"/><text x="756.5" y="244.9" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">바깥 고리</text><text x="756.5" y="260.9" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">두께 18 cm</text><text x="756.5" y="382.0" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">2.700 ~ 2.880 m</text><line x1="264.7" y1="340.0" x2="264.7" y2="274.9" stroke="#c62828" stroke-width="1.6"/><text x="256.7" y="307.4" font-size="12" text-anchor="end" fill="#c62828" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">높이 10.50 cm</text><text x="256.7" y="323.4" font-size="10" text-anchor="end" fill="#c62828" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">(두 고리가 같다)</text><line x1="805.9" y1="140.0" x2="805.9" y2="366.0" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/><text x="805.9" y="132.0" font-size="12" text-anchor="middle" fill="#1565c0" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">통과선 3.0 m</text><text x="104.7" y="326.0" font-size="12" text-anchor="start" fill="#1b1b1b" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">출발</text><line x1="100.0" y1="332.0" x2="100.0" y2="366.0" stroke="#1b1b1b" stroke-width="1.6"/><line x1="100.0" y1="366.0" x2="100.0" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="100.0" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">0.0</text><line x1="217.6" y1="366.0" x2="217.6" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="217.6" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">0.5</text><line x1="335.3" y1="366.0" x2="335.3" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="335.3" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">1.0</text><line x1="452.9" y1="366.0" x2="452.9" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="452.9" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">1.5</text><line x1="570.6" y1="366.0" x2="570.6" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="570.6" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">2.0</text><line x1="688.2" y1="366.0" x2="688.2" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="688.2" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">2.5</text><line x1="805.9" y1="366.0" x2="805.9" y2="372.0" stroke="#9e9e9e" stroke-width="1"/><text x="805.9" y="402.0" font-size="10" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">3.0</text><text x="500.0" y="426.0" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">출발점에서 앞으로 (m)</text><text x="100.0" y="498.0" font-size="12" text-anchor="start" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">로봇을 «사방으로» 둘러싼 네모 고리 두 겹이다. 어느 쪽으로 가든 두 번 넘는다.</text></svg>