<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img"><rect x="0" y="0" width="980" height="400" fill="#ffffff"/><text x="60" y="30" font-size="16" text-anchor="start" fill="#1b1b1b" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">표를 보고 «어느 판을 볼지» 고르는 자리가 어디냐</text><text x="60" y="50" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">네 갈래의 차이는 결국 이 순서 하나다.</text><text x="150" y="88" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">측정</text><text x="400" y="88" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">표</text><text x="560" y="88" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">고르기</text><text x="760" y="88" font-size="12" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">영상</text><text x="60" y="138" font-size="12" text-anchor="start" fill="#c62828" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">A · 측정하며 렌더</text><rect x="270" y="118" width="240" height="32" rx="4" fill="#c62828" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="270" y="118" width="240" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#c62828" stroke-width="1.2"/><text x="390.0" y="139" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">측정 + 렌더 1,000판</text><line x1="516" y1="134" x2="524" y2="134" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="530,134 523,130.5 523,137.5" fill="#6b6b6b"/><rect x="530" y="118" width="62" height="32" rx="4" fill="#f3f3f3" fill-opacity="1.0" stroke="#dcdcdc" stroke-width="1.2"/><text x="561" y="139" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">고르기</text><line x1="598" y1="134" x2="654" y2="134" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="660,134 653,130.5 653,137.5" fill="#6b6b6b"/><rect x="660" y="118" width="250" height="32" rx="4" fill="#c62828" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="660" y="118" width="250" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#c62828" stroke-width="1.2"/><text x="785" y="139" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">이미 다 찍혀 있음 · 약 3.7 GB</text><text x="925" y="139" font-size="10" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">물리 1회</text><text x="60" y="200" font-size="12" text-anchor="start" fill="#ef6c00" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">B · 골라서 다시 측정</text><rect x="270" y="180" width="200" height="32" rx="4" fill="#6b6b6b" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="270" y="180" width="200" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.2"/><text x="370.0" y="201" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">측정 (headless)</text><line x1="476" y1="196" x2="524" y2="196" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="530,196 523,192.5 523,199.5" fill="#6b6b6b"/><rect x="530" y="180" width="62" height="32" rx="4" fill="#f3f3f3" fill-opacity="1.0" stroke="#dcdcdc" stroke-width="1.2"/><text x="561" y="201" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">고르기</text><line x1="598" y1="196" x2="654" y2="196" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="660,196 653,192.5 653,199.5" fill="#6b6b6b"/><rect x="660" y="180" width="250" height="32" rx="4" fill="#ef6c00" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="660" y="180" width="250" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#ef6c00" stroke-width="1.2"/><text x="785" y="201" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">그 칸만 다시 측정 + 렌더</text><text x="925" y="201" font-size="10" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">물리 2회</text><text x="60" y="262" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">C · 상태를 남겨 두고 렌더</text><rect x="270" y="242" width="200" height="32" rx="4" fill="#2e7d32" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="270" y="242" width="200" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#2e7d32" stroke-width="1.2"/><text x="370.0" y="263" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">측정 + 상태 기록</text><line x1="476" y1="258" x2="524" y2="258" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="530,258 523,254.5 523,261.5" fill="#6b6b6b"/><rect x="530" y="242" width="62" height="32" rx="4" fill="#f3f3f3" fill-opacity="1.0" stroke="#dcdcdc" stroke-width="1.2"/><text x="561" y="263" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">고르기</text><line x1="598" y1="258" x2="654" y2="258" stroke="#6b6b6b" stroke-width="1.4"/><polygon points="660,258 653,254.5 653,261.5" fill="#6b6b6b"/><rect x="660" y="242" width="250" height="32" rx="4" fill="#2e7d32" fill-opacity="0.13" stroke="none" stroke-width="1.2"/><rect x="660" y="242" width="250" height="32" rx="4" fill="none" fill-opacity="1.0" stroke="#2e7d32" stroke-width="1.2"/><text x="785" y="263" font-size="11" text-anchor="middle" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">그 판만 렌더 (물리 없음)</text><text x="925" y="263" font-size="10" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">물리 1회</text><text x="60" y="320" font-size="12" text-anchor="start" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">A 는 고르기 «전» 에 다 찍는다. 볼 것은 열 개쯤인데 1,000판을 찍는다.</text><text x="60" y="342" font-size="12" text-anchor="start" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">B 는 고른 뒤 그 칸을 다시 돌린다. 「같은 판이 다시 나오나」를 증명해야 한다.</text><text x="60" y="364" font-size="12" text-anchor="start" fill="#1b1b1b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">C 는 물리를 한 번만 돌린다. 고른 뒤에는 저장해 둔 상태를 렌더만 한다.</text><text x="60" y="386" font-size="10" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="-apple-system,Helvetica,Arial,sans-serif">세로 위치는 순서일 뿐 시간 길이가 아니다.</text></svg>